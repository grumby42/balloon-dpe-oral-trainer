:"PTS VIII.C; BFH","q":"Cooling descent versus vented descent — when would you use each?","ans":[["B","Cooling descent (reduced or no burning) is gradual, fuel-efficient, and keeps the vent closed — good for gentle transitions. A vented descent starts the descent quickly and allows a faster rate when needed — for example to reach a lower wind layer or begin an approach — but requires care not to overvent.","Correct comparison."],["S","Cooling is slower and smoother; venting gets you down faster when you need it.","Correct core."],["W","Always vent — cooling descents are unpredictable and can't be controlled within PTS tolerance.","Cooling descents are standard technique."],["W","Cooling descents are faster because the whole envelope cools at once, unlike venting.","Reversed."]]},{"id":"VIII-D-2","a":"VIII","t":"D","d":3,"c":1,"ref":"PTS VIII.D.4; BFH","q":"You're descending at 900 fpm and see power lines ahead at your altitude. Walk me through recovery.","ans":[["B","Start a long, continuous burn immediately (BFH: about twice a normal burn) and stop as soon as the balloon reacts — lag of roughly 6–15 seconds means 90–225 ft more sink at 900 fpm. Watch envelope temperature, then manage to a safe altitude well above the lines. If clearance is in doubt, land/rip out short of the wires rather than hit them low.","Correct priorities and timing."],["S","Burn right away — a long one — and keep a close eye on clearance over the wires.","Correct core."],["W","Vent to steepen the descent and slip under the lines before they get close.","Going under wires is deadly."],["W","Short, pulsed burns to avoid overheating the envelope, then reassess in 30 seconds.","Too little, too late."]]},{"id":"VIII-E-2","a":"VIII","t":"E","d":2,"ref":"PTS VIII.E.3; BFH","q":"Contour flying over a tree line on a breezy morning — what wind effects do you expect?","ans":[["B","Mechanical turbulence and rotors on the downwind side of the tree line, possible downdrafts that push the balloon toward the trees, wind shear near the surface, and false lift on the upwind side. Fly with extra clearance, anticipate sink on the lee side, and avoid low contour flying in gusty conditions.","Correct effects."],["S","Bumpy air and sinking on the far side of the trees, so I'd give them more room.","Correct gist."],["W","Updrafts on the lee side that lift the balloon, so you can skim the treetops safely.","Lee side tends to sink."],["W","None — wind effects only matter near mountains, not over trees.","Trees produce mechanical turbulence."]]},{"id":"VIII-G-2","a":"VIII","t":"G","d":2,"c":1,"ref":"PTS VIII.G; special emphasis — wire strike avoidance","q":"There's a 400-foot radio tower a mile ahead on your track. What hazards besides the tower itself?","ans":[["B","Guy wires extending far out from the tower (often a large fraction of the tower's height in each direction), nearly invisible; possible nearby power feeds; and the tower's lighting may not show the wires. Give the entire guy-wire area a wide berth — pass well above or change altitude to change track early.","Correct key hazard."],["S","There could be cables holding it up, so I'd stay well clear rather than pass close by.","Correct gist."],["W","None, if I pass 100 feet beside it — the tower's lights mark every part of the structure.","Guy wires aren't lit and extend far out."],["W","Only radio interference, which can disrupt my handheld radio within a mile of the tower.","Misses the physical hazard."]]},{"id":"VIII-H-2","a":"VIII","t":"H","d":2,"c":1,"ref":"PTS VIII.H; Balloon Flight Manual","q":"Mid-tether session, the wind begins gusting above the manual's tether limit. Now what?","ans":[["B","Stop the tether operation: bring the balloon down, get passengers out safely with crew managing weight, deflate, and control the crowd. Gusts on tether lines create large, sudden loads and violent basket movement; free flight to escape isn't a substitute for the planned procedure.","Correct."],["S","Shut it down and get everyone off and the envelope down before the wind gets worse.","Correct core."],["W","Let out more tether line so the balloon can ride the gusts higher where it's smoother.","Increases loads and risk."],["W","Release one tether so the balloon can weathervane and reduce the loads on the others.","Unbalanced tethers worsen control."]]},{"id":"VIII-I-2","a":"VIII","t":"I","d":2,"ref":"PTS VIII.I; BFH","q":"Winter flight, snow on the ground. What landing and passenger considerations change?","ans":[["B","Snow hides ditches, fences, and rocks; depth affects how the basket stops and recovery access. Fields may be inaccessible to chase vehicles. Passengers need warm clothing and footwear; hypothermia risk if a recovery is delayed. Fuel pressure and lower burner output affect landing control.","Covers winter-specific concerns."],["S","Snow hides stuff and the crew may not get in, so passengers need to dress warmly.","Correct core."],["W","Snow makes landings safer because it cushions the basket, so choose snowy fields.","Hidden obstacles and access issues."],["W","No changes — winter only affects the fuel system, not landings or passengers.","Ignores real hazards."]]},{"id":"VIII-J-2","a":"VIII","t":"J","d":2,"ref":"PTS VIII.J; FAA-H-8083-28","q":"You see lenticular clouds over the ridge before a mountain flight. What does that tell you?","ans":[["B","Strong winds aloft flowing over the terrain creating mountain waves, with likely severe turbulence and rotors on the lee side and strong downdrafts. It's a strong no-go indicator for balloon flight in that area.","Correct interpretation."],["S","Strong wind up high over the mountains — that means rough air, so I wouldn't fly.","Correct decision."],["W","Stable, calm conditions — lenticulars form only when the air is completely still.","Lenticulars indicate strong winds."],["W","Moisture only — lenticulars mean possible light rain, so bring a cover for the basket.","Misses the turbulence indication."]]},{"id":"IX-A-3","a":"IX","t":"A","d":2,"ref":"PTS IX; BFH","q":"How do you verify your position and track when the landscape all looks the same?","ans":[["B","Correlate distinctive features (roads, rivers, railroads, towers, towns, water tanks) to chart symbols; use GPS for position, groundspeed, and track; compare with the planned trajectory; and keep the crew updated. Check altitude restrictions relative to position.","Correct technique."],["S","Use GPS mostly, and look for big things like highways or towns on the map to confirm.","Correct core."],["W","Rely on the chase crew to tell me where I am — they can see road signs from the ground.","PTS requires the pilot to verify position."],["W","Use the altimeter and compass heading to dead-reckon position over flat terrain.","Balloons have no heading control; DR by heading doesn't apply."]]},{"id":"IX-A-4","a":"IX","t":"A","d":3,"s":1,"ref":"PTS IX; 14 CFR 91.130, 91.215(b)(3), (d); 91.225(e), (g)","q":"Your track bends toward a Class C boundary and your fuel is at 40%. Lay out your options.","ans":[["B","Change altitude to find a wind carrying me away from the Class C, if available. Otherwise, land before the boundary while fuel and landing options remain. Without ADS-B/transponder I can't enter Class C or overfly it below its ceiling except under an ATC-authorized deviation (91.215(d)/91.225(g)) requested in advance; with equipment I'd still need two-way communications before entry. Decide early.","Correct prioritized options."],["S","Try a different altitude to steer away, and if that doesn't work, land before I get there.","Correct core."],["W","Call approach and enter — balloons are exempt from Class C entry rules due to limited steering.","No such exemption."],["W","Climb above the Class C ceiling, since equipment rules don't apply above controlled airspace.","Exception requires staying below the ceiling."]]},{"id":"X-A-5","a":"X","t":"A","d":2,"c":1,"ref":"PTS X.A.5; BFH","q":"Your parachute vent doesn't reseat after a pull and you're losing heat. What do you do?","ans":[["B","Try to reseat it: release the vent line fully, give a burn to build internal pressure (pressure seats the parachute), and check for snagged lines. If it won't reseat, compensate with heat within temperature limits and land at the first suitable site.","Correct procedure."],["S","Let go of the line and burn so the top pops back into place — then land if it won't stay.","Correct core."],["W","Pull the vent line harder to free the top and then release it quickly to snap it closed.","Opens the vent further."],["W","Ignore it — a partly open vent just lowers fuel efficiency and causes no real hazard.","Uncontrolled heat loss can mean an uncommanded descent."]]},{"id":"X-A-6","a":"X","t":"A","d":2,"ref":"ADM / passenger emergency (outside PTS X.A elements); 47 CFR 22.925","q":"A passenger collapses during the flight. What do you do?","ans":[["B","Fly the balloon first, then assess: get help from other passengers and use the first aid kit. Radio the chase crew to call 911 with your position (cell phones may not be used while airborne — 47 CFR 22.925). Land at the first suitable site with good access for emergency vehicles. Brief the remaining passengers.","Correct priorities."],["S","Get them help from the others, have the crew call 911, and land soon near a road.","Correct core."],["W","Descend immediately as fast as possible, since speed matters more than the landing site.","Rapid descent risks everyone."],["W","Continue the flight to the planned landing site, where the crew has the first aid kit.","Delays care."]],"s":1},{"id":"X-A-7","a":"X","t":"A","d":2,"c":1,"ref":"PTS X.A; BFH","q":"You notice a tear developing near a load tape in flight. Priorities?","ans":[["B","Monitor the damage closely, avoid aggressive maneuvers and high climb/descent rates, stay within temperature limits (more heat may be needed due to leakage), and land at the first suitable site. Brief passengers for a possibly firm landing. Inspection and repair before further flight.","Correct priorities."],["S","Get down soon and gently, keeping an eye on the tear in case it grows.","Correct core."],["W","Climb higher where the air is cooler and denser, so the envelope needs less heat.","Delays landing with worsening damage."],["W","Vent to reduce pressure on the tear and continue the flight to the planned field.","Venting isn't a fix and the flight should end."]]},{"id":"X-B-2","a":"X","t":"B","d":2,"ref":"PTS X.B; BFH","q":"You're planning a flight over the Great Lakes shoreline area. What does your emergency gear list add?","ans":[["B","Flotation (life vests) for all occupants, a means to signal, waterproofed radio (and a phone for use after landing), and a briefing on their use. Cold-water considerations: warm clothing and an emergency blanket. Consider whether the flight should be planned over water at all.","Climate/terrain-appropriate gear."],["S","Life jackets and a way to call for help if we end up in the water.","Correct core."],["W","Nothing extra — balloon baskets float, so the basket itself serves as the flotation device.","The BFH calls the basket a flotation aid — but it can invert depending on tank placement; it is no substitute for life vests and cold-water gear."],["W","A spare propane cylinder, so I can stay airborne long enough to reach the far shore.","Doesn't address water emergencies."]]},{"id":"X-C-2","a":"X","t":"C","d":3,"ref":"PTS X.C.2; BFH","q":"For an emergency water landing, why do wind and current direction matter?","ans":[["B","Wind acting on the envelope can drag the basket across the water; current moves occupants and the basket. Approach so the wind and current carry you toward shore or help, and avoid being dragged by the envelope while people are in the water — control or deflate the envelope per conditions and the manual.","Correct factors."],["S","The wind and current will move you around, so you want them taking you toward the shore.","Correct core."],["W","They don't — once in the water, the basket stays still because water drag stops all motion.","Envelope drag continues."],["W","Land facing upwind so the envelope acts as a sea anchor, and leave the deflation port closed.","Can lead to dragging occupants."]]},{"id":"X-D-2","a":"X","t":"D","d":2,"ref":"PTS X.D; BFH","q":"A dust devil crosses a field near your landing site. Effect on your landing?","ans":[["B","Strong, rotating thermal turbulence with sudden updrafts and gusts — it can distort the envelope, blow out pilot lights, and cause uncommanded climbs or sink near the ground. Avoid it: pick a different field or wait at altitude for it to dissipate, then land early.","Correct effects and response."],["S","It means rough, rising air there — I'd pick a different field away from it.","Correct core."],["W","A dust devil helps by creating lift, which softens touchdown if you land right after it passes.","Hazard, not help."],["W","Dust devils only affect visibility, so wait for the dust to settle and then land normally.","Misses the turbulence."]]},{"id":"XI-A-2","a":"XI","t":"A","d":2,"s":1,"ref":"PTS XI.A; BFH","q":"After landing, an upset farmer says you damaged his soybeans. How do you handle it?","ans":[["B","Stay calm and courteous, listen, apologize for the impact, and keep the crew off the crop. Exchange contact information, document the damage, and follow the operator's policy for compensation. Landowner relations are essential — leave the field as found and follow up.","Professional handling."],["S","Apologize, get his contact info, and make sure we don't do more damage getting out.","Correct core."],["W","Explain that federal aviation rules allow emergency landings anywhere, so he can't complain.","Not an emergency and alienates landowners."],["W","Leave quickly to avoid a confrontation, then have the office send a form letter later.","Damages landowner relations."]]},{"id":"XI-B-2","a":"XI","t":"B","d":2,"c":1,"ref":"PTS XI.B; BFH","q":"What are the main hazards during deflation and pack-up?","ans":[["B","Crew struck or dragged by the envelope in wind; hot air and fabric near the burner; fuel not secured (pilot lights still lit, lines not bled); crew walking on fabric; spectators too close; and vehicle movement near the crew. Brief roles, secure fuel first, and control the area.","Correct hazards."],["S","The envelope moving in the wind, fuel still on, and people getting too close.","Correct core."],["W","None after landing — the flight is over, so pack-up isn't a safety concern for the pilot.","Pilot remains responsible."],["W","Only rain, which damages the fabric, so pack-up should be fast regardless of fuel status.","Ignores primary hazards."]]},{"id":"XI-C-3","a":"XI","t":"C","d":2,"c":1,"ref":"PTS XI.C; BFH","q":"Why is the 80% fill limit important, and what happens if a tank is overfilled?","ans":[["B","Propane expands significantly as temperature rises. The vapor space allows liquid to expand; an overfilled tank can become liquid-full, sending pressure up rapidly and opening the relief valve, which releases propane — a fire hazard — or causing liquid to reach vapor withdrawal points. Use the fixed liquid level gauge to stop at the limit.","Correct physics and hazard."],["S","The extra space lets the fuel expand when it warms up; too full and it can vent propane.","Correct core."],["W","The 80% limit protects the fuel gauge, which can't read the top 20% of the tank.","Not the reason."],["W","Overfilling only reduces efficiency, since liquid propane burns less cleanly than vapor.","Misses the overpressure hazard."]]},{"id":"XI-A-3","a":"XI","t":"A","d":2,"ref":"PTS XI.A.3; 14 CFR 91.3","q":"During recovery, spectators crowd around the deflating envelope. What's your responsibility?","ans":[["B","Control the scene: have crew keep spectators back from the envelope, basket, burner, and vehicles; brief anyone helping on what to do; ensure fuel is secured; and maintain property and crowd control throughout the recovery.","Correct supervision."],["S","Have the crew keep people back and make sure nobody gets near the burner or tangled.","Correct core."],["W","None — spectators are on private property at their own risk, so it's the landowner's problem.","PTS assigns supervision to the pilot."],["W","Invite them to help fold the envelope — more hands make a quicker, safer pack-up.","Untrained helpers increase risk without a briefing."]]},{"id":"SC-5","a":"III","t":"D","d":3,"c":1,"s":1,"ref":"PTS III.D; ADM","q":"Scenario: 94°F at the launch site, a full basket, and the load chart puts you right at maximum envelope temperature. The passengers have paid. Decision?","ans":[["B","Reduce the load or don't fly. Being at maximum envelope temperature at launch leaves no margin for climbs, obstacles, aborts, or thermals, and accelerates fabric damage. Rebook a passenger or move to a cooler time. Commercial pressure doesn't change the limits.","Correct ADM."],["S","I'd take fewer people or reschedule — flying right at the limit leaves nothing in reserve.","Correct decision."],["W","Fly — the load chart includes a safety margin, so being at the limit is still within design.","No margin for maneuvering or contingencies."],["W","Fly, but plan a short, low flight so the envelope never needs extra heat for climbs.","Still no margin for obstacles or aborts."]]},{"id":"SC-6","a":"II","t":"E","d":3,"s":1,"ref":"14 CFR 99.7; FDC NOTAM 4/3621; 91.103","q":"Scenario: Saturday afternoon flight. Your trajectory passes about 2 miles from a stadium with a college game starting in 45 minutes. Problem?","ans":[["B","Likely — if it's NCAA Division I football at a stadium seating 30,000 or more, the standing FDC NOTAM 4/3621 TFR applies: 3 NM radius, surface to 3,000 ft AGL, from 1 hour before the scheduled start until 1 hour after the end. Two miles is inside it and it's likely already active. Confirm with a NOTAM check; then change altitude to change track, land before the TFR, or don't launch on that trajectory. (Aircraft authorized by and in contact with ATC are excepted.)","Correct TFR knowledge."],["S","There's usually a TFR around stadiums during games, so I'd plan to stay well away from it.","Correct caution, less detail."],["W","No — stadium TFRs only apply to drones, not manned aircraft like balloons.","Applies to aircraft operations generally."],["W","No — the TFR doesn't start until kickoff, so I'll be past the stadium in time.","Starts 1 hour before the event."]]},{"id":"SC-7","a":"II","t":"B","d":3,"c":1,"s":1,"ref":"PTS II.B.4; BFH","q":"Scenario: Mass ascension. You're at 800 feet; another balloon is climbing directly beneath you. What do you do?","ans":[["B","Recognize the climbing balloon can't see above its envelope. Avoid descending; if needed, climb to increase separation, and communicate by radio. Lower balloon generally has the right of way by custom, but both pilots are responsible for collision avoidance — I control what I can: stop any descent and climb away.","Correct action."],["S","Get out of their way by going up a bit and try to raise them on the radio.","Correct core."],["W","Descend to make room, since the lower balloon is climbing and can pass underneath.","Descending into a climbing balloon is the collision."],["W","Hold altitude — I'm higher, so I have the right of way and the climbing balloon must stop.","Lower balloon customarily has right-of-way."]]},{"id":"SC-8","a":"I","t":"F","d":3,"s":1,"ref":"FAA-H-8083-9B (AIH) ch. 2 (stress), ch. 9 (exchange of controls); PTS I.F.2; 14 CFR 91.3","q":"Scenario: On a training flight your student freezes during the approach and stops burning. What do you do?","ans":[["B","Take control immediately with a positive exchange ('I have the flight controls'), fly the balloon safely — burn to arrest the descent, abort if necessary — then talk the student through it on the ground. Afterward, explore the stress reaction, adjust the training plan, and don't move on until confidence returns.","Correct immediate and instructional response."],["S","Take over right away, get us safe, and talk about what happened once we're down.","Correct core."],["W","Coach them through it verbally so they learn to recover — taking over would undermine them.","Safety first; instruction can wait."],["W","Let them work it out for a few seconds — freezing is normal and they'll come out of it.","Burner lag means seconds matter."]]},{"id":"SC-9","a":"V","t":"F","d":3,"s":1,"ref":"PTS V.F; special emphasis — aviation security","q":"Scenario: A passenger shows up with a large backpack and refuses to say what's inside. Your call?","ans":[["B","As PIC I'm responsible for the safety and security of the flight. Loose items must be secured and I need to know what's aboard (fuel/fire risk, hazardous materials). If they won't disclose or leave the bag with the crew, they don't fly. Stay calm and professional.","Correct security posture."],["S","Ask them to leave it with the ground crew, and if they won't, they can't come along.","Correct decision."],["W","Let them bring it — passenger belongings are private and searching them isn't the pilot's role.","PIC must manage what's aboard."],["W","Allow it if they hold it on their lap during the whole flight, so it can't move around.","Unknown contents near an open flame."]]},{"id":"SC-10","a":"VIII","t":"G","d":3,"c":1,"s":1,"ref":"PTS VIII.G; BFH","q":"Scenario: You're in a light-wind approach and realize you'll pass about 30 feet over a power line at the field edge. Fuel is fine. Continue?","ans":[["B","No — 30 feet is too little margin given gusts, sink, and burner lag. Climb early to a comfortable altitude over the line, then pick a field past it, or abort to a different field. Never accept a marginal crossing of wires.","Correct risk judgment."],["S","I'd add more height first — 30 feet over wires is too close for comfort.","Correct direction."],["W","Yes — 30 feet clears the wires, and touching down right after them saves the field.","Margin too small for sink and lag."],["W","Yes, if the crew stands by to warn me, since they can see the wire height from the ground.","Doesn't create margin."]]},{"id":"N-1","a":"II","t":"C","d":2,"ref":"FAA-H-8083-11B (BFH) ch. 2, 6; PHAK","q":"What's your airspeed in level flight, and why does the answer matter for how you fly?","ans":[["B","Essentially zero — a free balloon moves with the air mass, so ground speed equals wind speed and there's no relative wind in steady level flight (vertical movement creates some airflow over the envelope). That's why steering is by changing altitude to find different winds, why there's no airspeed indicator requirement, and why false lift appears only when relative wind exists — while the balloon is held or still accelerating at launch, at landing, or in wind shear.","Correct physics with the operational consequence."],["S","Pretty much nothing — we just float along with the wind, so the GPS speed is the wind speed.","Correct idea without the implications."],["W","About 5–10 knots, the speed the burner pushes the balloon through the air during cruise.","Burners create buoyancy, not thrust."],["W","Same as my GPS ground speed — that's why balloons need an airspeed indicator under 91.205.","91.205 applies to powered aircraft; balloons have no airspeed instrument requirement."]]},{"id":"N-2","a":"III","t":"B","d":2,"c":1,"ref":"FAA-H-8083-11B (BFH) ch. 4 — Fog; FAA-H-8083-28","q":"0545 at your launch field: clear sky, calm, temperature 11°C, dew point 10°C. What concerns you?","ans":[["B","A 1°C spread with clear skies and light wind is textbook radiation fog: the BFH notes fog is most frequent when the spread is under about 1°C and rarely occurs above 2.2°C, and radiation fog needs clear skies and light wind (under 7 kt). The minimum temperature often occurs after sunrise (up to an hour), so fog can form or thicken right at launch time — especially in low areas and valleys, where cold air drains. Fog can hide wires and close landing areas; I'd delay or cancel rather than launch into deteriorating visibility.","Correct BFH fog criteria and timing."],["S","The temperature and dew point are almost the same, so fog could form — I'd watch it closely.","Correct concern without the mechanism or timing."],["W","None — fog only forms when the spread is zero, and the sun will burn off any haze within minutes.","Fog forms with small spreads, and minimum temperature can come after sunrise."],["W","None — calm air prevents fog, since fog needs wind to carry the moisture in.","Light wind favors radiation fog; advection fog needs moving moist air, not calm."]]},{"id":"N-3","a":"III","t":"B","d":2,"c":1,"s":1,"ref":"FAA-H-8083-11B Balloon Flying Handbook ch. 4; 14 CFR 91.155","q":"In flight, you see ground fog filling the river valley where your planned landing fields are. What do you do?","ans":[["B","Fog is a cloud at the surface — descending into it means losing VFR cloud clearance (91.155) and losing sight of wires, trees, and the ground. Pick a landing area outside the fog now, while fuel and options remain (often higher ground or fields along my track away from low ground), brief passengers, and keep the crew informed. Don't count on it burning off in time, and never descend into fog hoping to break out.","Correct priorities."],["S","Find a field away from the valley before it gets worse, and let the crew know the new plan.","Correct action, missing the VFR/obstacle rationale."],["W","Descend into the fog slowly with short burns — ground fog is usually thin, so I'll break out.","Loses cloud clearance and obstacle visibility."],["W","Climb and wait above it — the morning sun will burn off valley fog within ten minutes.","Fog persistence is unpredictable; fuel and options shrink."]]},{"id":"N-4","a":"II","t":"E","d":3,"c":1,"ref":"14 CFR 91.155; 61.129(h)(4)(ii)(C)","q":"Your student needs the controlled ascent to 3,000 feet above launch, but there's a broken layer at 2,800 feet AGL in Class E. Can you do it today?","ans":[["B","Not legally. In Class E below 10,000 MSL, VFR requires 3 SM visibility and 500 ft below, 1,000 ft above, 2,000 ft horizontal from clouds. With a broken layer at 2,800 AGL, I could only climb to about 2,300 AGL — short of the 3,000 ft required by 61.129(h). Do that flight on a day with a higher cloud base.","Correct VFR application."],["S","Probably not — I need to stay below the clouds by a margin, so 3,000 won't work today.","Correct conclusion without the numbers."],["W","Yes — balloons only need to stay clear of clouds, so I can climb to just under 2,800 feet.","'Clear of clouds' is Class G at low altitude, not Class E."],["W","Yes — the 3,000 ft ascent can be logged by climbing into the base of the layer briefly.","That violates 91.155 cloud clearance."]]},{"id":"N-5","a":"II","t":"D","d":2,"c":1,"ref":"14 CFR 91.209(a); 14 CFR 1.1 (night); 61.57(b)","q":"Your ride company wants a pre-sunrise launch to catch the sunrise aloft. Any regulatory issue?","ans":[["B","Yes. 91.209(a) prohibits operating an aircraft between sunset and sunrise without lighted position lights, and it contains no balloon exception — so an unlit balloon can't fly before sunrise. If the balloon is properly equipped and lit, note also 61.57(b) night recency for passengers (one hour after sunset to one hour before sunrise) and that 'night' for logging (14 CFR 1.1) begins and ends with civil twilight.","Correct rule."],["S","I think lights are required before sunrise, so we'd need to launch right at sunrise instead.","Correct conclusion, uncertain basis."],["W","No — balloons are exempt from lighting rules because they have no electrical system.","91.209(a) has no balloon exception."],["W","No — it's legal any time after the start of morning civil twilight, which is when night ends.","Position-light rule uses sunset to sunrise, not civil twilight."]]},{"id":"N-6","a":"III","t":"D","d":2,"ref":"Balloon Flight Manual — Limitations; 14 CFR 91.9","q":"Open your flight manual. State your balloon's limitations from it — and tell me which are mandatory.","ans":[["B","From the Limitations section: maximum gross weight, maximum envelope temperature, any maximum rates of climb/descent, approved fuel and cylinders, minimum crew, any wind or temperature limitations, and required equipment — recited as the actual figures and located in the manual. Limitations are mandatory (91.9); normal and emergency procedures are the manufacturer's recommended methods. A strong candidate knows the numbers without looking and where each one is.","Specific, sourced, and regulatory."],["S","Max weight and max temperature are around what's on the placard — I'd have to look up the rest.","Partial knowledge; strict DPE expects exact figures."],["W","The manual has no hard limits for balloons — limits come from pilot experience and comfort.","Balloon flight manuals contain mandatory limitations."],["W","All of it is advisory, since balloons are certificated under Part 31 rather than Part 23.","Part 31 balloons have mandatory limitations too."]]},{"id":"N-7","a":"III","t":"D","d":2,"c":1,"ref":"Balloon Flight Manual load chart; 14 CFR 91.9","q":"Today the load chart shows you could lift 2,400 lb at max temperature. Your certificated maximum gross weight is 2,200 lb. What's your limit?","ans":[["B","2,200 lb. The load chart shows available lift for the conditions; the certificated maximum gross weight is a structural/certification limitation that can't be exceeded regardless of available lift. The lesser of the two governs — and I'd plan below max temperature anyway to leave margin.","Correct: the lesser limit applies."],["S","Probably the 2,200, since that's the official number, though I could lift more today.","Correct number, weak reasoning."],["W","2,400 lb — the load chart reflects today's actual conditions, so it overrides the placard.","Max gross weight is a limitation, not a performance figure."],["W","2,300 lb — split the difference, since the certificated weight assumes a hot day.","No basis."]]},{"id":"N-8","a":"II","t":"D","d":3,"c":1,"ref":"14 CFR 91.119(a),(c)","q":"Is contour flying at 30 feet over open farmland legal?","ans":[["B","Only within 91.119. Except when necessary for takeoff or landing, over other than congested areas I must be 500 ft above the surface — except over open water or sparsely populated areas, where I may not be closer than 500 ft to any person, vessel, vehicle, or structure. So low contour flying is legal only over genuinely sparsely populated areas while staying 500 ft from people, vehicles, and structures, or as part of an actual approach to landing. Livestock and landowner relations add further reasons to stay higher.","Correct 91.119(c) application."],["S","It depends on whether there are houses or people nearby — over empty fields it's usually okay.","Right direction, missing the 500-ft rule."],["W","Yes, anywhere outside towns — 91.119 only restricts flight over congested areas.","91.119(c) also restricts non-congested areas."],["W","Yes — balloons are exempt from 91.119 because low flight is part of normal balloon operations.","No exemption exists."]]},{"id":"N-9","a":"VIII","t":"C","d":2,"ref":"FAA-H-8083-11B (BFH) ch. 7","q":"You're descending at 500 fpm and start a burn. Using the BFH lag figure, how much altitude will you lose before the balloon even begins to respond?","ans":[["B","The BFH says the balloon responds about 6–15 seconds after the burn. 500 fpm is about 8.3 ft/s, so that's roughly 50–125 ft lost before the burn takes effect — and the descent continues while the envelope reheats. Start corrections early and plan arrest points well above obstacles.","Correct math and conclusion."],["S","Maybe a hundred feet or so — the burner takes several seconds to work.","Reasonable estimate without the math."],["W","Almost none — the burner responds within a second or two, so the arrest is immediate.","Contradicts the BFH lag figure."],["W","About 500 ft — you lose a full minute of descent before any burn takes effect.","Overstates the lag."]]},{"id":"N-10","a":"VII","t":"F","d":2,"ref":"FAA-H-8083-11B (BFH) ch. 8; PTS VII.F","q":"Surface wind is 12 knots. How fast will the basket hit the ground, and how does that drive your landing?","ans":[["B","Ground speed is about the wind speed: 12 kt ≈ 20 ft/s (about 1,215 ft/min), so the basket will drag and may tip. That drives a high-wind technique: thorough re-brief and front-of-basket positions, a large field with long run-out and no wires, approach to the near end at the lowest safe altitude, fuel off/lines drained/pilots out when committed, and deflation timed to control ground travel.","Correct conversion and consequence."],["S","It'll be a fast, dragging landing — I'd pick a long field and brief everyone hard.","Correct consequence without the number."],["W","Only a few feet per second — vertical descent rate matters, not horizontal wind speed.","Horizontal speed dominates in wind."],["W","12 knots is under the 15-knot FAA limit for balloons, so a normal landing technique applies.","No FAA regulatory wind limit exists; check the flight manual's own limitations, if any."]]},{"id":"N-11","a":"VII","t":"C","d":2,"c":1,"ref":"FAA-H-8083-11B (BFH) ch. 6, 8","q":"Winds aloft are 15 knots at 1,000 feet, but the surface is nearly calm. What happens as you descend for landing?","ans":[["B","Passing through the shear the balloon slows; the airflow over the envelope can create false lift, which disappears as the balloon adjusts — sometimes followed by unexpected sink. Envelope distortion is possible. Expect the track to change below the shear, anticipate with heat, and don't plan the approach on the upper wind's track.","Correct shear effects."],["S","It'll get bumpy and the balloon will slow down and change direction near the ground.","Correct observation without the lift effects."],["W","The balloon keeps its 15-knot ground speed all the way down due to momentum.","Balloon adjusts to the lower wind."],["W","Nothing changes — wind differences only matter for airplanes with airspeed.","Shear affects balloons directly."]]},{"id":"N-12","a":"III","t":"B","d":2,"ref":"14 CFR 91.155; ADM","q":"Class G, 1,000 feet AGL, daytime, visibility 1.5 statute miles in haze. Legal? Would you fly a ride flight?","ans":[["B","Legal: Class G at or below 1,200 ft AGL by day requires 1 SM and clear of clouds. But legal isn't safe for a balloon: wires, towers, and landing hazards are hard to see, and the crew may lose sight of the balloon. Personal and operator minimums should be well above the regulatory floor — I'd likely not fly passengers.","Separates legality from safety."],["S","It's legal I think, but that's pretty hazy for picking fields and seeing wires.","Correct judgment, uncertain legality."],["W","Not legal — balloons need 3 statute miles in all airspace because they can't maneuver.","Class G low-altitude day minimum is 1 SM."],["W","Legal and fine — if it's VFR legal, it's safe enough for passengers.","Legal minimums aren't operational minimums."]]},{"id":"N-13","a":"II","t":"C","d":2,"ref":"FAA-H-8083-11B (BFH) ch. 4","q":"Why might your balloon need more heat 45 minutes into a morning flight than at launch?","ans":[["B","Ambient temperature rises as the sun heats the surface, reducing the temperature difference between envelope and outside air — so the same load needs a hotter envelope, more fuel, and gives less margin. (The day's minimum temperature can occur up to an hour after sunrise, then warming accelerates.) Plan fuel and envelope-temperature margins for the warming, not just launch conditions.","Correct physics."],["S","It's getting warmer outside, so the balloon has to work harder to stay up.","Correct idea informally."],["W","Fuel pressure rises as the tanks warm, so burns are shorter and less effective.","Higher pressure increases output, and that isn't the reason."],["W","The envelope fabric stretches as it heats, which lets hot air leak through it.","Not the mechanism."]]},{"id":"N-14","a":"V","t":"A","d":2,"c":1,"ref":"FAA-H-8083-11B (BFH) ch. 6","q":"At the launch field, what cues tell you the wind is too strong, even before you check a forecast?","ans":[["B","BFH cues: wires and ropes whistle above about 20 mph; a pibal that rolls on the ground, fails to clear obstacles, climbs then dives, or shows sharp speed or direction changes signals cancellation; and if inflation would need extra crew because of wind, consider canceling. Fabric rippling (around 8 mph) is a way to estimate wind speed. Combine with gust spread, obstacles downwind, and the 100-ft-per-knot launch clearance.","BFH field cues."],["S","If the trees and flags are really moving and the pibal takes off sideways, it's too windy.","Reasonable cues, less specific."],["W","If the crew can hold the basket down during inflation, the wind is within limits.","BFH: needing extra crew is a cancel cue."],["W","Only the METAR counts — field observations are too subjective for go/no-go decisions.","BFH emphasizes visual field assessment."]]},{"id":"N-15","a":"IX","t":"A","d":3,"ref":"PTS IX.6; FAA-H-8083-11B Balloon Flying Handbook ch. 2; Balloon Flight Manual","q":"Your three 15-gallon tanks hold about 9, 6, and 3 gallons. You burn about 18 gal/hr today and want to land with one full tank's worth (15 gal) in reserve. How long do you have?","ans":[["B","Fuel aboard: 9 + 6 + 3 = 18 gallons. Reserve of one full tank = 15 gallons, leaving 3 gallons usable — about 10 minutes at 18 gal/hr. In practice that means begin the approach now. (Float gauges are imprecise and most don't read 0–100% — treat fuel estimates conservatively.)","Correct arithmetic and conclusion."],["S","Not long — I've used most of my fuel, so I should start looking for a field now.","Correct decision without the math."],["W","About an hour — I have 18 gallons left and I'm burning 18 gallons per hour.","Ignores the planned reserve."],["W","About 50 minutes — two tanks still show fuel, and the reserve is just the lowest tank.","Reserve was defined as a full tank's worth (15 gal), not the 3 gal remaining in the lowest tank."]]},{"id":"E-1","a":"VI","t":"A","d":2,"c":1,"ref":"AIM 6-3; 14 CFR 91.3(b); 91.215","q":"How do you declare an emergency and get help from a balloon?","ans":[["B","First on the frequency in use (or 121.5 MHz if needed): 'Mayday' (distress) or 'Pan-pan' (urgency), call sign, position, altitude, nature of the emergency, and intentions; squawk 7700 if transponder-equipped and you can't immediately reach ATC. Radio the chase crew to call 911 with my position and nearest road. 91.3(b) lets the PIC deviate from rules to the extent required by the emergency; a written report may be requested (91.3(c)).","Complete method."],["S","Call Mayday on the emergency frequency and have my crew call 911 for me.","Correct core."],["W","Call 911 on my cell phone — it's faster than any radio and works anywhere in flight.","47 CFR 22.925 prohibits airborne cell use."],["W","Balloons can't declare emergencies since they aren't in contact with ATC or on flight plans.","Any PIC can declare an emergency."]]},{"id":"E-2","a":"II","t":"A","d":3,"c":1,"s":1,"ref":"14 CFR 61.53; 91.3; IMSAFE","q":"Scenario: Twenty minutes into a ride flight you develop chest tightness and dizziness. What do you do?","ans":[["B","Treat it as a pilot medical emergency: land at the first suitable site, not the planned one — while I'm still able. Radio the crew to call 911 and meet us; consider declaring an emergency. Brief passengers for landing (and, if the operator's SOP covers it, on simple actions such as holding positions and radioing the crew). Don't fly again until medically cleared (61.53).","Correct priorities."],["S","Get down soon and have my crew get help ready — I'd tell the passengers what's going on.","Right direction; less urgency."],["W","Continue to the planned field so the recovery stays on schedule, then get it checked.","Delays landing during possible incapacitation."],["W","Climb higher to give myself more time and altitude to recover if it gets worse.","Increases risk and delays help."]]},{"id":"E-3","a":"V","t":"F","d":3,"s":1,"ref":"Operator SOP; 14 CFR 61.53; ADM","q":"What, realistically, could your passengers do if you became incapacitated in flight — and how does that shape your briefing?","ans":[["B","There's no FAA-prescribed passenger procedure for pilot incapacitation, so the primary defense is pilot fitness (IMSAFE, a valid second-class medical for paid flights). Realistically, untrained passengers can keep landing positions and stay in the basket, use the radio to reach the crew (who track the balloon and call 911), and — if the operator's SOP briefs it — shut off fuel at the tank valves when directed. The crew follows the balloon and is first on scene.","Realistic, honest framing."],["S","They could radio my crew for help and stay in their landing positions until it's down.","Correct practical actions."],["W","A passenger can fly it — the burner and vent are simple enough to teach in the pre-flight brief.","Unrealistic and unsafe."],["W","Nothing — so there's no point mentioning the radio or crew in the passenger briefing.","The briefing can still help."]]},{"id":"E-4","a":"V","t":"B","d":2,"c":1,"ref":"FAA-H-8083-11B (BFH) ch. 6; PTS V.B","q":"During inflation, a gust lifts your crown-line handler off his feet. What do you do — and what should he do?","ans":[["B","He should have been briefed to let go immediately if his feet leave the ground (at low height). As pilot: stop burning immediately so the envelope doesn't gain lift, have crew control the mouth, and let the envelope settle. Never take the basket off the ground with anyone attached to a line. Afterward, reassess wind — a gust that lifts a handler is a strong cancel cue.","Correct actions for both."],["S","Tell him to let go and stop the inflation until things settle down.","Correct core."],["W","He should hold on tighter so the envelope doesn't roll; I keep burning to stand it up quickly.","Can turn a hop into a fall from height."],["W","He should wrap the line around his arm for grip until the gust passes.","Never wrap lines."]]},{"id":"E-5","a":"X","t":"A","d":3,"c":1,"s":1,"ref":"FAA-H-8083-11B Balloon Flying Handbook ch. 6 (prevention); good practice","q":"Scenario: As you lift off, a crew member is still holding the basket rim and is now hanging outside the basket a few feet up. Your action?","ans":[["B","Do not climb. Their weight is now on the balloon — if they let go at height they'll fall, and the balloon will climb sharply when it sheds the weight. Stop burning and vent as needed to set them down immediately while they're low; if they're only a foot or two up, dropping off is acceptable. Keep everyone else in the basket. Prevention: brief 'hands off when I say' and confirm no crew are left hanging outside before release.","Correct priority."],["S","Bring the balloon straight back down and tell them not to let go of the basket.","Correct core."],["W","Keep climbing so I can pull them into the basket from a safer altitude.","Lethal fall risk."],["W","Tell them to let go immediately, whatever the height, so the balloon can climb safely.","Letting go at height can be fatal."]]},{"id":"E-6","a":"V","t":"F","d":2,"s":1,"ref":"PHAK ch. 17 (hyperventilation); first aid; ADM","q":"A passenger panics at 800 feet — gripping the rim, breathing fast, saying they need to get down. What do you do?","ans":[["B","Stay calm and in control: speak slowly, reassure them they're safe, have them crouch low facing inward away from the rim, and coach slow breathing (hyperventilation is likely). Enlist a companion to stay with them. Descend gently and plan an early landing at a suitable field; brief everyone. Don't make abrupt maneuvers.","Correct approach."],["S","Talk them down, get them to breathe slower, and plan to land a little early.","Correct core."],["W","Descend as fast as possible — quick action is the best way to calm a panic attack.","A rapid descent adds risk."],["W","Ignore it — panic passes on its own, and attention can make the passenger worse.","Untreated panic can escalate."]]},{"id":"E-7","a":"V","t":"F","d":3,"c":1,"s":1,"ref":"14 CFR 91.3; ADM; first aid","q":"Scenario: A distressed passenger tries to climb over the basket rim. What do you do?","ans":[["B","Immediate, firm verbal command to get down; if safe, have companions physically help keep the person low inside the basket. Keep everyone low, avoid abrupt maneuvers, and descend to land promptly at an accessible field. Radio the crew to have 911 meet the balloon. After landing, keep the person safe and with support until help arrives, and manage the weight-off carefully (no one exits until the balloon is stable).","Correct priorities."],["S","Get them back inside right away with help from others, then get down and get help.","Correct core."],["W","Climb so they're deterred by the height, then reason with them once they've calmed.","Increases danger."],["W","Let them make their own choice — the PIC can't physically intervene with a passenger.","PIC is responsible for safety (91.3)."]]},{"id":"E-8","a":"X","t":"B","d":2,"s":1,"ref":"First aid; PHAK ch. 17 (dehydration)","q":"On a hot evening flight, a passenger says they feel faint, then slumps. What do you do?","ans":[["B","Fly the balloon first. Have others lower the person to the basket floor (lying with legs raised if space allows), check responsiveness and breathing, loosen clothing, give water only once alert and able to swallow, and shade them. Since they actually fainted, radio the crew to call 911 now, and land at the first suitable accessible field.","Correct first aid within flight priorities."],["S","Get them sitting or lying down, give them water, and land soon if they don't improve.","Correct core."],["W","Have them stand at the rim facing into the wind to get fresh air on their face.","Fall risk if they faint again."],["W","Splash cold water and keep them standing so they don't lose consciousness again.","Fainting victims should lie down."]]},{"id":"E-9","a":"X","t":"B","d":2,"c":1,"s":1,"ref":"First aid; 47 CFR 22.925","q":"A passenger in their sixties reports crushing chest pain spreading to the left arm. Your actions?","ans":[["B","Treat as a possible heart attack: radio the crew to call 911 with my position and the nearest road access, and land at the first suitable accessible field. Keep the passenger still and calm; aspirin only per first-aid training/911 dispatcher guidance and if not allergic; be ready for CPR with a trained crew member or passenger. Brief others for landing.","Correct priorities."],["S","Get help coming through my crew and land right away at a field near a road.","Correct core."],["W","Continue to the planned landing area, where the crew vehicle carries the first aid kit.","Delays care."],["W","Have them call 911 on their cell phone while I keep flying the planned route.","Airborne cell use is prohibited; and land promptly."]]},{"id":"E-10","a":"X","t":"B","d":2,"s":1,"ref":"First aid","q":"Just after landing, a passenger is stung by a bee and their face and lips begin to swell. What now?","ans":[["B","Possible anaphylaxis. Ask if they carry an epinephrine auto-injector and help them use it; call 911 immediately; keep them calm and positioned per first aid (sitting up if breathing is difficult); monitor breathing. Secure the balloon and fuel so attention can stay on the patient.","Correct first aid."],["S","Call 911 right away and find out whether they carry an EpiPen with them.","Correct core."],["W","Ice the sting and wait 30 minutes — most swelling goes down without treatment.","Facial/airway swelling is an emergency."],["W","Give them a sip of water and have them lie flat until the swelling passes.","Delays emergency care."]]},{"id":"E-11","a":"XI","t":"A","d":3,"c":1,"s":1,"ref":"AAIB Bulletin 1/2026 (G-VBFT); Balloon Flight Manual — power line contact; FAA-P-8740-34","q":"Scenario: After landing, the basket drags and the envelope contacts low power cables you didn't see. The cables fall and the grass beneath the basket ignites. What do you and the passengers do?","ans":[["B","Shut off fuel at the cylinder valves. With fire, evacuation becomes necessary: passengers jump clear with feet together — not stepping down while touching the basket — so no one touches the basket and ground at the same time; then shuffle or hop away (energized ground creates step potential) to a safe distance upwind; account for everyone. Crew keep everyone away from the wires and call 911 and the utility. This mirrors the 2025 G-VBFT accident (AAIB Bulletin 1/2026), where a passenger was shocked stepping out while still touching the basket.","Matches manual guidance and the AAIB case."],["S","Shut off the fuel, get everyone out and well away from the fire and wires, and call for help.","Correct, missing the electrical-contact rule."],["W","Climb down the side of the basket carefully, keeping a hand on it for balance on the way out.","Touching basket and ground together risks shock."],["W","Stay in the basket until the fire is out, since power-line contact means you never leave.","Fire forces evacuation; the stay-in rule is for no fire."]]},{"id":"E-12","a":"VIII","t":"G","d":2,"c":1,"ref":"Good practice (no BFH tree procedure)","q":"The balloon settles into the top of a tree at the edge of your landing field. What do you do?","ans":[["B","Stop burning near branches (fire risk), shut off fuel and pilot lights once stable, keep everyone in the basket and low, and don't let anyone climb out. Radio the crew; the crew assesses and calls for help (fire department) if the basket can't be lowered safely. Plan recovery with the landowner; inspect for envelope damage before further flight.","Correct priorities."],["S","Keep everyone in the basket and wait for the crew to work out how to get it down.","Correct core."],["W","Burn hard even with branches in the mouth — getting out matters more than the fire risk.","Heating out is reasonable only with the mouth and envelope clear of branches; flame near branches is a fire hazard."],["W","Have passengers climb down the branches to lighten the balloon so it floats free.","Fall and relaunch hazards."]]},{"id":"E-13","a":"II","t":"B","d":3,"c":1,"s":1,"ref":"FAA-H-8083-11B Balloon Flying Handbook ch. 6 (right-of-way custom); good practice","q":"At a festival, your basket settles onto the top of another balloon's envelope below you. Response?","ans":[["B","My basket is pushing in their crown/parachute, costing them lift and risking fabric damage. The lower pilot should not climb (and may descend gently); I heat gently to climb off, keeping my flame clear of any of their fabric billowing near the burner, and avoid dragging the basket across their envelope. Communicate by voice or radio. Both balloons should land and inspect.","Correct cooperative response."],["S","Get off their balloon carefully without burning onto it, and talk to the other pilot.","Correct core."],["W","Burn hard to climb off immediately — speed matters more than where the flame points.","An abrupt climb drags the basket across their fabric and may push flame into it."],["W","Vent quickly so my balloon drops beside theirs and slides off the side.","Uncontrolled descent and entanglement."]]},{"id":"E-14","a":"V","t":"F","d":2,"ref":"14 CFR 91.3; operator policy; FAA-H-8083-11B (BFH) ch. 6","q":"A ride passenger mentions recent back surgery and that she can't bend her knees well. How do you handle it?","ans":[["B","Being able to stand for the flight and assume the landing position (knees slightly bent, holding on) protects passengers; if she can't, a firm landing poses a real injury risk. That's operator passenger-acceptance policy plus PIC judgment (91.3), not a specific regulation: if she can't assume the position, decline; rebook only if she can. Screen health questions at booking.","Correct PIC responsibility."],["S","I'd be careful — if she can't brace for landing, it's probably not safe for her to fly.","Correct reasoning, less decisive."],["W","Let her fly and stand at the front — landings are gentle enough that bracing isn't needed.","Landings can be hard; bracing protects passengers."],["W","Let her sit on the basket floor for landing, which protects the back better than standing.","Sitting increases spinal injury risk."]]},{"id":"E-15","a":"XI","t":"A","d":2,"c":1,"ref":"FAA-H-8083-11B (BFH) ch. 6; PTS XI.A","q":"What are your chase crew's safety rules while driving the recovery?","ans":[["B","The driver drives — obeys traffic laws, doesn't watch the balloon or use a phone while driving; a navigator tracks the balloon and handles the radio. No trespassing without permission; park safely off the road; vehicles stay clear of wires and the landing area. The pilot is responsible for supervising the crew (PTS XI.A).","Correct crew safety."],["S","Drive safely and let someone else watch the balloon and work the radio.","Correct core."],["W","Keep the balloon in sight at all costs, even if that means a short stop on the highway shoulder.","Unsafe driving."],["W","Speed is fine during recovery since the crew is responding to an aircraft landing.","No exemption from traffic laws."]]},{"id":"E-16","a":"XI","t":"A","d":3,"c":1,"s":1,"ref":"49 CFR 830.2, 830.5, 830.10; first aid","q":"Scenario: Hard landing; two passengers are hurt, one possibly with a broken leg. Walk me through the first ten minutes.","ans":[["B","Scene safety first: fuel off, pilot lights out, balloon stabilized/deflated, check for wires and fire. Account for everyone. Call 911 (crew) with location and road access. First aid within training — don't move the suspected fracture unless there's danger. Keep passengers together. Then: a fracture (except simple fingers/toes/nose) is a serious injury — notify the NTSB immediately and preserve evidence (830.5, 830.10).","Correct sequence."],["S","Make it safe, call 911, help the injured, and report it to the NTSB afterward on time.","Correct core."],["W","Pack up the balloon first so it isn't damaged, then help passengers once it's secured.","Priorities reversed."],["W","Move the injured into the chase vehicle and drive them to the hospital yourself.","Moving fractures risks further injury."]]},{"id":"F-1","a":"II","t":"A","d":1,"c":1,"ref":"FAA-H-8083-25 (PHAK) ch. 2; ch. 17","q":"Walk me through IMSAFE as you'd actually use it before a 0600 ride flight.","ans":[["B","Illness — any symptoms, even a cold (ear/sinus blocks on descent)? Medication — anything taken, prescription or OTC, and its wait time? Stress — work, family, financial, or schedule pressure? Alcohol — 91.17's 8 hours and 0.04, and how I feel? Fatigue — enough sleep for a 0430 alarm, and the long recovery day ahead? Emotion — anything upsetting that will distract me? Any 'no' I can't resolve is a no-go — and I check it honestly, not as a ritual.","Correct letters with honest application."],["S","I ask myself if I'm sick, on meds, stressed, been drinking, tired, or upset before I fly.","All elements informally."],["W","Inspection, Maintenance, Safety equipment, Airworthiness, Fuel, Equipment — the balloon check.","That's not IMSAFE; IMSAFE is the pilot's personal check."],["W","Illness, Medication, Sleep, Altitude, Food, Exercise — the six things that affect a pilot.","Wrong letters; the FAA mnemonic is Stress, Alcohol, Fatigue, Emotion."]]},{"id":"F-2","a":"II","t":"A","d":2,"c":1,"ref":"14 CFR 61.53(a),(b); 61.23","q":"Private balloon flying doesn't require a medical certificate. So is there any regulation that grounds you when you're sick?","ans":[["B","Yes — 61.53(b): for operations not requiring a medical certificate, no one may act as PIC (or as a required pilot flight crewmember) while knowing or having reason to know of any medical condition that would make them unable to operate the aircraft in a safe manner. For commercial flights requiring a medical, 61.53(a) also prohibits flying with a condition — or medication/treatment — that would make me unable to meet the medical certificate's requirements. Self-grounding is a legal duty, not just good practice.","Correct regulation."],["S","I believe there's a rule saying you can't fly if you know you're not medically fit, medical or not.","Correct concept without the cite."],["W","No — 61.53 only applies to pilots who hold a medical certificate, so private balloonists self-decide.","61.53(b) covers operations not requiring a medical."],["W","Only alcohol and drugs under 91.17 — other illnesses are left to the pilot's own judgment.","61.53(b) addresses medical conditions generally."]]},{"id":"F-3","a":"II","t":"A","d":2,"c":1,"ref":"FAA OTC Medications for Pilots guide; 14 CFR 61.53; 91.17","q":"You took Benadryl at 10 p.m. for allergies. Can you fly the 6 a.m. ride?","ans":[["B","No. The FAA's over-the-counter medication guide classifies sedating antihistamines like diphenhydramine as no-go and sets the wait at 60 hours for diphenhydramine and doxylamine (longer than the general rule of at least five dosing intervals after the last dose). For any new medication, don't fly until at least 48 hours have passed with no side effects. When in doubt — don't fly, and ask an AME.","Correct FAA guidance."],["S","Probably not — Benadryl's drowsiness lasts a long time, so I'd wait two to three days.","Correct conclusion without the figure."],["W","Yes — 8 hours have passed, the same rule that applies to alcohol under 91.17.","No 8-hour rule for medications; the guide sets 60 hours."],["W","Yes, if I feel alert — the effects of OTC allergy medicine wear off by morning.","Sedating effects persist; self-assessment is unreliable."]]},{"id":"F-4","a":"III","t":"C","d":2,"ref":"PHAK ch. 2 — PAVE; 14 CFR 61.57(a), 61.23(a)(2)(iii), 91.409(b)","q":"Run PAVE on tomorrow's 0630 ride flight with six passengers.","ans":[["B","P — Pilot: IMSAFE, currency (61.57(a)), second-class medical, proficiency with this balloon. A — Aircraft: annual and 100-hour current, airworthy, load chart for six at forecast temperature, fuel. V — enVironment: surface and winds aloft, gust spread, fog risk (temp/dew point), thunderstorms, landing areas along the trajectory, airspace, TFRs, wires. E — External pressures: paying passengers, owner, schedule, getting home — managed by deciding before launch and briefing that safety decides.","Correct PAVE elements applied."],["S","Me, the balloon, the weather and terrain, and the pressure from the customers and owner.","All four elements informally."],["W","Preflight, Altitude, Visibility, Equipment — the four items to check before inflation.","Not the PAVE elements."],["W","Pilot, Airspace, Vehicle, Emergency plan — PAVE is mainly a chase-crew checklist.","Wrong elements and purpose."]]},{"id":"F-5","a":"II","t":"D","d":2,"c":1,"ref":"PHAK ch. 2 — Hazardous attitudes; ADM (PTS Introduction — all Tasks)","q":"Name the five hazardous attitudes and their antidotes.","ans":[["B","Anti-authority ('Don't tell me') — 'Follow the rules. They are usually right.' Impulsivity ('Do it quickly') — 'Not so fast. Think first.' Invulnerability ('It won't happen to me') — 'It could happen to me.' Macho ('I can do it') — 'Taking chances is foolish.' Resignation ('What's the use?') — 'I'm not helpless. I can make a difference.'","PHAK list."],["S","Don't-tell-me, rushing, it-won't-happen-to-me, showing off, and giving up — and their fixes.","Correct attitudes in plain words."],["W","Anger, fatigue, stress, complacency, and fear — the five attitudes the FAA calls hazardous.","Not the PHAK list."],["W","Anti-authority, impulsivity, invulnerability, macho, complacency — complacency's antidote is vigilance.","Resignation is the fifth, not complacency."]]},{"id":"F-6","a":"V","t":"A","d":2,"c":1,"s":1,"ref":"PHAK ch. 2 — Hazardous attitudes; FAA-H-8083-11B ch. 8","q":"Scenario: Gusts are building at the launch field. Your thought is, 'I can handle it — I'll show them how it's done.' Which attitude, and what's the antidote?","ans":[["B","Macho ('I can do it') — antidote: 'Taking chances is foolish.' It's also trying to prove skill rather than assess risk; the BFH notes wind is the leading factor in balloon accidents. Re-evaluate against my personal minimums and cancel or delay.","Correct identification and antidote."],["S","That's showing off — I should stop trying to prove I can do it and look at the actual wind.","Correct idea without the term."],["W","Invulnerability — 'It could happen to me.' I'm assuming accidents happen to other pilots.","Close, but 'I can handle it' is macho; invulnerability is 'won't happen to me'."],["W","Impulsivity — 'Not so fast.' I'm rushing to launch before the gusts get even worse.","The thought expressed is capability bravado, not haste."]]},{"id":"F-7","a":"VII","t":"F","d":2,"s":1,"ref":"FAA-H-8083-25 (PHAK) ch. 2 — Hazardous attitudes","q":"Scenario: Dragging across a field in a high-wind landing, your student says, 'There's nothing I can do now,' and lets go of the deflation line. Attitude and antidote?","ans":[["B","Resignation ('What's the use?') — antidote: 'I'm not helpless. I can make a difference.' There's plenty to do: deflate to control ground travel, keep the fuel secured, keep occupants positioned, and stay in until the basket stops.","Correct identification and application."],["S","They're giving up — I'd tell them they can still control it by keeping the deflation line open.","Correct idea without the term."],["W","Invulnerability — they believe the landing can't hurt them, so they stop trying.","Giving up is resignation."],["W","Anti-authority — they're refusing to follow my instructions during the landing.","Not defying rules; giving up."]]},{"id":"F-8","a":"VIII","t":"G","d":2,"s":1,"ref":"PHAK ch. 2 — Hazardous attitudes; NTSB AAR-17/03 §1.4.3; 14 CFR 91.119","q":"Scenario: Flying solo, you catch yourself contour-flying 30 feet over a field next to a power line, thinking 'Nothing's ever happened — those wires won't get me.' Attitude and antidote?","ans":[["B","Invulnerability ('It won't happen to me') — antidote: 'It could happen to me.' The FAA recognizes power lines as perhaps the most significant obstacle to balloon flight (NTSB AAR-17/03), and more than half of fatal U.S. hot-air balloon accidents 1982–2015 involved power-line collisions. There's also likely a 91.119 issue. Climb now.","Correct identification and action."],["S","I'm assuming nothing bad will happen because it never has — I'd climb right away.","Correct idea without the term."],["W","Anti-authority — they're ignoring 91.119, so the antidote is 'follow the rules.'","The thinking expressed is 'it won't happen to me.'"],["W","Macho — I'm showing off my low flying because I like proving I can do it.","The quote is about immunity from risk, not proving skill."]]},{"id":"F-9","a":"III","t":"B","d":2,"ref":"FAA-H-8083-25 (PHAK) ch. 2 — DECIDE","q":"Walk the DECIDE model through discovering that surface winds at your planned landing field are stronger than forecast.","ans":[["B","Detect the change (stronger surface wind than forecast); Estimate the need to react (high-wind landing hazards, fuel, remaining fields); Choose a desirable outcome (safe landing with injury-free passengers); Identify actions (earlier landing in a larger field, re-brief, high-wind technique); Do the necessary actions; Evaluate the effect and adjust.","Correct model application."],["S","Notice it, figure out how much it matters, pick a plan, do it, and see how it's working.","Captures most steps informally."],["W","Detect, Evacuate, Communicate, Inform, Deflate, Exit — the balloon emergency sequence.","Not the DECIDE model."],["W","Delay, Evaluate, Climb, Inform, Descend, Execute — used only when a landing goes wrong.","Not the DECIDE model."]]},{"id":"F-10","a":"III","t":"B","d":2,"ref":"FAA-H-8083-25 (PHAK) ch. 2 — 3P model","q":"What's the 3P model and how would you use it in flight?","ans":[["B","Perceive the hazards, Process them to evaluate the level of risk, and Perform risk management (eliminate or mitigate) — repeated continuously through the flight. In a balloon: perceive a wind shift toward a power line; process the risk (lag, margin, fuel); perform — climb early or land short.","Correct model."],["S","Spot the problem, think through how bad it is, and then act on it, over and over.","Correct idea informally."],["W","Pilot, Plane, Passengers — the three things to check before each flight.","Partial 5P list, not 3P."],["W","Plan, Practice, Perform — preparing on the ground before a checkride maneuver.","Not the PHAK 3P model."]]},{"id":"F-11","a":"III","t":"D","d":3,"ref":"PHAK ch. 2 — Risk assessment; CARE; TEAM; FAA-H-8083-11B ch. 4","q":"How would you use the risk matrix, CARE, and TEAM on a decision like flying near a front?","ans":[["B","Risk matrix: likelihood (probable, occasional, remote, improbable) × severity (catastrophic, critical, marginal, negligible) gives the risk level. CARE frames the hazard: Consequences, Alternatives, Reality, External factors. TEAM chooses the response: Transfer, Eliminate, Accept, or Mitigate. Near a front, the BFH notes balloon pilots usually don't fly in the face of an approaching front, and many avoid the 18–24 hours before frontal passage: consequences could be catastrophic, so eliminate — don't fly — or mitigate heavily.","Correct tools."],["S","Weigh how likely and how bad it is, think through options, then avoid, reduce, or accept the risk.","Correct concepts informally."],["W","Risk matrix is for operators only; pilots use CARE for weather and TEAM for crew briefings.","Mischaracterizes the tools."],["W","TEAM means Together Everyone Achieves More — a crew motivation tool for the ground crew.","Not the PHAK definition."]]},{"id":"F-12","a":"III","t":"B","d":2,"c":1,"ref":"FAA-H-8083-25 (PHAK) ch. 2 — Personal minimums; 14 CFR 91.155","q":"What are personal minimums, and can you give me three of yours for ride flights?","ans":[["B","Limits unique to an individual pilot's current experience and proficiency — usually more conservative than the regulations. Examples: maximum surface wind and gust spread for launch and landing; minimum visibility well above the 1 SM Class G minimum; minimum landing fuel (e.g., one full tank in reserve — no regulatory reserve applies to balloons, since 91.151 covers airplanes and rotorcraft); no flights with convection forecast; rest before early launches. Set them in advance, in writing, and don't renegotiate them on the field.","Correct definition with examples."],["S","My own rules on top of the FAA's — like not flying above a certain wind or below a certain fuel.","Correct idea."],["W","The same thing as the regulatory minimums, which the FAA calls personal minimums for balloons.","Personal minimums are individual, not regulatory."],["W","Minimums I adjust on the morning of each flight based on how the passengers feel about it.","Set in advance; passenger pressure is an external pressure."]]},{"id":"F-13","a":"II","t":"D","d":2,"s":1,"ref":"PHAK ch. 2 — Operational pitfalls; ADM (PTS Introduction — all Tasks)","q":"Scenario: The landing field near the chase vehicle is marginal, but there's a good field 3 miles on and you have ample fuel. 'The crew is right there — let's just get it down here.' What pitfall are you watching for?","ans":[["B","Get-there-itis — fixation on the plan (land where the crew is) over judgment; mindset — failing to adapt to the situation (a better field is well within reach with ample fuel). A marginal field is a risk taken only for convenience; continue to the good field and let the crew follow.","Correct pitfalls."],["S","Wanting to land where it's easy for the crew instead of where it's actually safe.","Correct idea."],["W","Duck-under syndrome — it applies to descending below safe minimums in any aircraft.","Duck-under relates to instrument approach minimums."],["W","No pitfall — landing near the crew always reduces recovery risk and is the safest choice.","Convenience doesn't make a field safe."]]},{"id":"F-14","a":"V","t":"B","d":2,"c":1,"s":1,"ref":"PTS — ADM, CRM/SRM; IMSAFE; 14 CFR 91.3","q":"Scenario: Your crew chief shows up exhausted after a double shift and slurring a little. Does that affect your go/no-go?","ans":[["B","Yes. The crew chief runs inflation, crown line, recovery, and emergency response — crew fitness is part of the operation (CRM). Someone impaired or exhausted is a hazard to themselves and others. Reassign or replace them; if I can't staff the operation safely, I don't fly. As PIC I'm the final authority on the flight (91.3), so I decide whether it can be staffed safely.","Correct CRM application."],["S","I'd have someone else take their job, and if I couldn't, I'd think about canceling.","Correct actions."],["W","No — IMSAFE and 91.17 apply only to the pilot, so crew condition doesn't matter.","Crew fitness affects safety; PIC responsibility covers the operation."],["W","No — the crew chief only works on the ground, so their condition can't affect the flight.","Ground crew roles are safety-critical."]]},{"id":"F-15","a":"II","t":"B","d":2,"ref":"PTS Introduction — ADM, Risk Management, CRM and SRM (all Tasks); PHAK ch. 2","q":"What is single-pilot resource management, and what resources does a balloon pilot have?","ans":[["B","PHAK: SRM is the art and science of managing all the resources available to a single pilot, before and during flight, to ensure a successful outcome. Balloon resources: the chase crew (eyes on the ground, landowner contacts, weather observations), the radio, other balloons (pibal-like wind information), ATC and Flight Service, GPS, the flight manual, briefed passengers, and my own planning. The PTS says failure to use ADM including CRM/SRM fails the Task.","Correct definition with balloon resources."],["S","Using everything you have — crew, radio, other pilots — to make good decisions as the only pilot.","Correct idea."],["W","A crew-only concept — SRM applies to multi-pilot airline cockpits, not balloon operations.","SRM is specifically for single-pilot operations; CRM is for crews."],["W","Managing the propane supply — SRM stands for single-resource management of fuel.","Not the definition."]]},{"id":"F-16","a":"III","t":"C","d":2,"ref":"PHAK ch. 2 — 5P check","q":"What's the 5P check, and when do you run it in a balloon flight?","ans":[["B","Plan, Plane, Pilot, Passengers, Programming — reviewed at key decision points (preflight, at launch, mid-flight, before the approach). In a balloon, Programming covers GPS/radio/instrument setup and how I'm using them. Example before landing: is the plan still valid (fields, wind), is the balloon/fuel adequate, am I fit and focused, are passengers briefed and positioned, are radio and GPS set?","Correct elements and timing."],["S","Check the plan, balloon, myself, passengers, and gadgets at the important points of the flight.","Correct idea."],["W","Plan, Plane, Pilot, Passengers, Propane — done once during the preflight inspection.","Programming, and it's revisited in flight."],["W","Preflight, Pibal, Permission, Passengers, Pack-up — the balloon version of the airplane 5Ps.","Not the PHAK 5P."]]}];
const KEYS={"I-A-1":"A change in behavior as a result of experience — seen in how they actually perform.","I-A-2":"Rote, understanding, application, correlation — I should be at correlation.","I-A-3":"Readiness, exercise, effect, primacy, intensity, recency; primacy: first leak check done right.","I-A-4":"Retrieval failure, fading, interference, repression; aid with praise and association.","I-A-5":"Positive transfer on ADM and airspace; negative on control lag — the burner isn't a throttle.","I-B-1":"An unmet security need (Maslow) stalls learning — reduce the anxiety first.","I-B-2":"Rationalization — a plausible excuse that blocks finding the real error.","I-B-3":"Motivate, inform, individualize, credit, constructive criticism, consistency, admit errors.","I-C-1":"Preparation, presentation, application, and then review and evaluation of the learner.","I-D-1":"Demonstration-performance: explain, demonstrate, supervised performance, evaluation.","I-D-2":"Introduction, development, conclusion; intro = attention, motivation, overview.","I-E-1":"A critique coaches the learner to improve; an evaluation measures them against a standard.","I-E-2":"Puzzle, oversize, toss-up, bewilderment, trick, and irrelevant questions — they confuse learning.","I-E-3":"Reliable, valid, usable, objective, comprehensive, discriminating — the PTS is the yardstick.","I-F-1":"Balloon-only training, certificate, solo and flight review endorsements — hot air only.","I-F-2":"Over-cooperation, odd laughter, mood swings — get an unbiased check; hold sign-offs.","I-F-3":"Yes, in a balloon: 1 hour ground on Part 91 rules, 1 hour flight, every 24 calendar months.","I-F-4":"Student certificate, presolo test, presolo training, and logbook endorsements within 90 days.","I-F-5":"Sincerity, acceptance, demeanor, safety, proper language, professional development.","I-G-1":"Objective, content, and completion standards — plus schedule and equipment.","I-G-2":"Building blocks from the certification standard into a syllabus, flexed for each learner.","II-A-1":"Hypoxic, hypemic, stagnant, histotoxic — O₂ or descent, and fresh air if CO.","II-A-2":"Hyperventilation — have them slow their breathing rate, talk aloud, or breathe into a bag.","II-A-3":"8 hours, under 0.04, not under the influence — and no visibly drunk passengers aboard.","II-A-4":"Per the AIM, 12 hours after a dive — 24 if it required a controlled ascent.","II-A-5":"IMSAFE every flight; rest for early launches; don't fly congested — descents hurt the ears.","II-B-1":"Balloons have right-of-way under 91.113; between balloons, custom favors the lower one.","II-B-2":"Festivals, near airports, blind spots above and below, wires — worse when fatigued.","II-C-1":"Archimedes and Charles's law — heated air is lighter than the air it displaces.","II-C-2":"Thinner air, less temperature margin — hotter envelope, so carry less.","II-C-3":"Aerodynamic lift from wind flowing over the envelope — it vanishes once you reach wind speed.","II-D-1":"It's an accident: notify NTSB now, preserve evidence, report within 10 days.","II-D-2":"Parts 1, 43, 61, 91, 830, the AIM, ACs, BFH, PTS, and flight manual — via faa.gov.","II-E-1":"No — inside and above Class C, balloons need transponder and ADS-B unless ATC authorizes.","II-E-2":"Class G low: 1 SM and clear of clouds. Class E: 3 SM with 500 below, 1,000 above, 2,000 out.","II-E-3":"SUA such as restricted areas and MOAs, plus TFRs — checked along my whole trajectory.","II-F-1":"Prep training within 2 calendar months, a readiness endorsement, and 61.129(h) time.","II-F-2":"Sign each entry with my certificate number; keep my endorsement records 3 years.","III-A-1":"18, private certificate, both tests; 35 hours, 20 in balloons, 10 of training.","III-A-2":"Second-class for flights for hire; instruction in a balloon is excepted since May 2023.","III-A-3":"No paid rides — a second-class only covers commercial privileges for 12 calendar months.","III-A-4":"Airworthiness and registration certificates, plus the flight manual and its limitations.","III-A-5":"Annual within 12 calendar months, plus a 100-hour when carrying people for hire; ADs.","III-A-6":"Yes — Part 43 Appendix A preventive items such as small fabric repairs, logged per 43.9.","III-A-7":"Airborne heater only — removed with gas experience plus an instructor endorsement.","III-B-1":"FSS and aviationweather.gov — METAR, TAF, winds aloft, GFA, advisories, PIREPs.","III-B-2":"FROM direction, true, at MSL levels; I drift the reciprocal — verify by pibal.","III-B-3":"Yes — gust fronts can reach well past 25 miles, so I don't launch with convection around.","III-B-4":"Only a short flight with a firm land-by time and real landing sites — otherwise I cancel.","III-C-1":"Plotted tracks from real winds on chart and road maps, landing sites, fuel, airspace, NOTAMs.","III-D-1":"Load chart at today's temperature and altitude, minus empty weight, fuel, and me.","III-D-2":"Hard limit vs. sustainable limit; envelope gauge and temperature flag; inspect if exceeded.","III-D-3":"None — 91.151 covers airplanes and rotorcraft; the manual and operator SOPs set my reserve.","III-D-4":"Hundreds of feet — burner lag means starting the burn well above the target.","III-E-1":"Liquid feeds the blast valve and coil; the pilot runs on vapor or regulated liquid.","III-E-2":"Altimeter, rate-of-climb, envelope temperature, and fuel quantity gauges — Part 31.","III-E-3":"A pressure-seated parachute top opened by the red line; it can snag or not reseat.","IV-A-1":"Objective, elements, common errors and fixes, aids, completion standards.","IV-A-2":"Overburning and overventing — fix with smaller, earlier inputs read from the variometer.","IV-A-3":"Recognize it on the vario, analyze why they over-pull, then coach smaller pulls up high.","V-A-1":"Calm timing, a big accessible site with permission, and clear obstacles and landings downwind.","V-B-1":"Crew chief, roles, crown-line safety, signals, route, emergencies — I supervise.","V-C-1":"Leak and burner checks with the basket upright, then on its side; envelope downwind.","V-D-1":"Fabric, tapes, flag, vent lines, cables, carabiners, basket, fuel system, gauges.","V-E-1":"Tie-off, cold fan inflation, short centered burns; mind fabric, fan, crown line.","V-F-1":"Hands off, stay inside; for landing face forward, knees bent, exit only when told.","V-G-1":"Wind and instrument check, lines secure, crew set, equilibrium, traffic clear.","VI-A-1":"“Unable” — then give ATC my position, drift, and intentions instead of accepting it.","VI-A-2":"CTAF or ATC frequencies from the chart; read back, and call before Class D.","VII-A-1":"Crew clear, heat past equilibrium, release, keep burning as false lift fades.","VII-B-1":"Judge height, distance, wind; preheat well past equilibrium, burn decisively.","VII-C-1":"Pick the field from surface wind cues, brief, check fuel, fly a profile, and abort early.","VII-D-1":"For small fields behind obstacles: stay high past them, descend steeper, arrest early.","VII-E-1":"Stabilize first, then let passengers out one at a time so it doesn't relaunch.","VII-F-1":"Re-brief, big field, near end; fuel off, lines drained, pilots out; deflate per manual.","VIII-A-1":"Rate within 50 fpm and altitude within 50 feet; ease the burns before reaching it.","VIII-B-1":"Vario trend, altimeter, outside cues; small regular burns hold altitude within 50 feet.","VIII-C-1":"Stop burning or vent briefly, stabilize with small burns, and level off early.","VIII-D-1":"Obstacles or hazards — watch overtemp, distortion, limits, and recovery height.","VIII-E-1":"Safe clearance, wind and thermal effects, no overburn/overvent, eyes out.","VIII-G-1":"Spot poles, climb early; if contact is unavoidable, fuel and pilots off, stay in.","VIII-H-1":"Manual-specified multi-point lines, enough room, wind limits, false lift, and crowd control.","VIII-I-1":"Vapor pressure drops — nitrogen per the manual; stiff O-rings leak; dress and gear up.","VIII-J-1":
