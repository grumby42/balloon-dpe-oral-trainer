"Survival gear, scarce landing sites, lee-side downdrafts, rotor clouds, and fast weather.","IX-A-1":"Change altitude to find a different wind direction; verify by pilotage and GPS.","IX-A-2":"Fuel, landing sites ahead, changing winds — land early if they close in.","X-A-1":"Relight with the igniter, other burner, or striker — hold altitude and land soon.","X-A-2":"Close the tank valve feeding it, fly on the other burner, and land soon.","X-A-3":"Close the tank valve feeding that line, extinguish the fire, and land.","X-A-4":"Plan reserves and a commit-to-land fuel; if it happens anyway, pick a field and brief.","X-B-1":"Extinguisher, first aid, gloves, spare striker, drop line, radio, phone, climate gear.","X-C-1":"Only as an emergency — brief, use wind and current, secure fuel and lines.","X-D-1":"Uneven heating; keep the envelope at flight temp, don't vent down, let it pass.","XI-A-1":"Contact the landowner, control crew and vehicles, minimize damage, leave gates as found.","XI-B-1":"Secure fuel, deflate downwind with the crown line, pack, inspect, checklist.","XI-C-1":"Pressurized liquid boiling near −44°F; heavy vapor; flammable; frostbite risk.","XI-C-2":"Outdoors, no ignition sources, gloves, 80% via the bleed valve, no moisture.","SC-1":"Decide now: land well short only if there's ample room — otherwise abort early over the wire.","SC-2":"Don't release them for solo — cancel today and turn it into an ADM teaching point.","SC-3":"Low pressure from the cold — switch tanks, use the other burner, and land soon.","SC-4":"No — paid rides need a second-class medical, and the annual has lapsed.","I-A-6":"Cognitive, affective, psychomotor — inflation is mostly psychomotor, plus attitude.","I-A-7":"A learning plateau — normal and temporary; explain it, vary practice, and keep them motivated.","I-C-2":"Objective, references, a plan, and aids; lecture and discussion, then a hands-on review.","I-D-3":"Open-ended lead-off questions to start it, then follow-up questions to guide it.","I-E-4":"Admit I don't know, find the answer — with them if possible — and follow up.","I-E-5":"An 8060-5; passed Areas carry over within 60 days. Discontinuance is for non-performance.","I-F-6":"A briefed three-step verbal exchange — “You have…” “I have…” “You have…” — then confirm.","I-F-7":"Decline — my endorsement certifies readiness. Show the gaps, offer a plan, set an honest date.","I-G-3":"Describe, Explain, Practice, Perform for maneuvers; Explain, Practice, Manage-Decide for SRM.","II-A-6":"Dehydration and heatstroke for everyone aboard — burner heat adds to it — so carry water.","II-A-7":"Possible CO exposure — hypemic hypoxia. Move them to fresh air and cut the burner time.","II-B-3":"Fatigue, hypoxia, alcohol, and stress all degrade vision — so scan deliberately in sectors.","II-C-4":"The warmer inversion layer shrinks the temperature difference, so lift drops.","II-D-3":"Congested: 1,000 ft above obstacles within 2,000 ft. Otherwise 500 ft, except to land.","II-D-4":"No — 91.107 excepts basket balloons. 91.103 requires all available info, weather and fuel.","II-E-4":"Class E begins at 700 ft AGL inside the vignette; dashed blue is Class D — call before entering.","II-F-3":"An endorsement certifying the training or home study, plus ID at the test.","III-A-8":"Three launches and landings in 90 days; today also counts as a flight review.","III-A-9":"Part 91 with commercial privileges — no air carrier certificate or 91.147 letter.","III-A-10":"ADs are mandatory (Part 39) and logged; service bulletins are advisory unless an AD requires them.","III-B-5":"West at 8 gusting 18 — a 10-knot spread signals mixing; likely a cancel for rides.","III-B-6":"Stable air, light winds, no thermals; a pibal is a small helium balloon showing winds aloft.","III-C-2":"Airspace, TFRs, towers and wires, congested areas, livestock, landing fields.","III-C-3":"2,000 ft carries me north; 1,000 ft pushes west — use both, and pibal it.","III-D-5":"Two hours — 30 gallons above the reserve at 15 an hour; watch the real burn.","III-D-6":"Higher envelope temperature, more fuel burn, less margin to limits — recheck the load chart.","III-E-4":"Line pressure, driven by fuel temperature; low means weak burner output — switch tanks.","IV-A-4":"Short run-out, weak briefing, late fuel shutdown, late deflation, and exiting before it stops.","IV-A-5":"A climb-gradient sketch, a time-distance example, and launch video to debrief.","V-A-2":"Don't launch there — livestock and the owner come first. Use an approved alternate.","V-B-2":"Gloves, tension, walk it in, never wrap it, let go if lifted, avoid the burner.","V-C-2":"Per the manual — correct cables and points, carabiners locked, no twists, then a second check.","V-D-2":"Only if it's within the manufacturer's damage limits for that location — else repair it.","V-E-2":"Stop — no burns into a rolling envelope; control it, reassess the wind, resume only when stable.","V-F-2":"Order them down now, re-brief everyone, and land early if they won't comply — I'm PIC.","V-G-2":"Lift equals weight — hands off, the basket neither rises nor settles; then add heat to go.","VI-A-3":"Who, who I am, where, altitude and drift, request — then wait for my call sign back.","VI-A-4":"Backup radio or relay via another balloon; fly predictably, land near roads.","VII-A-2":"Too little real lift — burn decisively if clear, or have crew hold it and reset.","VII-C-2":"Smoke, flags, water ripples, trees, other balloons — and a lower look to see the track change.","VII-C-3":"Abort now with an early, decisive burn, climb with margin, pick a new field, and re-brief.","VII-D-2":"Higher sink near the ground plus lag — arrest high, burn early, abort early.","VII-E-2":"Light winds for precise positioning — gloves, never wrap or tie it off, and let go if lifted.","VII-F-2":"A tipping, dragging basket puts flame and fuel near fabric and people — fire risk.","VII-B-2":"About 30 seconds to the wires — unless clearance is assured, relocate or cancel.","VIII-A-2":"Crown distortion, overtemp from heavy burns, and climbing into traffic above.","VIII-B-2":"Burn now to catch the trend, then ease off as the vario flattens so I don't overshoot.","VIII-C-2":"Cooling for gentle, efficient descents; venting to start or speed one up.","VIII-D-2":"Long burn now; stop when it reacts, watch envelope temp — rip out short if in doubt.","VIII-E-2":"Lee-side turbulence and sink, shear near the surface — fly higher.","VIII-G-2":"Nearly invisible guy wires reaching far out — give the whole area a wide berth.","VIII-H-2":"End it — bring it down, unload with crew on the weight, deflate, crowd back.","VIII-I-2":"Hidden obstacles, hard crew access, cold passengers, weaker burner output.","VIII-J-2":"Mountain wave — strong winds aloft, lee-side rotors and downdrafts. A no-go for balloons.","IX-A-3":"Match roads, rivers, rails, and towers to the chart, and cross-check with GPS.","IX-A-4":"Find a wind away from it; if none, land short while fuel and fields remain — don't drift in.","X-A-5":"Release the line, burn to build pressure and reseat it; if not, compensate and land soon.","X-A-6":"Fly first, give first aid, radio the crew to call 911, land near road access.","X-A-7":"Monitor it, fly gently within limits, brief everyone, land at the first suitable site.","X-B-2":"Life vests, signaling gear, waterproofed comms, and cold-water clothing.","X-C-2":"Wind on the envelope drags the basket and current moves people — use both to reach shore.","X-D-2":"Rotating thermal turbulence that can distort the envelope near the ground — avoid that field.","XI-A-2":"Listen, apologize, document it, follow company policy, keep the crew off the crop.","XI-B-2":"Envelope dragging crew, unsecured fuel, people on the fabric, spectators, and vehicles.","XI-C-3":"Expansion room as it warms; overfilled tanks vent via the relief valve — fire risk.","XI-A-3":"Keep spectators clear of envelope, burner, and vehicles; secure the fuel.","SC-5":"Reduce the load or cancel — no margin for aborts, obstacles, or thermals at max temp.","SC-6":"Likely — D-I football, 30,000+ seats: 3 NM/3,000 AGL TFR, active 1 hr before kickoff.","SC-7":"They can't see me — stop any descent, climb to open separation, and call them on the radio.","SC-8":"Take control with a positive exchange, fly safely, debrief on the ground.","SC-9":"I need to know what's aboard — leave it with the crew or they don't fly; stay professional.","SC-10":"No — 30 feet is too thin. Climb early with margin, or go to another field.","N-1":"Essentially zero — I move with the air mass, so my ground speed equals the wind speed.","N-2":"A 1°C spread, clear and calm — radiation fog likely, and it can thicken just after sunrise.","N-3":"Land now somewhere outside the fog while I have fuel and options — never descend into it.","N-4":"No — 500 ft below the clouds in Class E caps me near 2,300 AGL, short of 3,000.","N-5":"Yes — 91.209 requires lit position lights sunset to sunrise; no balloon exception.","N-6":"My actual max gross, envelope temp, rate limits, and fuel — mandatory under 91.9.","N-7":"2,200 lb — the certificated maximum gross weight governs, whatever the chart shows.","N-8":"Only over sparsely populated land, 500 ft from people, vehicles, and structures — or to land.","N-9":"About 50–125 ft — 500 fpm is ~8 ft/s across the 6–15 second lag.","N-10":"About 20 ft/s across the ground — so a high-wind technique, big field, and fuel off.","N-11":"Wind shear — false lift, then possible sink as I slow; the track changes too.","N-12":"Legal (1 SM, clear of clouds) — but too poor to spot wires; I'd likely cancel.","N-13":"The air warms as the morning goes on, so the temperature difference shrinks.","N-14":"Whistling wires (>20 mph), a rolling or diving pibal, needing extra crew to inflate.","N-15":"About 10 minutes — 18 gal aboard minus a 15 gal reserve leaves 3 gal at 18 an hour.","E-1":"Frequency in use or 121.5: Mayday/Pan-pan, position, intentions; 7700 if equipped.","E-2":"Land at the first suitable site now; crew calls 911; brief passengers; declare.","E-3":"Little — so pilot fitness is the defense; passengers hold positions and radio the briefed crew.","E-4":"He lets go at once; I stop burning, crew holds the mouth, and I reassess — likely cancel.","E-5":"Don't climb — stop burning, vent to set them down; if only a foot or two up, they can drop.","E-6":"Calm them, crouch low facing in, coach slow breathing, then land early.","E-7":"Firm command down, companions keep them low inside, land promptly, crew has 911 meet us.","E-8":"Fly first; lay them down, legs up, check breathing; crew calls 911 now; land soon.","E-9":"Possible heart attack — crew calls 911 with road access, land at once, keep them still.","E-10":"Possible anaphylaxis — their auto-injector, 911 now, and watch breathing.","E-11":"Fuel off; jump clear, never touching basket and ground together; shuffle away; 911.","E-12":"No burns near branches, fuel off, everyone stays in, crew gets help to lower the basket.","E-13":"Lower pilot doesn't climb; I heat gently to climb off, flame clear of their fabric.","E-14":"She must be able to take the landing position; if not, decline or rebook per operator policy.","E-15":"Driver only drives; navigator watches and radios; obey traffic laws; no trespass; park safely.","E-16":"Make it safe, count heads, call 911, first aid, don't move fractures, NTSB.","F-1":"Illness, Medication, Stress, Alcohol, Fatigue, Emotion — each checked honestly; any doubt is no-go.","F-2":"Yes — 61.53(b) bars PIC if you know or should know of a condition making you unable to fly safely.","F-3":"No — the FAA guide sets a 60-hour wait for diphenhydramine; when in doubt, don't fly.","F-4":"Pilot (IMSAFE, medical), Aircraft (inspections, load), enVironment, External pressures.","F-5":"Anti-authority, impulsivity, invulnerability, macho, resignation — each with its antidote.","F-6":"Macho — 'Taking chances is foolish.' Re-check personal minimums and cancel or wait.","F-7":"Resignation — 'I'm not helpless. I can make a difference.' Keep flying it to the stop.","F-8":"Invulnerability — 'It could happen to me.' Wires kill balloonists; climb now.","F-9":"Detect, Estimate, Choose, Identify, Do, Evaluate — applied to the stronger surface wind.","F-10":"Perceive hazards, Process the risk, Perform to manage it — continuously through flight.","F-11":"Likelihood × severity; CARE (Consequences, Alternatives, Reality, External); TEAM response.","F-12":"Limits set by my own experience, stricter than the rules — wind, visibility, fuel, convection.","F-13":"Get-there-itis and mindset — convenience overriding judgment; the good field is in reach.","F-14":"Yes — crew fitness is part of the operation; replace or reassign them, or don't fly.","F-15":"Managing every available resource — crew, radio, other balloons, ATC, GPS, passengers.","F-16":"Plan, Plane, Pilot, Passengers, Programming — rechecked at each key decision point."};

stest, then they practice on their own.","I-D-1|3":"Guided discussion, so they work out the inflation sequence from what they already know.","I-D-2|2":"Preparation, presentation, application, review — the intro is where you prepare.","I-E-1|1":"Critique is coaching; evaluation is grading. A good critique is honest and specific.","I-E-2|2":"Open questions that require more than a yes or no — they waste time in the basket.","I-E-2|3":"Any question the student might get wrong, since a wrong answer shakes their confidence.","I-E-3|1":"It measures what it should, consistently, is easy to grade, and separates who knows it.","I-E-3|2":"A good test is one most students pass on the first try, and the PTS works the same way.","I-F-1|3":"I can give flight and ground training and endorsements in hot air and gas balloons.","I-F-1|5":"I'll be issued a balloon flight instructor certificate that expires in 24 calendar months.","I-F-2|1":"If they laugh at odd times, freeze, or over-agree, I slow down and hold off on sign-offs.","I-F-2|2":"Stress is normal in flight training, so I wouldn't change anything — they'll adapt.","I-F-2|3":"Diagnose the condition myself and report it to the FSDO immediately so it's documented.","I-F-3|3":"Yes — one hour each of ground and flight, and the flight must be a full mock practical test.","I-F-4|1":"Student certificate, my presolo written, the required training, and a 90-day endorsement.","I-F-4|2":"Presolo test and training, then I endorse the back of their student pilot certificate.","I-F-4|3":"A third-class medical first, then the presolo knowledge test and my solo endorsement.","I-F-5|2":"Being the most experienced pilot in the room so students defer to your judgment.","I-F-5|3":"Keeping students a bit dependent on you so they keep coming back for more lessons.","I-G-1|2":"Just the maneuver name and the PTS tolerance — the rest is in the instructor's head.","I-G-1|3":"Objective and standards — but a lesson plan is really only needed for ground ok and flight manual — via faa.gov.","II-D-2|2":"Parts 61 and 91 plus the ACs, which are regulatory and must be followed exactly.","II-D-2|3":"Part 61 for me and Part 135 for the rides, since passengers are carried for hire.","II-E-1|3":"Yes, as long as I stay under 3,000 feet the Class C and its rules don't apply to me.","II-E-2|3":"Class G: 1 SM and clear of clouds; Class E below 10,000: also 1 mile, clear of clouds.","II-E-3|2":"Restricted and prohibited areas — TFRs don't apply to balloons since they aren't powered.","II-E-3|3":"MOAs, which prohibit civilian aircraft, and restricted areas when they're active.","II-F-1|1":"Training within two months, my readiness sign-off, the written review, and the hours.","II-F-1|2":"A readiness endorsement valid for 90 days, plus a review of the missed written items.","II-F-1|3":"The 61.129 hours including the controlled ascent to 2,000 feet above the launch site.","II-F-2|3":"The student signs my logbook for each lesson to prove I gave the instruction.","III-A-1|1":"18, private certificate, written and checkride, 35 hours with 20 in balloons, a high climb.","III-A-1|2":"18, a private certificate, both tests, and 35 hours of PIC time in balloons.","III-A-1|3":"You must be 21 to fly commercially, hold a private certificate, and pass both tests.","III-A-2|1":"A second class for paid rides; I don't think instructing needs one, but I'd check.","III-A-2|2":"None — balloon pilots are exempt from medical certificates, commercial or private.","III-A-2|4":"A first-class medical, since carrying passengers for hire is a commercial operation.","III-A-3|3":"Nothing — an expired medical grounds me from all flying until I renew it.","III-A-4|1":"Airworthiness and registration certificates, the flight manual, and my own certificates.","III-A-4|2":"Airworthiness, registration, and weight and balance data, just like an airplane.","III-A-4|3":"Airworthiness certificate, flight manual, and registration, which is good for 3 years.","III-A-5|1":"An annual, plus a 100-hour because I'm doing rides for hire with that balloon.","III-A-5|2":"Only an annual — 100-hour inspections are an airplane requirement, not for balloons.","III-A-6|2":"Anything at all, as long as I'm the registered owner and I'm comfortable doing it.","III-A-6|3":"Yes, preventive maintenance from Part 43 — and pilots don't need to log that work.","III-A-7|2":"No limitation — a balloon class rating covers both gas and hot air balloons.","III-A-7|3":"Hot air only; to remove it I'd need another practical test in a gas balloon.","III-B-1|3":"Flight service, METARs and TAFs, and area forecasts (FA) for all of my enroute planning.","III-B-2|2":"Direction is where the wind blows to, at each altitude — so that's my ground track.","III-B-2|3":"Direction from, speed in knots, at each level in feet AGL above the reporting station.","III-B-3|1":"Storms can push gusty winds far out ahead of them, so I'd hold off on launching.","III-B-3|2":"No — 25 miles is plenty of distance; the 20-mile thunderstorm rule is for airplanes.","III-B-3|3":"Launch quickly, keep the flight short, and land before the storm has a chance to arrive.","III-B-4|2":"We launch and see how it goes; I can always land early if the wind picks up.","III-B-4|3":"The owner makes the business call on whether we fly; my job is to fly it safely.","III-C-1|1":"Winds at a few altitudes, tracks on the chart and road map, landing fields, towers, airspace.","III-C-1|3":"Winds aloft, a sectional, and landing fields — road maps aren't relevant to the plan.","III-D-1|1":"Load chart for today's temperature and elevation, minus balloon, fuel, and me.","III-D-1|2":"The basket capacity rating tells me — six-passenger basket, six passengers.","III-D-1|3":"Load it up and try a weigh-off; as long as it lifts off, I'm within limits.","III-D-2|1":"A hard maximum and a lower continuous number; the gauge and flag tell me — inspect after.","III-D-2|2":"Limits printed in the manual, but envelope temperature only really matters on hot days.","III-D-3|2":"30 minutes in daytime, the same VFR fuel reserve the regulations require of airplanes.","III-D-3|3":"45 minutes, because a ride flight is a commercial operation with a higher reserve.","III-D-4|2":"Not much — a long burn at the bottom stops the descent almost immediately.","III-D-4|3":"About a hundred feet; vent harder to stabilize the envelope first, then burn.","III-E-1|1":"Tanks feed liquid to the burner, a valve opens the main flame, plus a quiet valve.","III-E-1|2":"The burner runs on propane vapor drawn from the top of the tank through the coil.","III-E-1|3":"Liquid to the blast valve, and the whisper valve is more efficient, used for big climbs.","III-E-2|1":"An altimeter, a VSI, the envelope temperature gauge, and the fuel gauges.","III-E-2|2":"The 91.205 day VFR equipment, like an airspeed indicator, altimeter, and compass.","III-E-2|3":"Only a fuel quantity gauge is required; everything else is optional pilot preference.","III-E-3|2":"A parachute top that the pilot must hold closed with the red line for the entire flight.","III-E-3|3":"The top vent spills air to make the envelope lighter — that's how you climb in a hurry.","IV-A-1|1":"Picking a field, the briefing, a steady descent, burning early, aborting, overventing.","IV-A-1|2":"I'd skip the ground lesson and demonstrate it in the air — balloons are learned by feel.","IV-A-1|3":"Objective: land on the spot. Common error: landing too slowly. Then practice it.","IV-A-2|2":"Flying too high — fly as low as possible to stay out of the wind shear layers.","IV-A-2|3":"The most common error is not using the vent enough — teach early, aggressive venting.","IV-A-3|3":"Tell them to never use the vent on approach and control the descent with burns only.","V-A-1|2":"Any field the crew can get into — obstacles only matter on the landing end.","V-A-1|3":"Launch at midday when visibility is best, from the biggest field the crew can find.","V-B-1|3":"Briefings are optional for an experienced crew — they already know their jobs.","V-C-1|2":"Lay the envelope upwind of the basket so the wind helps fill it during inflation.","V-C-1|3":"Leak check the fittings, then test the burner by firing it into the envelope mouth.","V-E-1|2":"Fan it cold, then long continuous burns to stand it up faster, especially in wind.","V-E-1|3":"Cold then hot inflation — tie-off is unnecessary as long as crew holds the basket.","V-F-1|1":"Don't touch anything, stay inside, hold the handles, knees bent, wait until I say.","V-F-1|2":"Hands off the burner, and for landing lock your knees straight and brace hard.","V-G-1|2":"Instrument and wind check — equilibrium only matters in gas balloons, not hot air.","V-G-1|3":"Gauges, lines, and crew — no traffic check needed since balloons have right-of-way.","VI-A-1|2":"Acknowledge with 'Wilco,' then try to climb to find a westerly wind to comply.","VI-A-1|3":"Nothing — I'd turn the radio down; balloons don't need clearances from towers.","VI-A-2|1":"CTAF to self-announce at uncontrolled fields, tower or approach at towered ones.","VI-A-2|2":"Chart frequencies, and I'd use the ground crew radio frequency to talk to towers.","VI-A-2|3":"Tower frequency at towered fields; at non-towered fields no call is appropriate for us.","VII-A-1|1":"Get light, add extra heat for the wind, release, and keep burning so I don't sink.","VII-A-1|3":"Get light, release, and vent slightly after lift-off to keep the climb rate slow.","VII-B-1|2":"Launch light and let the wind push me up and over them — the gusts help at the edge.","VII-B-1|3":"Launch, then vent if I'm closing on the trees too fast so I don't overshoot them.","VII-C-1|1":"Good field, watch low-level wind, brief, check fuel, steady descent, burn out early.","VII-C-1|2":"Pick the field, descend fast, and level off at the last second for a crisp touchdown.","VII-D-1|2":"A steep approach is just a dive at the maximum descent rate, then a hard flare burn.","VII-D-1|3":"Steep approaches are ght.","VIII-I-1|3":"Cold air gives more lift, so lower fuel pressure doesn't really matter in winter.","VIII-J-1|1":"Survival gear, plan the few landing spots, lee-side downdrafts, and fast weather changes.","VIII-J-1|2":"Mountains provide reliable ridge lift, which makes balloon flight easier and longer.","VIII-J-1|3":"Survival gear only — no extra preparation needed if the winds aloft are light.","IX-A-1|2":"Use the turning vents to steer toward the destination, and check the map against GPS.","IX-A-2|2":"Fly until fuel reaches the reserve, then start looking for a suitable landing site.","IX-A-2|3":"Duration is set by the passenger ticket — 60 minutes — then I find a landing site.","X-A-1|2":"Open the blast valve wide so the hot coil relights the pilot light from residual heat.","X-A-1|3":"Ignore it and continue — the main burner keeps working without the pilot light.","X-A-2|1":"Turn off the tank feeding that burner, use the other burner, and get down soon.","X-A-2|2":"Vent continuously to counteract the climb until the valve frees itself up.","X-A-2|3":"Pull the burner hose off the fitting to stop the fuel flow to that burner.","X-A-3|1":"Shut that tank off, put out the fire with the extinguisher, and land ASAP.","X-A-3|2":"Douse it with the passengers' water bottles, then switch to another tank.","X-A-3|3":"Keep burning to land faster, then deal with the leak once we're on the ground.","X-A-4|3":"Watch the gauges; if you run out, venting slows the descent until you can land.","X-B-1|1":"A fire extinguisher, first aid kit, gloves, a striker, a radio, and a phone.","X-B-1|2":"A parachute for each passenger, plus a fire extinguisher and a first aid kit.","X-B-1|3":"Equipment only matters for long cross-country flights, not short local ride flights.","X-C-1|3":"Water landings are softer, so I'd prefer them to rough fields when fuel is low.","X-D-1|1":"Sun heating the ground; dust devils and cumulus; a rough ride — so avoid midday flying.","X-D-1|2":"Sun-heated air rising — thermals help balloons climb, so use them for altitude gains.","X-D-1|3":"Thermals are only a mountain flying phenomenon, from heated rock faces and slopes.","XI-A-1|3":"Supervise the crew; landowner contact is the chase crew's job, not the pilot's.","XI-B-1|2":"Fuel off, then deflate into the wind so the envelope folds back over the basket.","XI-B-1|3":"Deflate downwind and leave the pilot lights on during pack-up for easy reignition.","XI-C-1|1":"A liquid under pressure that turns to a heavy vapor, sits in low spots, cold, flammable.","XI-C-1|2":"Stored as liquid; the vapor is lighter than air and disperses upward if it leaks.","XI-C-1|3":"It stays a liquid at room temperature in open air, so spills are easy to clean up.","XI-C-2|2":"Outdoors with gloves, and fill to 100% to maximize flight time on ride days.","XI-C-2|3":"Outdoors, fill to 80%; moisture in tanks is harmless because propane absorbs it.","SC-1|2":"Vent hard to get down quickly and try to slide into the field under the line.","SC-1|3":"Continue the approach and decide at about 20 feet, when the picture is clearest.","SC-2|1":"Cancel the solo and talk with them about their fitness to fly this morning.","SC-2|2":"Fly dual instead, so they can still manipulate the controls with me aboard.","SC-2|3":"It's their certificate and their call — I'd remind them of 91.17 and let them decide.","SC-3|1":"Probably low pressure from the cold — switch tanks and land soon.","SC-3|2":"Probably cold — keep burning on that tank until the pressure comes back up.","SC-3|3":"Low pressure — bleed the tank a bit to raise the pressure, then keep flying.","I-D-2|1":"Opening, body, wrap-up — the opening grabs attention and says what's coming.","I-F-1|1":"I can teach balloon flying, sign students off for solo and checkrides, and do flight reviews.","I-G-1|1":"What and why, the steps, how long, what we need, who does what, how we know.","I-G-2|1":"Simple to complex, based on the checkride standard, adjusted to the student and weather.","II-A-1|1":"Not enough oxygen — altitude, CO, or alcohol. You get dumb and happy. Descend.","II-D-1|1":"Serious injury makes it an accident — call the NTSB and file within 10 days.","II-E-2|1":"Class G low: one mile, clear of clouds. Class E: three miles and the 500/1,000/2,000.","II-F-2|1":"I sign their logbook with my cert number and what we did, and keep my own notes.","III-B-2|1":"Where the wind comes from and how fast at each altitude; I'll go the opposite way.","III-D-3|1":"I don't think there's a balloon rule, but I plan to land with a tank left.","III-E-3|1":"Pull the red line and the top opens; let go and it closes — it can stick or tangle.","IV-A-3|1":"Point it out, figure out why, and have them practice smaller pulls at altitude.","V-B-1|1":"Assign jobs, cover the crown line rule, set signals, and say where we're headed.","V-C-1|1":"Check the fuel and burner first, then lay the basket down and spread out the envelope.","V-D-1|1":"Fabric, cables, carabiners, basket, burners, hoses, tanks, gauges — damage and leaks.","V-E-1|1":"Tie off, fan cold air in, then short burns while the crew holds mouth and crown.","V-G-1|1":"A final look at wind and obstacles, gauges good, lines secure, crew ready, then go.","VI-A-1|1":"I'd tell them I can't, since I'm a balloon, and give my position and plan.","VII-B-1|1":"Get very hot before launch so I climb steeply, and keep burning past the trees.","VII-D-1|1":"Small fields behind obstacles — stay high, come down steeper, stop it in time.","VIII-E-1|1":"Stay at a safe height, watch for wires and wind changes, small corrections.","IX-A-2|1":"Fuel, landing spots, and worsening weather — I adjust or land early.","X-A-4|1":"Watch the gauges and land with fuel left; if I run out, find a field and brief.","X-C-1|1":"Only if there's no choice — brief everyone, consider wind and current.","XI-C-2|1":"Outside, no flames around, gloves on, fill to about 80%, check for leaks.","III-A-6|1":"I can do minor preventive maintenance from Part 43, like small fabric patches, if logged.","VIII-D-2|1":"Burn right away — a long one — and keep a close eye on clearance over the wires.","X-A-6|1":"Get them help from the others, have the crew call 911, and land soon near a road.","VI-A-4|1":"Try my backup radio, and if that fails, land somewhere easy to find near a road.","VII-E-1|3":"Rip it out at touchdown and have everyone step out right away while it deflates.","IV-A-4|3":"Shutting off fuel early is the error — keep both burners live through the drag to stay warm.","V-C-2|2":"Leave the screw gates slightly open so you can disconnect fast in an emergency.","N-15|3":"About 50 minutes — two tanks still show fuel, and the reserve is just the lowest tank.","E-12|2":"Burn hard even with branches in the mouth — getting out matters more than the fire risk.","F-3|1":"Probably not — Benadryl's drowsiness lasts a long time, so I'd wait two to three days.","F-8|1":"I'm assuming nothing bad will happen because it never has — I'd climb right away.","F-8|3":"Macho — I'm showing off my low flying because I like proving I can do it."
};

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const areaOf=a=>PTS.find(p=>p.a===a), taskName=(a,t)=>{const x=areaOf(a).tasks.find(k=>k[0]===t);return x?x[1]:t};
const TL={B:"BOOK",S:"SEMI",W:"WRONG"};
const dtext=(q,i)=>{const a=q.ans[i];return a[0]==="B"?(KEYS[q.id]||a[1]):(DISP[q.id+"|"+i]||a[1])};
const full=(q,i)=>q.ans[i][0]==="B"&&KEYS[q.id]?`<div class="why"><b>Full model answer:</b> ${esc(q.ans[i][1])}</div>`:"";
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
$("#bid").textContent=BUILD;$("#bid2").textContent=BUILD;$("#bts").textContent=STAMP;

// ---------- DPE levels ----------
const LEVELS={
 1:{name:"DPE is basically giving it away",short:"Giveaway",
   intro:["Morning! Coffee's over there. This'll be painless — I've seen your logbook, you'll be fine.","Let's just chat about ballooning for a bit, then we'll go fly."],
   desc:"~1 question per Area. Semi answers pass. Wrong answers get a hint and another try. Only a repeated safety-critical miss fails.",
   ok:["Yep, that's it.","Good enough for me.","Sure, sure — you've got it.","Close enough, moving on."],
   hint:"Hmm… you sure about that? Think about it a second — want to try again?"},
 2:{name:"The DPE is understanding and works with you",short:"Understanding",
   intro:["Thanks for coming in. I'm going to cover every Area of Operation in the PTS — this is a conversation, not an interrogation.","If you don't know something, tell me how you'd find it. If an answer is incomplete, I'll ask a follow-up."],
   desc:"Every Area; FOI Task F + one more. Semi answers get a probing follow-up. One retry on a wrong answer (the PTS lets an evaluator repeat an incomplete or uncertain Task). Second miss = unsatisfactory.",
   ok:["Good.","That's what I'm looking for.","Nice — that's correlative, I like that.","Okay, good."],
   probe:"Okay, you're in the neighborhood. Can you be more specific?",retry:"Let's back up — I'm not sure that's right. Take another run at it."},
 3:{name:"Strictest DPE Ever + FAA observer present",short:"Strict + ASI",
   intro:["This is Inspector Hale from the FSDO. She's observing me today, not you — but understand I'll be conducting this exactly by the book.","Every Task in every Area. I expect references. I will not lead you. You may stop the test at any time."],
   desc:"Every LBH Task plus scenario/correlation questions. 90-second clock. Semi answers get exactly one probe — must reach the book answer. Wrong answer = unsatisfactory; wrong on a safety-critical item = immediate disapproval.",
   ok:["Noted.","Satisfactory.","Continue.","Next item."],
   probe:"That's vague. What does the reference actually say?"}
};
const ASI=["(ASI writes on her clipboard.)","ASI to examiner: “Make sure you're testing correlation, not rote — ask for the why.”","(ASI checks her copy of the plan of action against the PTS Area list.)","ASI: “Examiner, you didn't ask for a reference on that one.”","(ASI notes the time.)","ASI to examiner: “Did you evaluate that Task in its entirety?”"];

// ---------- plan of action ----------
function buildPlan(L){
 const plan=[];
 const by=(a,t)=>BANK.filter(q=>q.a===a&&q.t===t&&!q.s);
 const prefer=(arr,f)=>{const g=arr.filter(f);return pick(g.length?g:arr)};
 for(const P of PTS){
  let tasks=P.tasks.map(t=>t[0]);
  if(P.a==="I"){const others=shuf(tasks.filter(t=>t!=="F"));tasks=["F",...others.slice(0,L===3?2:1)];if(L===1)tasks=["F"];}
  else if(L===1)tasks=[pick(tasks)];
  else if(L===2&&tasks.length>3)tasks=shuf(tasks).slice(0,Math.ceil(tasks.length/2));
  for(const t of tasks){const pool=by(P.a,t);if(!pool.length)continue;
   plan.push(L===1?prefer(pool,q=>q.d===1):L===3?prefer(pool,q=>q.d>=2):pick(pool));}
  const sc=BANK.filter(q=>q.s&&q.a===P.a);
  if(L===3)plan.push(...sc);
 }
 if(L===2){const sc=BANK.filter(q=>q.s);const x=pick(sc);const i=PTS.findIndex(p=>p.a===x.a);let pos=plan.findLastIndex(q=>PTS.findIndex(p=>p.a===q.a)<=i);plan.splice(pos+1,0,x);}
 return plan.map(q=>q.id);
}

// ---------- session ----------
let S=null, tick=null;
function start(){
 const L=+document.querySelector("input[name=lvl]:checked").value, mode=document.querySelector("input[name=mode]:checked").value;
 S={L,mode,name:$("#cname").value.trim()||"Applicant",plan:buildPlan(L),i:0,stage:"ask",tried:[],res:{},failed:{},ended:null,startUTC:new Date().toISOString(),asi:L===3};
 renderIntro();
}
const Q=()=>BANK.find(q=>q.id===S.plan[S.i]);
function renderIntro(){
 const lv=LEVELS[S.L];
 app.innerHTML=`<div class="card"><div class="chip">${esc(lv.short)}</div><div class="chip">${S.mode==="exam"?"Examiner console":"Candidate self-test"}</div><div class="chip">${S.plan.length} items on the plan of action</div>
 ${lv.intro.map(t=>`<div class="${t.startsWith("This is Inspector")?"asi":"dpe"}">“${esc(t)}”</div>`).join("")}
 ${S.mode==="exam"?`<p class="small">Read each question aloud. Listen. Then tap the answer card that best matches what ${esc(S.name)} said (or use the level buttons). Probe and retry prompts appear automatically for the selected DPE level.</p>`:""}
 <button class="pri" onclick="ask()">Begin oral</button></div>`;
}
function progress(){return `<div class="row small"><span>Item ${S.i+1} / ${S.plan.length}</span><span style="flex:1"></span>${S.L===3&&S.mode==="cand"?`<span class="timer" id="tm"></span>`:""}</div><div class="bar"><i style="width:${(S.i/S.plan.length*100).toFixed(1)}%"></i></div>`}
function ask(){
 clearInterval(tick);
 if(S.i>=S.plan.length)return finish();
 const q=Q(), lv=LEVELS[S.L];
 const avail=q.ans.map((a,k)=>({a,k})).filter(o=>!S.tried.includes(o.k));
 const opts=S.mode==="exam"?avail:shuf(avail);
 let lead="";
 if(S.stage==="probe")lead=`<div class="dpe">“${esc(q.fu||lv.probe)}”</div>`;
 if(S.stage==="retry")lead=`<div class="dpe">“${esc(S.L===1?lv.hint:lv.retry)}”</div>`;
 const asi=S.asi&&S.stage==="ask"&&Math.random()<.3?`<div class="asi">${esc(pick(ASI))}</div>`:"";
 app.innerHTML=`<div class="card">${progress()}
 <div class="row" style="margin-top:8px"><span class="chip">Area ${q.a} · ${esc(areaOf(q.a).n)}</span><span class="chip">${areaOf(q.a).tasks.length>1?"Task "+q.t+" · ":"Task: "}${esc(taskName(q.a,q.t))}</span>${q.c?'<span class="chip">⚠ safety-critical</span>':""}${q.s?'<span class="chip">scenario</span>':""}</div>
 ${asi}<p class="q">${esc(q.q)}</p>${lead}
 ${opts.map(o=>`<button class="opt" onclick="grade(${o.k})">${S.mode==="exam"?`<span class="tag t${o.a[0]}">${TL[o.a[0]]}</span>${esc(o.a[1])}<div class="why">${esc(o.a[2])}</div>`:esc(dtext(q,o.k))}</button>`).join("")}
 ${S.mode==="exam"?`<div class="row" style="margin-top:8px"><span class="small">Candidate said something else, at the level of:</span><button onclick="gradeT('B')">Book</button><button onclick="gradeT('S')">Semi</button><button onclick="gradeT('W')">Wrong</button></div><textarea id="note" rows="2" placeholder="Examiner note (saved to debrief)"></textarea>`:""}
 <p class="small">Ref: ${esc(q.ref)}</p></div>`;
 if(S.L===3&&S.mode==="cand"){let t=90;const el=$("#tm");el.textContent=t+"s";tick=setInterval(()=>{t--;el.textContent=t+"s";if(t<=0){clearInterval(tick);timeout()}},1000)}
}
function gradeT(t){const q=Q();const k=q.ans.findIndex((a,i)=>a[0]===t&&!S.tried.includes(i));grade(k>=0?k:q.ans.findIndex(a=>a[0]===t),true)}
function timeout(){const q=Q();rec(q,"UNSAT",["TIMEOUT"]);S.tried=[];afterRes(q,"UNSAT","Time. I'm going to mark that one unsatisfactory.")}
function rec(q,r,path,note){const prev=S.res[q.id];S.res[q.id]={r,path:(prev?prev.path:[]).concat(path),note:[prev&&prev.note,note].filter(Boolean).join(" | ")}}
function grade(k,typed){
 clearInterval(tick);
 const q=Q(),a=q.ans[k],t=a[0],L=S.L,first=S.stage==="ask",lv=LEVELS[L];
 const note=($("#note")&&$("#note").value.trim())||"";
 S.tried.push(k);S.res[q.id]=S.res[q.id]||{r:null,path:[],note:""};
 const path=[t+(typed?"*":"")];
 let r=null,next=null,say=pick(lv.ok);
 if(first){
  if(t==="B")r="SAT";
  else if(t==="S"){if(L===1)r="SAT";else next="probe";}
  else { if(L===3){r=q.c?"DISQ":"UNSAT";} else next="retry"; }
 } else {
  if(t==="B")r="SAT-P";
  else if(L===1)r=(t==="W"&&q.c)?"UNSAT":"SAT-P";
  else if(L===2)r=t==="S"?"WEAK":"UNSAT";
  else r="UNSAT";
 }
 S.res[q.id].path.push(...path);if(note)S.res[q.id].note=[S.res[q.id].note,note].filter(Boolean).join(" | ");
 if(next){S.stage=next;return ask();}
 S.res[q.id].r=r;S.tried=[];
 if(r==="UNSAT")say=L===1?"Well… we'll need to talk about that one.":"I'm afraid that one doesn't meet the standard.";
 if(r==="DISQ")say="Stop there. That answer, in the airplane, gets someone hurt. I can't continue this practical test.";
 if(r==="WEAK")say="Okay — I'll accept that, but we're going to debrief it.";
 afterRes(q,r,say);
}
function afterRes(q,r,say){
 S.stage="ask";
 const bad=r==="UNSAT"||r==="DISQ";
 if(bad){S.failed[q.a]=S.failed[q.a]||[];S.failed[q.a].push(q.t)}
 const reveal=q.ans.map((a,i)=>`<div class="opt" style="cursor:default"><span class="tag t${a[0]}">${TL[a[0]]}</span>${esc(S.mode==="exam"?a[1]:dtext(q,i))}<div class="why">${esc(a[2])}</div>${S.mode==="exam"?"":full(q,i)}</div>`).join("");
 let ctrl=`<button class="pri" onclick="nextQ()">Next</button>`;
 if(r==="DISQ")ctrl=`<button class="pri" onclick="S.ended='disq';finish()">Receive Notice of Disapproval</button>`;
 else if(r==="UNSAT"&&S.L>1)ctrl=`<p class="dpe">“Area ${q.a} is unsatisfactory, which means the practical test is failed. You can stop now, or continue so I can give you credit for the Areas you complete — your choice.”</p><div class="row"><button class="pri" onclick="nextQ()">Continue for credit</button><button onclick="S.ended='stopped';finish()">Stop the test</button></div>`;
 app.innerHTML=`<div class="card">${progress()}<p class="q">${esc(q.q)}</p>
 <p>Result: <b class="r-${r}">${r}</b></p><div class="dpe">“${esc(say)}”</div>
 ${S.asi&&bad?`<div class="asi">(ASI nods and writes: “Unsat Task ${q.a}.${q.t} — properly identified.”)</div>`:""}
 <details ${S.mode==="cand"?"open":""}><summary>Every answer, and why</summary>${reveal}</details>
 <p class="small">Ref: ${esc(q.ref)}</p>${ctrl}</div>`;
}
function nextQ(){S.i++;S.tried=[];ask()}

// ---------- finish ----------
function finish(){
 clearInterval(tick);
 S.done=true;S.endUTC=new Date().toISOString();
 const failedAreas=Object.keys(S.failed), pass=!failedAreas.length&&!S.ended;
 const askedAreas=new Set(S.plan.slice(0,S.i+ (S.ended?1:0)).map(id=>BANK.find(q=>q.id===id).a));
 const notTested=PTS.filter(p=>!askedAreas.has(p.a)).map(p=>p.a);
 const counts={};Object.values(S.res).forEach(x=>{if(x.r)counts[x.r]=(counts[x.r]||0)+1});
 const hist=store.get("baln-dpe-hist",[]);hist.unshift({build:BUILD,utc:S.endUTC,name:S.name,level:S.L,mode:S.mode,pass,failed:S.failed,counts});store.set("baln-dpe-hist",hist.slice(0,50));
 store.set("baln-dpe-last",S.res);
 const doc=pass?`<div class="cert"><b>TEMPORARY AIRMAN CERTIFICATE (simulated)</b><br>${esc(S.name)} — COMMERCIAL PILOT<br>LIGHTER-THAN-AIR BALLOON<br><b>LIMITED TO BALLOONS WITH AIRBORNE HEATER</b> (14 CFR 61.133(b)(2))<br><span class="small">Instructional privileges: 61.133(a)(2)(ii) — balloon only.</span></div>`
 :`<div class="nod"><b>NOTICE OF DISAPPROVAL OF APPLICATION — FAA Form 8060-5 (simulated)</b><br>Applicant: ${esc(S.name)}<br>${S.ended==="disq"?"Practical test discontinued by evaluator — safety of flight.<br>":""}
 Areas of Operation failed: ${failedAreas.map(a=>`<b>${a}</b> (Task ${[...new Set(S.failed[a])].join(", ")})`).join("; ")||"—"}<br>
 ${notTested.length?`Areas not tested: ${notTested.join(", ")}<br>`:""}<span class="small">Retest: the evaluator re-tests failed Areas; additional training and a new instructor endorsement are required (61.49).</span></div>`;
 const rows=S.plan.map(id=>{const q=BANK.find(x=>x.id===id),x=S.res[id];if(!x||!x.r)return"";const b=q.ans.find(a=>a[0]==="B");
  return `<tr><td>${q.a}.${q.t}</td><td><b class="r-${x.r}">${x.r}</b><div class="small">${x.path.join("→")}</div></td><td>${esc(q.q)}<details><summary class="small">Book answer</summary><div class="small">${esc(b[1])}</div></details>${x.note?`<div class="small">📝 ${esc(x.note)}</div>`:""}</td></tr>`}).join("");
 app.innerHTML=`<div class="card"><div class="dpe">“${pass?"Congratulations. Let's get your temporary certificate printed.":"Let's sit down and go over this together."}”</div>${doc}
 <p class="small">${Object.entries(counts).map(([k,v])=>`${k}: ${v}`).join(" · ")} — DPE: ${esc(LEVELS[S.L].short)}</p>
 <div class="row"><button class="pri" onclick="exportTxt()">Export debrief (.txt)</button><button onclick="view('setup')">New checkride</button></div></div>
 <div class="card"><b>Debrief</b><table><tr><th>Task</th><th>Result</th><th>Question</th></tr>${rows}</table>
 <p class="small">SAT-P = satisfactory after a probe or retry · WEAK = accepted, must debrief · UNSAT/DISQ fail the Area (and the test). Path: B/S/W = book/semi/wrong answer chosen; * = examiner-typed level.</p></div>`;
}
function exportTxt(){
 const L=[`BALLOON COMMERCIAL (LBH) DPE ORAL — DEBRIEF`,`Build ${BUILD} · shipped ${STAMP}`,`Exported ${new Date().toISOString()}`,`Applicant: ${S.name} · DPE: ${LEVELS[S.L].name} · Mode: ${S.mode}`,`Started ${S.startUTC} · Ended ${S.endUTC}`,`Outcome: ${Object.keys(S.failed).length||S.ended?"DISAPPROVED — failed Areas "+Object.keys(S.failed).join(", "):"PASS — limited to balloons with airborne heater"}`,""];
 S.plan.forEach(id=>{const q=BANK.find(x=>x.id===id),x=S.res[id];if(!x||!x.r)return;L.push(`[${x.r}] ${q.a}.${q.t} ${q.id} (${x.path.join(">")})`,`Q: ${q.q}`,`BOOK: ${q.ans.find(a=>a[0]==="B")[1]}`,`REF: ${q.ref}`);if(x.note)L.push(`NOTE: ${x.note}`);L.push("")});
 const blob=new Blob([L.join("\n")],{type:"text/plain"}),u=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=u;a.download=`baln-dpe-debrief-${new Date().toISOString().replace(/[:.]/g,"").slice(0,15)}Z.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);
}

// ---------- other views ----------
function viewSetup(){
 app.innerHTML=`<div class="card"><b>Choose your examiner</b><div class="lvl" style="margin-top:8px">
 ${[1,2,3].map(n=>`<label><input type="radio" name="lvl" value="${n}" ${n===2?"checked":""}><b>Level ${n} — “${esc(LEVELS[n].name)}”</b><div class="small">${esc(LEVELS[n].desc)}</div></label>`).join("")}</div></div>
 <div class="card"><b>Who's driving?</b><div class="lvl" style="margin-top:8px">
 <label><input type="radio" name="mode" value="cand" checked><b>Candidate self-test</b><div class="small">Answers shuffled and unlabeled; pick the one closest to what you'd say. Full explanations after each item.</div></label>
 <label><input type="radio" name="mode" value="exam"><b>Examiner console (mock oral)</b><div class="small">For the instructor running the mock: read the question aloud, see BOOK / SEMI / WRONG answers with explanations, tap what the candidate actually said, add notes. Probe/retry prompts follow the DPE level.</div></label></div>
 <p><input type="text" id="cname" placeholder="Applicant name (for the debrief)"></p>
 <button class="pri" onclick="start()">Build plan of action & start</button></div>`;
}
function viewBank(){
 app.innerHTML=`<div class="card"><div class="row"><select id="fa" style="max-width:220px"><option value="">All Areas</option>${PTS.map(p=>`<option value="${p.a}">${p.a} — ${esc(p.n)}</option>`).join("")}</select><input type="text" id="fs" placeholder="Search" style="max-width:260px"><label class="small"><input type="checkbox" id="fc"> safety-critical only</label></div><p class="small" id="fn"></p></div><div id="bl"></div>`;
 const draw=()=>{const a=$("#fa").value,s=$("#fs").value.toLowerCase(),c=$("#fc").checked;
  const L=BANK.filter(q=>(!a||q.a===a)&&(!c||q.c)&&(!s||JSON.stringify(q).toLowerCase().includes(s)));
  $("#fn").textContent=`${L.length} of ${BANK.length} questions`;
  $("#bl").innerHTML=L.map(q=>`<div class="card"><div class="row"><span class="chip">${q.id}</span><span class="chip">${q.a}.${q.t} ${esc(taskName(q.a,q.t))}</span>${q.c?'<span class="chip">⚠ critical</span>':""}${q.s?'<span class="chip">scenario</span>':""}</div><p class="q">${esc(q.q)}</p>${q.fu?`<p class="small">Probe: “${esc(q.fu)}”</p>`:""}<details><summary>Answers (${q.ans.length})</summary>${q.ans.map((x,i)=>`<div class="opt" style="cursor:default"><span class="tag t${x[0]}">${TL[x[0]]}</span>${esc(dtext(q,i))}<div class="why">${esc(x[2])}</div>${full(q,i)}</div>`).join("")}</details><p class="small">Ref: ${esc(q.ref)}</p></div>`).join("")};
 ["#fa","#fs","#fc"].forEach(s=>$(s).addEventListener("input",draw));draw();
}
function viewCov(){
 const last=store.get("baln-dpe-last",{});
 app.innerHTML=`<div class="card"><b>PTS FAA-S-8081-18A — Section 1 Balloon (LBH)</b><p class="small">Questions in the bank per Task, and your most recent result. VIII-F High Altitude Flight is LBG-only and not tested for an airborne-heater applicant.</p>
 ${PTS.map(p=>`<h3 style="margin:14px 0 4px;font-size:16px">${p.a}. ${esc(p.n)}</h3>${p.note?`<div class="small">${esc(p.note)}</div>`:""}<table>${p.tasks.map(t=>{const qs=BANK.filter(q=>q.a===p.a&&q.t===t[0]);const rs=qs.map(q=>last[q.id]&&last[q.id].r).filter(Boolean);return `<tr><td style="width:36px">${p.tasks.length>1?t[0]:"—"}</td><td>${esc(t[1])}</td><td style="width:60px">${qs.length} q</td><td style="width:120px">${rs.map(r=>`<span class="r-${r}">${r}</span>`).join(" ")||'<span class="small">—</span>'}</td></tr>`}).join("")}</table>`).join("")}</div>`;
}
function viewHist(){
 const h=store.get("baln-dpe-hist",[]);
 app.innerHTML=`<div class="card"><b>Session history</b> <span class="small">(this browser only)</span>${h.length?`<table><tr><th>UTC</th><th>Applicant</th><th>DPE</th><th>Outcome</th></tr>${h.map(x=>`<tr><td class="small">${esc(x.utc.slice(0,16).replace("T"," "))}Z</td><td>${esc(x.name)}</td><td>L${x.level} ${x.mode==="exam"?"(console)":""}</td><td class="${x.pass?"r-SAT":"r-UNSAT"}">${x.pass?"PASS":"Disapproved "+Object.keys(x.failed).join(",")}</td></tr>`).join("")}</table><button onclick="if(confirm('Clear history?')){store.set('baln-dpe-hist',[]);store.set('baln-dpe-last',{});viewHist()}">Clear</button>`:'<p class="small">No sessions yet.</p>'}</div>`;
}
function viewAbout(){
 app.innerHTML=`<div class="card"><b>How it grades</b><table>
 <tr><th></th><th>Book</th><th>Semi</th><th>Wrong</th></tr>
 <tr><td>L1 Giveaway</td><td>SAT</td><td>SAT</td><td>Hint + retry; only a repeated safety-critical miss is UNSAT</td></tr>
 <tr><td>L2 Understanding</td><td>SAT</td><td>Probe → book = SAT-P, semi = WEAK, wrong = UNSAT</td><td>One retry → book = SAT-P, semi = WEAK, wrong = UNSAT</td></tr>
 <tr><td>L3 Strict + ASI</td><td>SAT</td><td>One probe → must reach book, else UNSAT</td><td>UNSAT; safety-critical = immediate disapproval</td></tr></table>
 <p class="small">Anti-tell: in self-test, every option is shown in a length-matched version (build check: the book answer is never visibly longer or shorter than all the other options by 10% or more). The full model answer appears in the reveal.</p><p class="small">Any UNSAT Task fails its Area and the test (PTS: Unsatisfactory Performance). L2/L3 offer to continue for credit, then issue a simulated 8060-5 listing failed and untested Areas. L3 adds a 90-second clock in self-test mode.</p></div>
 ${ERRLOG.length?`<div class="card"><b>Accuracy review — ${ERRLOG.length} corrections applied</b><p class="small">Pre-checkride review against eCFR, AIM, PTS 8081-18A, AIH 8083-9B and BFH 8083-11.</p><table>${ERRLOG.map(e=>`<tr><td style="width:70px">${esc(e.id)}${e.i!==undefined&&e.i!==null?" ["+e.i+"]":""}</td><td class="small">${esc(e.note)}${e.src?`<br><i>${esc(e.src)}</i>`:""}</td></tr>`).join("")}</table></div>`:""}
 <div class="card"><b>Sources checked for this build</b><ul class="small">
 <li>FAA-S-8081-18A Commercial Pilot PTS, Lighter-Than-Air (Nov 2023) — Areas/Tasks, tolerances (±50 ft, ±50 fpm), special emphasis areas.</li>
 <li>14 CFR 61.129(h) balloon aeronautical experience; 61.133(a)(2)(ii) and (b)(2) privileges and airborne-heater limitation.</li>
 <li>Medical Certification Standards for Commercial Balloon Operations, final rule (87 FR 71218, Nov 22, 2022; medical provisions effective May 22, 2023).</li>
 <li>Other items (AIH, BFH, AIM, Part 91/830/31/43) from standard references — verify against current editions and your flight manual; manufacturer limits always govern.</li></ul></div>`;
}
const VIEWS={setup:viewSetup,bank:viewBank,cov:viewCov,hist:viewHist,about:viewAbout};
function view(v){if(S&&!S.done&&v!=="setup"&&S.i<S.plan.length&&!confirm("Leave the checkride in progress?"))return;clearInterval(tick);S=null;VIEWS[v]();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
$("#nav").addEventListener("click",e=>{if(e.target.dataset.v)view(e.target.dataset.v)});
view("setup");
</script>
