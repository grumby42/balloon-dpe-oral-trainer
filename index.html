:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1a16;--mute:#6b6459;--line:#e2dccf;--acc:#c2410c;--acc2:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--chip:#efe9dd}
@media (prefers-color-scheme:dark){:root{--bg:#15130f;--card:#1f1c17;--ink:#f2ede4;--mute:#a59d8f;--line:#363027;--acc:#fb923c;--acc2:#2dd4bf;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#2a261f}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:18px;margin:0}.sub{color:var(--mute);font-size:12px}
nav{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
nav button{flex:none}
main{max-width:860px;margin:0 auto;padding:16px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.on{outline:2px solid var(--acc)}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.lvl{display:grid;gap:10px}.lvl label{display:block;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}
.lvl input{margin-right:8px}.lvl label:has(input:checked){border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.dpe{border-left:4px solid var(--acc);padding:8px 12px;background:var(--chip);border-radius:8px;margin:8px 0;font-style:italic}
.asi{border-left:4px solid var(--acc2);padding:8px 12px;background:var(--chip);border-radius:8px;margin:8px 0;font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}
.opt .why{font-size:14px;color:var(--mute);margin-top:6px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:6px;color:#fff;margin-right:6px}
.tB{background:var(--ok)}.tS{background:var(--warn)}.tW{background:var(--bad)}
.r-SAT,.r-SAT-P{color:var(--ok)}.r-WEAK{color:var(--warn)}.r-UNSAT,.r-DISQ{color:var(--bad)}
.q{font-size:18px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
textarea,input[type=text],select{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.cert{border:3px double var(--ok);border-radius:12px;padding:16px}.nod{border:3px double var(--bad);border-radius:12px;padding:16px}
details summary{cursor:pointer;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.small{font-size:13px;color:var(--mute)}
footer{color:var(--mute);font-size:12px;text-align:center;padding:20px}
</style>
</head>

const PTS=[{"a":"I","n":"Fundamentals of Instructing","note":"Evaluator selects Task F plus at least one other.","tasks":[["A","The Learning Process"],["B","Human Behavior"],["C","The Teaching Process"],["D","Teaching Methods"],["E","Critique and Evaluation"],["F","Flight Instructor Characteristics and Responsibilities"],["G","Planning Instructional Activity"]]},{"a":"II","n":"Technical Subjects","tasks":[["A","Aeromedical Factors"],["B","Visual Scanning and Collision Avoidance"],["C","Principles of Flight"],["D","Regulations and Publications"],["E","National Airspace System"],["F","Logbook Entries and Certificate Endorsements"]]},{"a":"III","n":"Preflight Preparation","tasks":[["A","Certificates and Documents"],["B","Weather Information"],["C","Flight Planning"],["D","Performance and Limitations"],["E","Operation of Systems"]]},{"a":"IV","n":"Preflight Lesson on a Maneuver to be Performed in Flight","note":"Evaluator selects at least one maneuver from Areas VII–XI.","tasks":[["A","Maneuver Lesson"]]},{"a":"V","n":"Preflight Procedures","tasks":[["A","Launch Site Selection"],["B","Crew Briefing and Preparation"],["C","Layout and Assembly"],["D","Preflight Inspection"],["E","Inflation"],["F","Basket/Gondola Management"],["G","Pre-Launch Check"]]},{"a":"VI","n":"Airport Operations","tasks":[["A","Radio Communications"]]},{"a":"VII","n":"Launches and Landings","tasks":[["A","Normal Launch"],["B","Launch Over Obstacle"],["C","Approach to Landing"],["D","Steep Approach to Landing"],["E","Normal Landing"],["F","High-Wind Landing"]]},{"a":"VIII","n":"Performance Maneuvers","note":"Task F (High Altitude Flight) is LBG only — not tested for LBH.","tasks":[["A","Ascents"],["B","Altitude Control (Level Flight)"],["C","Descents"],["D","Rapid Ascent and Descent"],["E","Contour Flying (LBH)"],["G","Obstacle Avoidance (LBH)"],["H","Tethering (LBH)"],["I","Winter Flying"],["J","Mountain Flying"]]},{"a":"IX","n":"Navigation","tasks":[["A","Navigation"]]},{"a":"X","n":"Emergency Operations","tasks":[["A","Systems and Equipment Malfunctions"],["B","Emergency Equipment and Survival Gear"],["C","Water Landing"],["D","Thermal Flight"]]},{"a":"XI","n":"Postflight Procedures","tasks":[["A","Recovery"],["B","Deflation and Pack-Up"],["C","Refueling (LBH)"]]}];
const BANK=[{"id":"I-A-1","a":"I","t":"A","d":1,"ref":"FAA-H-8083-9B (AIH) ch. 3","q":"Before you teach anyone to fly a balloon: what is learning, and how will you know your student has learned something?","fu":"Give me the AIH definition, not just a feeling.","ans":[["B","Learning is a change in behavior as a result of experience. I know it happened when I can observe the change in the student's performance — they can do it correctly, consistently, without my help.","This is the AIH definition plus the observable-performance test examiners want."],["S","When it 'clicks' — they stop needing me to talk them through it and just do it right every time.","Accurate in spirit (observable change in performance) but missing the definition. A probing DPE will push for 'change in behavior as a result of experience.'"],["S","When they can explain the why, not just the what.","That shows the understanding level of learning — true but incomplete; learning is defined by behavior change, and skill learning must be demonstrated."],["W","When they can repeat back what I told them word for word.","That is only rote recall — the lowest level of learning. It proves memorization, not changed behavior."],["W","When they pass the FAA knowledge test.","A test score is one evaluation tool; passing it doesn't demonstrate skill learning in the basket."]]},{"id":"I-A-2","a":"I","t":"A","d":1,"ref":"FAA-H-8083-9B (AIH) ch. 3 — Levels of Learning","q":"Name the levels of learning. Which level should a commercial balloon applicant be operating at today?","fu":"Which level is the one the PTS keeps saying — 'correlative'?","ans":[["B","Rote, Understanding, Application, Correlation. A commercial applicant should be at correlation — associating what was learned with other concepts and applying it to new situations (e.g., linking a thermal forecast to launch timing and landing-site choice).","Matches AIH; ties to the PTS requirement that evaluators test correlative ability rather than rote enumeration."],["S","Memorize it, understand it, be able to do it, then tie it to everything else. I should be at the 'tie it together' level.","All four levels in plain language — a candidate can talk their way here. Strict DPE wants the term 'correlation.'"],["S","Rote, understanding, application — and commercial pilots need application.","Misses the top level. Application is required, but the commercial/instructor standard is correlation."],["W","Introduction, development, and conclusion.","Those are the parts of a lesson's organization, not levels of learning."],["W","Crawl, walk, run.","A coaching cliché, not the AIH framework."]]},{"id":"I-A-3","a":"I","t":"A","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 3 — Laws of Learning (pp. 3-11–3-13)","q":"Walk me through the principles of learning, and give me a balloon example of primacy.","fu":"Specifically — why does primacy matter for the preflight and fuel-system checks?","ans":[["B","Readiness, exercise, effect, primacy, intensity, recency (AIH 'laws of learning'). Primacy: what's learned first is learned best and hardest to unlearn — so the very first time a student does the fuel-system leak check and burner test, it must be done correctly and completely, or the shortcut becomes the habit.","Correct list and a correct, balloon-specific application."],["S","Readiness, exercise, effect, primacy, recency, intensity. Primacy means first impressions — teach it right the first time.","List is right; example is generic. Adequate for a lenient DPE; an understanding DPE will ask for a balloon example."],["S","Students learn best when they're ready, when they practice, when it feels good, and when it's recent or dramatic. Primacy is first-learned sticks.","Every principle described without names. Acceptable reasoning, needs vocabulary for a strict evaluator."],["W","Primacy means the most important item gets taught first in every lesson.","Confuses priority of content with the principle that first-learned is most durable."],["W","Recency means students remember the oldest material best.","Reversed: recency means things most recently learned are best remembered."]]},{"id":"I-A-4","a":"I","t":"A","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 3 — Forgetting and Retention","q":"Why do students forget, and what will you do as their instructor to improve retention?","ans":[["B","Theories of forgetting (AIH 9B): retrieval failure, fading, interference, and repression/suppression. Retention improves with praise, meaningful repetition, association with what they already know, favorable attitudes, and learning with all senses.","AIH lists exactly these causes and retention aids."],["S","They don't use it, newer info crowds it out, or it was stressful and they blocked it. I'd review often, connect it to things they already know, and keep it positive.","Describes fading, interference, and repression in plain words; misses retrieval failure."],["S","Mostly lack of practice — so I'd schedule frequent flights.","Fading from lack of use is only one of four theories; frequent flights help but the answer is incomplete."],["W","Forgetting is mostly an age thing; there isn't much an instructor can do.","Not an AIH theory, and instructors have specific retention tools."],["W","The key is to teach everything in one long session so it all sticks together.","Overload works against retention; AIH supports meaningful repetition and spaced review."]]},{"id":"I-A-5","a":"I","t":"A","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 3 — Transfer of Learning; Habit Formation","q":"Your new student is a 900-hour airplane pilot. How will transfer of learning help or hurt you?","ans":[["B","Positive transfer: aeronautical decision-making, airspace, weather, radio and regulations carry over. Negative transfer: airplane habits expect an immediate response to control input — the burner has a lag of many seconds, so they tend to over-burn and over-vent. I'll call out the differences explicitly and build correct balloon habit patterns early.","Correctly identifies positive and negative transfer with a real balloon example (burner lag)."],["S","Lots of their knowledge carries over, but they'll want instant response and the balloon doesn't do that.","Right idea, missing the AIH terms (positive/negative transfer, habit formation)."],["W","Transfer of learning is all positive — an experienced pilot will learn faster with no downside.","Ignores negative transfer, which is the main instructional hazard here."],["W","Airplane time can be credited toward the balloon practical test, so I'll skip the basics.","Balloon training and experience are set by 61.105/61.107(b)(8)/61.109(h) (private) and the PTS — you don't skip balloon fundamentals."]]},{"id":"I-B-1","a":"I","t":"B","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 2 — Human Needs (Maslow)","q":"On your student's first flight they're white-knuckled and won't take their eyes off the ground. What's going on in terms of human needs, and what do you do?","ans":[["B","Maslow's hierarchy: physiological, security (safety), belonging, esteem, cognitive/aesthetic, self-actualization. The student is stuck at the safety/security level; until that need is satisfied they can't learn higher material. Reduce anxiety — explain what the balloon is doing, keep the flight gentle, give simple tasks, build confidence before adding content.","Correct model, correct diagnosis, correct instructional response."],["S","They're scared, so they can't learn anything yet. Calm them down first, then teach.","Correct practice without naming Maslow or the level involved."],["W","Push through the lesson plan — exposure therapy will fix the fear.","Ignores the need hierarchy; a learner whose security need is unmet won't progress."],["W","That's a sign they lack self-actualization, so focus on long-term goals.","Wrong level — the unmet need is basic safety, far below self-actualization."]]},{"id":"I-B-2","a":"I","t":"B","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 2 — Defense Mechanisms (p. 2-10)","q":"After bouncing a landing your student says, 'That gust came out of nowhere — nobody could have landed that.' Winds were calm. What defense mechanism is that, and how does it affect decision-making?","ans":[["B","Rationalization — creating a plausible but untrue excuse to avoid an uncomfortable truth. It blocks learning and is dangerous for ADM because the pilot never identifies the real error. Acknowledge feelings, then review objective evidence (rates, timing) to redirect.","Correct identification and ties it to ADM as the PTS element requires."],["S","They're making excuses so they don't feel bad — it stops them from fixing the real problem.","Describes rationalization without the term."],["S","Denial — they won't admit it was their fault.","Close; denial refuses to accept reality at all, while rationalization invents a justification. Partial credit with discussion."],["W","Projection.","Projection pins your own faults on another person (e.g., blaming the examiner); an invented excuse about conditions is rationalization."],["W","That's a healthy coping mechanism, so let it go.","Unaddressed rationalization undermines learning and safety."]]},{"id":"I-B-3","a":"I","t":"B","d":1,"ref":"FAA-H-8083-9B (AIH) ch. 8 — Minimizing Learner Frustration (p. 8-4)","q":"What general rules will you follow to keep good human relations with your students?","ans":[["B","Keep students motivated; keep them informed; approach each as an individual; give credit when due; criticize constructively; be consistent; admit errors.","The AIH list."],["S","Treat everybody as an individual, keep them in the loop, praise good work, be fair and honest — including about my own mistakes.","Hits individuality, informing and giving credit; misses motivation, constructive criticism, consistency, admitting errors."],["W","Never admit a mistake — it undermines your authority.","AIH says the opposite: admit errors."],["W","Treat all students identically so nobody feels singled out.","Consistency is good, but AIH says to approach students as individuals."]]},{"id":"I-C-1","a":"I","t":"C","d":1,"ref":"FAA-H-8083-9B (AIH) ch. 5 (p. 5-1); ch. 7","q":"What are the steps of the teaching process?","ans":[["B","Preparation, presentation, application, and review and evaluation (AIH 9B ch. 5 calls the fourth step 'assessment').","Exact AIH steps."],["S","Get ready, show/tell them, have them do it, then check and review.","All four steps described informally."],["W","Explanation, demonstration, student performance with supervision, evaluation.","That's the demonstration-performance method — a teaching method, not the teaching process."],["W","Rote, understanding, application, correlation.","Those are levels of learning."]]},{"id":"I-D-1","a":"I","t":"D","d":1,"ref":"FAA-H-8083-9B (AIH) ch. 5 (p. 5-21); ch. 9 (pp. 9-5, 9-7)","q":"Teach me a hot inflation. Which teaching method fits best, and what are its phases?","ans":[["B","Demonstration-performance: explanation, demonstration, learner performance with instructor supervision, evaluation (AIH 9B ch. 5 lists supervision as its own phase — five phases; ch. 9 uses four). For flight skills the telling-and-doing technique fits — three steps: instructor tells, instructor does; learner tells, instructor does; learner tells, learner does — followed by evaluation.","Correct method for a skill and correct phases."],["S","I'd explain it, show them, let them try while I watch closely, then debrief.","Right sequence without the formal name."],["W","The lecture method — it covers the most material fastest.","Lecture suits knowledge, not motor skills like inflation."],["W","Guided discussion.","Useful for building understanding from existing knowledge, not for initial skill training."]]},{"id":"I-D-2","a":"I","t":"D","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 5 — Organization of a lesson","q":"How is a lesson organized, and what goes in the introduction?","ans":[["B","Introduction, development, conclusion. The introduction has three elements: attention, motivation, and an overview of what will be covered.","AIH lesson organization."],["S","Opening, body, wrap-up — and the opening should grab their attention and tell them why it matters and what's coming.","Correct elements without the terms."],["W","Preparation, presentation, application, review.","That's the teaching process."],["W","The introduction should cover the hardest material while attention is highest.","Introduction sets attention/motivation/overview; content goes in development."]]},{"id":"I-E-1","a":"I","t":"E","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 6 — Critique vs. Evaluation (pp. 6-2–6-3)","q":"What's the difference between a critique and an evaluation, and what makes a critique effective?","ans":[["B","A critique is constructive feedback to help the learner improve; an evaluation measures performance against a standard. An effective critique is objective, flexible, acceptable, comprehensive, constructive, organized, thoughtful, and specific.","AIH distinction and characteristics."],["S","Critique is coaching; evaluation is grading. A good critique is honest, specific, organized, and gives them something to work on.","Captures the distinction; names only 2 of the 8 characteristics."],["W","They're the same thing — critique is just the informal word for evaluation.","AIH treats them as different."],["W","A critique should focus mainly on what went wrong so they don't repeat it.","Critiques cover strengths and weaknesses constructively."]]},{"id":"I-E-2","a":"I","t":"E","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 6 — Oral questions (pp. 6-11–6-12)","q":"What types of oral questions should an instructor avoid?","ans":[["B","Puzzle, oversize, toss-up, bewilderment, trick, and irrelevant questions. Effective questions are clear, cover one idea, are specific, are challenging but answerable at the student's level, and have a definite answer.","AIH list."],["S","Trick questions, questions too big to answer, vague 'what do you think' questions, and stuff unrelated to the lesson.","Hits most types informally."],["W","Questions that require more than a yes/no answer.","Open questions are encouraged; it's the ill-formed ones to avoid."],["W","Any question the student might get wrong.","Questions should be challenging; a wrong answer is diagnostic."]]},{"id":"I-E-3","a":"I","t":"E","d":3,"ref":"FAA-H-8083-9B (AIH) ch. 6 — Written and performance tests; 14 CFR 61.14(a)(8), 61.43(a)(1)","q":"What characteristics make a good written test — and how is the PTS used as a performance test?","ans":[["B","Reliability, validity, usability, objectivity, comprehensiveness, and discrimination. The PTS/ACS is a performance test: it lists Areas, Tasks and objectives with standards, so both instructor and evaluator measure against the same published criteria.","AIH characteristics plus correct PTS use."],["S","It measures what it's supposed to, gives consistent results, is easy to use and grade fairly, and separates students who know it from those who don't. The PTS is the yardstick for the checkride.","Correct concepts without the terms."],["W","A good test is one most students pass on the first try.","Pass rate isn't a quality characteristic; discrimination matters."],["W","The PTS is just guidance; the examiner can test anything he wants however he wants.","FAA-S-8081-18A is incorporated by reference (61.14(a)(8)) and required by 61.43(a)(1); evaluators must cover required Tasks."]]},{"id":"I-F-1","a":"I","t":"F","d":1,"ref":"14 CFR 61.133(a)(2)(ii), (b)(2)","q":"Once I sign your temporary certificate, exactly what instructional privileges do you have — and what don't you have?","fu":"Read 61.133 to me from memory — what four things does (a)(2)(ii) let you do?","ans":[["B","Under 61.133(a)(2)(ii), in a balloon I may: give flight and ground training for a certificate or rating; give an endorsement for a pilot certificate with a balloon rating; endorse a logbook for solo privileges in a balloon; and give the training and endorsements for a flight review, operating privilege, or recency of experience. There is no separate flight instructor certificate for balloons. Because I'm testing in a hot air balloon, my certificate is limited to balloons with an airborne heater (61.133(b)(2)) — no gas balloon instruction. Nothing outside balloons.","Complete, accurate, and includes the class limitation."],["S","I can teach people to fly hot air balloons, sign them off for solo and their checkride, and do balloon flight reviews.","Covers the privileges informally; doesn't mention the airborne-heater limitation or ground training."],["S","Basically I'm a balloon CFI now — anything a CFI does, but only in balloons.","Practical meaning is close, but a strict examiner will note there is no CFI certificate, no expiration/renewal, and the hot-air-only limitation."],["W","I can instruct in hot air and gas balloons.","The airborne-heater limitation under 61.133(b)(2) prohibits gas balloon privileges until removed."],["W","I can give flight reviews to any private pilot, including airplane pilots, since flight reviews are generic.","Flight review training/endorsement privileges are 'in a balloon' only."],["W","I'll get a flight instructor certificate that expires in 24 months.","No CFI certificate is issued for LTA balloon; privileges ride on the commercial certificate."]]},{"id":"I-F-2","a":"I","t":"F","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 2 — Anxiety and abnormal reactions to stress (pp. 2-15–2-16)","q":"How do you recognize a student with abnormal stress reactions, and what's your responsibility?","ans":[["B","AIH 9B abnormal reactions to stress: inappropriate reactions (extreme over-cooperation, painstaking self-control, inappropriate laughter or singing, very rapid changes in emotion), marked mood changes between lessons, and severe anger directed at the instructor or others. If serious: refrain from instructing that learner, arrange an evaluation flight with another instructor not acquainted with the learner, confer afterward, and withhold solo endorsements and practical test recommendations if a serious deficiency is still suspected.","AIH signs plus the instructor's gatekeeping responsibility."],["S","If they act strangely — laughing at the wrong times, freezing up, being overly agreeable — I'd slow down, talk to them, and not sign them off until I'm confident.","Hits signs and response; missing the formal list."],["W","Stress is normal in training, so I wouldn't change anything.","Normal stress is fine; abnormal reactions require action."],["W","Diagnose the condition and report it to the FSDO immediately.","Instructors aren't qualified to diagnose; the AIH emphasizes recognizing, managing, and declining endorsements when warranted."]]},{"id":"I-F-3","a":"I","t":"F","d":2,"ref":"14 CFR 61.56; 61.133(a)(2)(ii)(D); AC 61-98","q":"A private balloon pilot asks you for a flight review. Can you give it, and what does it require?","ans":[["B","Yes — 61.133(a)(2)(ii)(D) lets a commercial balloon pilot give flight review training and the endorsement in a balloon. 61.56 requires a minimum of 1 hour of ground training (including a review of the general operating and flight rules of Part 91) and 1 hour of flight training, completed within the preceding 24 calendar months, and a logbook endorsement for satisfactory completion. Maneuvers are at the instructor's discretion (AC 61-98 guidance).","Accurate and complete."],["S","Yes, it's an hour on the ground and an hour of flying every two years, and I sign their logbook.","Correct substance; strict DPE will want 24 calendar months, Part 91 review content, and the regulatory basis."],["W","No — only a CFI with a flight instructor certificate can give flight reviews.","Commercial balloon pilots have this privilege in balloons."],["W","Yes, and the flight portion must include a full mock practical test.","61.56 does not require a practical test; content is at instructor discretion."]]},{"id":"I-F-4","a":"I","t":"F","d":2,"ref":"14 CFR 61.83, 61.87; AC 61-65","q":"Your student wants to solo. What has to happen before you let them go?","ans":[["B","They must hold a student pilot certificate (minimum age 14 for a balloon-limited student certificate, 61.83). Before solo (61.87): pass a presolo aeronautical knowledge test I administer and grade, with the missed items reviewed; receive and log the required presolo flight training in balloon maneuvers; and I must endorse the logbook for presolo knowledge, presolo flight training, and solo flight in the make/model within the preceding 90 days. Since 2016, endorsements go in the logbook, not on the student certificate. I remain responsible for supervision and surveillance of that solo.","Complete and current — including the post-2016 change examiners like to probe."],["S","They need their student certificate, the presolo written that I give, the required training, and my logbook endorsement good for 90 days.","Hits the core; omits age and supervision responsibility."],["W","I endorse the back of their student pilot certificate.","Outdated: since the 2016 rule, solo endorsements are made in the logbook."],["W","They need a third-class medical first.","Balloon student pilots are not required to hold a medical certificate (61.23)."]]},{"id":"I-F-5","a":"I","t":"F","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 8 — Professionalism","q":"What characteristics make a professional balloon instructor?","ans":[["B","Sincerity, acceptance of the learner, appropriate personal appearance and habits, demeanor, exemplary safety practices and accident prevention, proper language, ongoing self-improvement — plus an ethical commitment to standards over convenience (e.g., not caving to passenger or schedule pressure in front of students).","AIH professionalism traits applied."],["S","Be honest, patient, look and act professional, be safe, keep learning.","Correct in plain words."],["W","Being the most experienced pilot in the room so students defer to you.","Experience alone isn't the AIH definition and deference can suppress learning."],["W","Keeping students dependent so they come back for more lessons.","Directly contrary to professional ethics."]]},{"id":"I-G-1","a":"I","t":"G","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 7 — Lesson plans (pp. 7-4, 7-9)","q":"What items should a lesson plan contain?","ans":[["B","AIH 9B: a lesson includes an objective, content, and completion standards; typical lesson-plan items also include schedule, equipment, instructor's actions and learner's actions. Characteristics of a good lesson plan: unity, content, scope, practicality, flexibility, relation to the course of training, and instructional steps.","AIH lesson plan items."],["S","What we're doing and why, the steps, how long, what we need, who does what, and how we know they've got it.","Every item in plain language."],["W","Just the maneuver name and the PTS tolerance.","Missing most required items."],["W","A lesson plan is only needed for ground lessons.","Lesson plans apply to flight lessons too, and the PTS Area IV expects one."]]},{"id":"I-G-2","a":"I","t":"G","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 7 — Course of training, syllabus, flexibility","q":"How do you design a training course, and how does your syllabus flex for different students?","ans":[["B","Start from the objective (certificate standards: 61.105/61.107 or 61.125/61.127, the PTS), break it into building blocks, sequence in a syllabus of ground and flight lessons with completion standards. A syllabus is a guide, not a straitjacket — adjust order and repetition for experience (e.g., an airplane pilot may move faster through airspace/weather) and for conditions (weather may force swapping lessons).","Correct process and flexibility."],["S","Build-up from simple to complex, based on what the checkride requires, and adjust to the student and the weather.","Right idea in plain terms."],["W","Use the same fixed sequence for every student; deviating creates gaps.","AIH requires flexibility."],["W","Teach whatever the conditions allow that morning — balloons can't follow a syllabus.","Weather drives flexibility, but a structured syllabus is still required."]]},{"id":"II-A-1","a":"II","t":"A","d":1,"ref":"PHAK ch. 17; AIM 8-1-2","q":"Explain hypoxia — the types, symptoms, and corrective action. Does it matter to a hot air balloonist?","ans":[["B","Insufficient oxygen to body tissues. Types: hypoxic (reduced partial pressure at altitude), hypemic (blood can't carry oxygen — e.g., carbon monoxide, blood loss), stagnant (poor circulation), histotoxic (cells can't use it — alcohol, drugs). Symptoms: impaired judgment, euphoria, headache, tunnel vision, cyanosis. Correction: descend / supplemental oxygen; ventilate if CO suspected. Relevant to balloonists on high flights, smokers, and anyone with incomplete combustion exposure.","Complete AIM/PHAK answer applied to ballooning."],["S","Not enough oxygen — usually from altitude, but also CO or alcohol. You get stupid and happy. Descend.","Covers causes and correction; missing names of the types."],["W","Hypoxia only happens above 12,500 feet, so it doesn't apply to balloons.","Hypemic/histotoxic hypoxia occur at any altitude, and night vision is affected well below 12,500."],["W","Breathe faster and deeper to correct it.","That risks hyperventilation; the correction is oxygen/descent."]]},{"id":"II-A-2","a":"II","t":"A","d":1,"ref":"PHAK ch. 17; AIM 8-1-3","q":"A passenger gets lightheaded and tingly during an anxious approach. What is it and what do you do?","ans":[["B","Likely hyperventilation — excessive breathing lowers CO₂. Symptoms: dizziness, tingling, muscle spasms, visual impairment. Correction: slow the breathing rate — breathe normally, talk aloud, or breathe into a bag; reassure them.","Correct identification and treatment."],["S","They're breathing too fast from nerves — calm them down and get them to slow their breathing.","Correct in plain words."],["S","Could be hypoxia or hyperventilation — at low altitude I'd treat it as hyperventilation and slow their breathing.","Reasonable differential reasoning; fine at low altitude."],["W","Give them supplemental oxygen and have them breathe deeply.","Deep breathing worsens hyperventilation."]]},{"id":"II-A-3","a":"II","t":"A","d":1,"c":1,"ref":"14 CFR 91.17","q":"What does 91.17 say about alcohol and drugs — and what about a passenger who shows up drunk for a ride?","ans":[["B","No crewmember within 8 hours of consuming alcohol, while under the influence, with a 0.04 or greater alcohol concentration, or while using any drug that affects faculties contrary to safety. Except in an emergency, the PIC may not allow a person who appears intoxicated (or under the influence of drugs, unless a medical patient under proper care) to be carried in the aircraft.","Full 91.17 including the passenger provision."],["S","Eight hours bottle to throttle, under 0.04, not impaired — and I wouldn't fly a drunk passenger.","Correct; strict DPE wants it tied to the regulation and the 'under the influence' prong."],["W","Eight hours is all that matters; after that I'm legal regardless.","Under the influence or 0.04+ still prohibits flight even after 8 hours."],["W","Passenger sobriety isn't regulated — it's my company policy call.","91.17(b) bars carrying anyone who appears intoxicated, except in an emergency."]]},{"id":"II-A-4","a":"II","t":"A","d":2,"ref":"AIM 8-1-2(d); PHAK ch. 17","q":"Your morning ride passengers went scuba diving yesterday afternoon. Concern?","ans":[["B","Evolved gas (decompression sickness). AIM: wait at least 12 hours after a dive not requiring a controlled ascent and at least 24 hours after one that did, before flight up to 8,000 ft MSL; above 8,000 ft, wait at least 24 hours after any SCUBA dive. Ask how and when they dove; if inside the window, they shouldn't fly.","Correct AIM guidance and decision."],["S","Nitrogen can bubble out at altitude — I'd want them to wait at least a day.","Correct concept; conservative but missing the 12/24 distinction."],["W","Balloons fly low and slow, so diving doesn't matter.","Even modest altitude changes can trigger DCS after diving."],["W","They should wait 8 hours, same as alcohol.","No such rule; AIM uses 12/24 hours."]]},{"id":"II-A-5","a":"II","t":"A","d":2,"ref":"PHAK ch. 17; IMSAFE","q":"Ride operations launch at sunrise. Talk to me about fatigue, sinus/ear issues, and how you'd self-assess.","ans":[["B","Fatigue (acute and chronic) degrades judgment and reaction — early launches, chasing, and late recoveries compound it; correction is adequate rest and declining to fly. Ear/sinus: blocked eustachian tubes cause pain on descent; don't fly congested; Valsalva can help. Use IMSAFE (Illness, Medication, Stress, Alcohol, Fatigue, Emotion) before every flight.","Covers PTS aeromedical elements with an ADM tool."],["S","I make sure I'm rested, not sick, and run IMSAFE.","Right tool, thin on effects and corrections."],["W","Fatigue is managed with caffeine; it isn't a regulatory issue for Part 91 balloon pilots.","Stimulants mask fatigue; 91.3/91.13 still hold the PIC responsible for safe operation."],["W","Ear problems happen on ascent, so descend quickly to relieve them.","Problems are worst on descent; rapid descents aggravate them."]]},{"id":"II-B-1","a":"II","t":"B","d":2,"c":1,"ref":"14 CFR 91.113; AC 90-48E; BFH","q":"Who has right-of-way between a balloon and an airplane — and between two balloons? How does that change your scanning?","ans":[["B","Under 91.113, a balloon has right-of-way over all other categories (aircraft in distress have priority over all). Right-of-way never relieves the duty to see and avoid. Between balloons the regulation is silent; the accepted practice (BFH, event rules) is that the lower balloon has the right-of-way because the higher pilot can see it and the lower pilot can't see above the envelope — so the ascending/descending pilot is responsible for clearing, especially above. I scan in sectors (~10°, ~1 second each), look above before ascending and below before descending.","Correct regulation, correct custom, ties to controlling ascents/descents (PTS element)."],["S","Balloons have right-of-way over everybody, but I still have to see and avoid. Between balloons, lower usually has the right-of-way because we can't see above us.","Accurate; misses scan technique details."],["W","Airplanes have right-of-way because they're faster.","Opposite of 91.113."],["W","Between balloons, the higher balloon has the right-of-way since it can't descend quickly.","Contrary to accepted practice; the higher pilot has the visibility advantage."]]},{"id":"II-B-2","a":"II","t":"B","d":2,"ref":"AC 90-48E; BFH","q":"When is collision risk greatest for a balloon, and how do your physical or mental condition affect what you see?","ans":[["B","Greatest risk: mass ascensions and festivals (many balloons, varied rates), near airports and approach paths, ascents/descents into another balloon's blind spot, low altitude with wires/towers, and low sun angles. Fatigue, hypoxia, stress, and empty-field myopia degrade scanning — so condition yourself, use 'time sharing' between instruments and outside, and keep vertical rates controlled.","Covers PTS elements 1–5."],["S","At festivals and near airports, and when you're tired you don't see as well.","Partial — lacks blind-spot and vertical-rate discussion."],["W","Collision risk is low for balloons because airplanes are required to avoid us.","Right-of-way doesn't prevent collisions; see-and-avoid applies to all."],["W","At cruising altitude far from airports.","Risk concentrates in congested areas and near the ground."]]},{"id":"II-C-1","a":"II","t":"C","d":1,"ref":"BFH ch. 2; PHAK","q":"Explain to a student why a hot air balloon flies.","ans":[["B","Archimedes' principle: an object immersed in a fluid is buoyed up by a force equal to the weight of the fluid displaced. Charles's law: at constant pressure, heated air expands and becomes less dense. The envelope contains a fixed volume of hot, less-dense air; the difference between the weight of the outside air displaced and the weight of the hot air inside is lift. More temperature difference = more lift.","Physical laws correctly applied."],["S","Hot air is lighter than cold air, so the balloon floats like a cork in water.","Correct intuition; a strict DPE wants the laws named."],["W","The burner pushes the balloon up with thrust, like a rocket.","Burner heat creates buoyancy, not thrust."],["W","Hot air has lower pressure inside the envelope, which sucks the balloon upward.","Inside pressure is essentially ambient; density, not pressure differential, provides lift."]]},{"id":"II-C-2","a":"II","t":"C","d":2,"ref":"BFH; Balloon Flight Manual load chart","q":"Same balloon, same load: 30°F morning vs. 90°F afternoon at a high-elevation site. What changes?","ans":[["B","Lift depends on the temperature difference between envelope air and ambient air, and on air density. On a hot day and/or at high density altitude, ambient air is less dense, so you need a higher envelope temperature for the same load — getting closer to max-continuous and never-exceed temps, burning more fuel, and leaving less margin. I'd reduce load per the flight manual load chart.","Correct physics and operational consequence."],["S","Hot and high is worse — less lift, more fuel, so carry less.","Correct conclusion without the mechanism."],["W","Hot days are better since the air inside is already warm.","Ambient heat reduces the temperature differential and density — worse performance."],["W","Temperature doesn't matter; only elevation affects lift.","Both temperature and altitude change density."]]},{"id":"II-C-3","a":"II","t":"C","d":2,"c":1,"ref":"BFH; PTS II.C.3, VII.A, VII.B","q":"What is false lift, when do you encounter it, and why is it dangerous?","ans":[["B","Aerodynamic lift from wind flowing over the top of the envelope (and from envelope deformation), similar to an airfoil — not buoyancy. It occurs on launch in wind (balloon stationary, air moving over it), when penetrating a wind shear layer, and approaching landing into different surface winds. When the balloon accelerates to wind speed the false lift disappears and the balloon can sink — into obstacles right after launch. Defense: launch with true positive buoyancy (enough heat), not wind-assisted lift.","Complete and safety-focused."],["S","Wind over the top makes the balloon think it's lighter than it is; when you start moving with the wind, it goes away and you come back down.","Correct mechanism and consequence in plain words."],["W","False lift is when the altimeter shows a climb that isn't happening.","Instrument error isn't false lift."],["W","It's thermal lift from the sun warming the envelope.","Solar heating is a different (real buoyancy) effect."]]},{"id":"II-D-1","a":"II","t":"D","d":2,"c":1,"ref":"49 CFR 830.2, 830.5, 830.10, 830.15","q":"A passenger breaks an ankle on a hard landing. What are your NTSB obligations?","ans":[["B","A fracture (other than simple fractures of fingers, toes, or nose) is a serious injury under 830.2, making this an accident. Notify the NTSB immediately (830.5); preserve wreckage and records (830.10) except to protect persons or prevent further damage; file NTSB Form 6120.1 within 10 days (830.15). Other serious injuries include hospitalization >48 hours commencing within 7 days, and second- or third-degree burns of any extent or any burns affecting more than 5% of the body — directly relevant to burner incidents. In-flight fire is also an immediate-notification event.","Correct definitions, timing, and balloon relevance."],["S","It's an accident because of the serious injury — call the NTSB right away and file a report within 10 days.","Correct actions; missing definition details and preservation."],["W","Only fatalities and substantial damage to the aircraft count as accidents.","Serious injury alone makes it an accident."],["W","Call the FSDO within 30 days.","NTSB, immediately, and the written report is due in 10 days."]]},{"id":"II-D-2","a":"II","t":"D","d":1,"ref":"14 CFR parts 1, 61, 91; AC system; AC 91-71","q":"Which regulations and publications govern you as a commercial balloon pilot and instructor, and how do you keep them current?","ans":[["B","14 CFR Part 1 (definitions), 61 (certification), 91 (operating rules), 43 (maintenance), 49 CFR 830 (NTSB); AIM, Chart Supplements, NOTAMs; advisory circulars (e.g., AC 91-71 Operation of Hot Air Balloons with Airborne Heaters, AC 61-65 endorsements); the Balloon Flying Handbook (FAA-H-8083-11); the PTS; and my balloon's flight manual. Current versions are free on the eCFR and faa.gov; ACs are advisory unless incorporated by reference.","Complete and current-sourced."],["S","Parts 61 and 91, the NTSB rules, the AIM, the balloon handbook and flight manual — I check the FAA website for updates.","Core set; missing AC detail."],["W","Advisory circulars are regulatory and must be followed exactly.","ACs are guidance unless incorporated into a regulation."],["W","Balloon rides are governed by Part 135.","Hot air balloon sightseeing flights are excepted from Part 119 (119.1(e)(5)); they're conducted under Parts 91 and 61."]]},{"id":"II-E-1","a":"II","t":"E","d":2,"c":1,"ref":"14 CFR 91.130(c),(d); 91.215(b)(1),(3),(4),(d); 91.225(d),(e),(g)","q":"Your planned track drifts toward the Indianapolis Class C and you have no transponder or ADS-B Out. Legal?","ans":[["B","Inside Class C, and above its ceiling within its lateral limits up to 10,000 MSL, a transponder with altitude reporting and ADS-B Out are required for all aircraft, balloons included (91.215(b)(1),(4); 91.225(d)). The balloon/glider exception (91.215(b)(3), 91.225(e)) only covers operations within the Mode C veil around Class B primary airports while outside Class A/B/C and below their ceilings. ATC can authorize a deviation (91.215(d), 91.225(g)) — for an aircraft with no transponder, request it at least one hour before. Class C also requires two-way communication before entry (91.130(c)). Plan the flight to stay out — balloons can't turn away.","Correct regulatory exception and its limits."],["S","Balloons don't need a transponder generally, but I can't go into Class B or C without one — I'd plan to stay out.","Correct operational answer, missing the cite and the ceiling detail."],["W","Balloons are exempt from transponder rules everywhere, so I can enter Class C after calling approach.","There is no balloon exception inside or above Class C (91.215(b)(1),(4)); the (b)(3) exception applies only in the Mode C veil outside B/C."],["W","As long as I stay under 3,000 feet, the Class C doesn't apply.","Class C shelves begin at specified altitudes; the inner core goes to the surface."]]},{"id":"II-E-2","a":"II","t":"E","d":2,"ref":"14 CFR 91.155","q":"What VFR weather minimums apply where you typically fly?","ans":[["B","Class G, at or below 1,200 ft AGL, day: 1 SM visibility, clear of clouds. Class E below 10,000 MSL: 3 SM; 500 ft below, 1,000 ft above, 2,000 ft horizontal from clouds. Class G above 1,200 AGL (below 10,000 MSL) day: 1 SM, 500/1,000/2,000. Within the surface area of Class B, C, D, or E airspace: no VFR beneath a ceiling lower than 1,000 ft (91.155(c)), and 3 SM ground visibility to take off, land, or enter the traffic pattern (91.155(d)) — unless operating under special VFR.","Accurate tables relevant to balloon operations."],["S","Class G low: one mile and clear of clouds. Class E: three miles, 500 below, 1,000 above, 2,000 horizontal.","Core numbers right; misses surface-area ceilings."],["W","Balloons are VFR-only so minimums don't apply as long as I can see the ground.","91.155 applies to all VFR flight."],["W","Class E: 1 mile and clear of clouds.","That's Class G low-altitude day."]]},{"id":"II-E-3","a":"II","t":"E","d":2,"ref":"14 CFR 91.137–91.145, 99.7; FDC NOTAM 4/3621; AIM 3-4, 3-5; AC 91-36D","q":"What special use airspace and TFRs should a balloon pilot worry about?","ans":[["B","Prohibited and restricted areas, MOAs, warning/alert areas, controlled firing areas, national security areas, and TFRs (disaster, VIP, space ops). The standing sporting-event TFR (FDC NOTAM 4/3621 under 14 CFR 99.7): 3 NM radius, surface to 3,000 ft AGL, from 1 hour before the scheduled time until 1 hour after the end of qualifying MLB, NFL and NCAA Division I football games at stadiums seating 30,000 or more, and major auto races. Also noise-sensitive areas such as wildlife refuges and parks (AC 91-36D: make every effort to fly not less than 2,000 ft AGL) and livestock sensitivities. Because I can't steer, I check NOTAMs and TFRs for my whole possible trajectory.","Complete with a balloon-specific planning point."],["S","Restricted/prohibited areas and TFRs — especially stadiums — and I check NOTAMs before launch.","Correct core; missing detail."],["W","TFRs don't apply to balloons since they're not powered aircraft.","TFRs apply to all aircraft unless the NOTAM excepts them."],["W","MOAs prohibit civilian aircraft.","MOAs allow VFR transit with caution; they don't prohibit civil aircraft."]]},{"id":"II-F-1","a":"II","t":"F","d":2,"ref":"14 CFR 61.39(a)(6); 61.129(h)(4)(ii)(A); AC 61-65","q":"You're recommending a student for their commercial balloon practical test. What must your endorsements and logbook show?","ans":[["B","Under 61.39(a)(6): training received and logged within the 2 calendar months preceding the month of application in preparation for the test, and an endorsement certifying the applicant is prepared for the practical test; plus an endorsement that the deficient knowledge-test items were reviewed. For an airborne-heater commercial applicant, 61.129(h) requires at least 35 hours as a pilot including 20 in balloons, 10 balloon flights, 2 as PIC, and 10 hours of training (≥10 training flights) including two 1-hour training flights within the preceding 2 calendar months, two solo flights, and one controlled ascent to 3,000 ft above the launch site. Sign the 8710-1 instructor recommendation.","Complete and verified against current 61.129(h)."],["S","They need the training within two months of the test, my sign-off that they're ready, the knowledge test review, and they need to meet the 61.129 hours.","Right structure, missing the numbers."],["W","The recommendation endorsement is valid for 90 days.","61.39 uses training within the preceding 2 calendar months, not a 90-day window."],["W","The ascent requirement is 2,000 feet above launch.","For the commercial airborne-heater applicant it's 3,000 ft above the launch site (61.129(h)(4)(ii)(C))."]]},{"id":"II-F-2","a":"II","t":"F","d":2,"ref":"14 CFR 61.51(h); 61.189 (CFI recordkeeping, by analogy); AC 61-65","q":"How do you log instruction you give, and what records should you keep?","ans":[["B","The student logs training time; I sign each entry certifying the type and amount of training, with my signature, certificate number (and type). AC 61-65 provides endorsement wording. Keep my own record of students endorsed for solo and for practical/knowledge tests and results — 61.189 requires CFIs to retain these for 3 years, which is the professional standard to follow even though balloon instructors hold no CFI certificate.","Correct entries and sound record-keeping practice."],["S","I sign their logbook with my cert number and what we did, and keep my own notes on who I signed off.","Correct in plain words."],["W","Balloon training doesn't need to be logged since it isn't instrument or cross-country time.","61.51 requires logged training to meet aeronautical experience."],["W","The student signs my logbook to prove I instructed.","Instructor signs the learner's record."]]},{"id":"III-A-1","a":"III","t":"A","d":1,"ref":"14 CFR 61.123; 61.129(h)","q":"What are the eligibility and aeronautical-experience requirements for the commercial certificate you're seeking today?","ans":[["B","61.123: at least 18, read/speak/write/understand English, hold at least a private pilot certificate, logbook endorsements for the knowledge test and practical test, pass the knowledge test and practical test. 61.129(h) for a balloon with an airborne heater: 35 hours as a pilot, including 20 hours in balloons, 10 flights in balloons, 2 flights as PIC, and 10 hours of flight training with at least 10 training flights — including two 1-hour training flights within the preceding 2 calendar months, two solo flights, and one controlled ascent to 3,000 ft above the launch site.","Complete and current."],["S","18 years old, private certificate, written and checkride, 35 total hours with 20 in balloons and 10 hours of training with a high climb.","Mostly right; incomplete detail."],["W","35 hours of PIC time in balloons.","35 is total flight time as a pilot; only 2 PIC flights are specified."],["W","You must be 21 to fly commercially.","61.123 requires 18."]]},{"id":"III-A-2","a":"III","t":"A","d":1,"c":1,"ref":"14 CFR 61.3(c), 61.23 (as amended, Medical Certification Standards for Commercial Balloon Operations, final rule 2022; medical provisions effective May 22, 2023)","q":"What medical certificate will you need — for rides, and for instructing?","fu":"Has that always been the rule? What changed and when?","ans":[["B","To exercise commercial balloon privileges for compensation or hire — carrying passengers for hire or other paid operations — I need a valid second-class medical certificate. Flight training in a balloon is excepted: I can instruct (even for pay) without a medical. Private balloon flying requires none. This changed with the FAA's 2022 final rule implementing section 318 of the 2018 FAA Reauthorization Act; the medical requirement took effect May 22, 2023.","Current rule with the instruction exception."],["S","Second class for paid rides; I don't think instructing needs one.","Correct; a strict DPE wants the regulatory basis and confidence."],["W","Balloon pilots don't need medical certificates.","Outdated since May 2023 for compensation or hire operations."],["W","A second-class medical is needed for any flight, including instruction and private flights.","Flight training in a balloon and private balloon flights are excepted."],["W","A first-class medical, since it's a commercial operation.","Second-class is the requirement for commercial balloon operations."]]},{"id":"III-A-3","a":"III","t":"A","d":2,"ref":"14 CFR 61.23(d)","q":"Your second-class medical is 13 calendar months old. What can and can't you do today?","ans":[["B","A second-class medical is valid for commercial privileges for 12 calendar months, so I can no longer fly balloon passengers for hire. It still serves for privileges requiring a third-class medical, and private balloon flying needs none anyway. I can still give flight training in a balloon, which is excepted from the medical requirement.","Correct duration and fallback privileges."],["S","It's expired for commercial ride work, but I can still fly privately and instruct.","Correct conclusions."],["W","Second-class medicals last 24 or 60 months depending on age, so I'm fine.","Those durations apply to third-class privileges; commercial use is 12 calendar months."],["W","An expired medical grounds me from all flying.","Private balloon flight and balloon flight training don't require one."]]},{"id":"III-A-4","a":"III","t":"A","d":1,"ref":"14 CFR 91.9, 91.203; Part 47","q":"What documents must be in or with the balloon?","ans":[["B","Airworthiness certificate (91.203 — carried and displayed legibly; baskets have no 'cockpit entrance,' so a basket holder is common practice), registration certificate (valid 7 years under current Part 47), and the Balloon Flight Manual or placards (31.81; 91.9(b)(2)). Radio station license only if operating internationally. Plus my pilot certificate, medical when required, and photo ID on my person.","Complete; includes 7-year registration."],["S","Airworthiness, registration, flight manual — and my certificates.","Core set without regulatory references."],["W","Weight and balance data is required just like an airplane.","Balloons use the flight manual load chart; no airplane-style W&B document."],["W","Registration is good for 3 years.","Registration is now valid 7 years."]]},{"id":"III-A-5","a":"III","t":"A","d":2,"c":1,"ref":"14 CFR 91.409(a),(b); 91.403; 91.417","q":"What inspections are required for a balloon used for rides and instruction?","ans":[["B","Annual inspection within the preceding 12 calendar months (91.409(a)). If carrying any person (other than crew) for hire, or giving flight instruction for hire in a balloon I provide, it also needs a 100-hour or annual within the preceding 100 hours of time in service (91.409(b)); the 100-hour may be exceeded by up to 10 hours only to reach a place where it can be done. ADs must be complied with (91.403/39). Records per 91.417. Also follow manufacturer-required items (e.g., fabric strength tests) as the flight manual/ICA require.","Complete including the 'for hire' trigger."],["S","Annual, plus a 100-hour because I'm doing rides for hire.","Correct core; strict DPE wants the instruction trigger and ADs."],["W","Only an annual — 100-hour inspections are for airplanes.","91.409(b) applies to any aircraft carrying persons for hire."],["W","A 100-hour is required for all instruction, even in the student's own balloon.","Only when instruction is for hire in an aircraft the instructor provides."]]},{"id":"III-A-6","a":"III","t":"A","d":3,"ref":"14 CFR Part 43 Appendix A(c); 43.3(g); 43.9","q":"Can you, as a certificated pilot-owner, do any maintenance on the balloon?","ans":[["B","Yes — preventive maintenance under 43.3(g) on a balloon I own or operate (not used under 121/129/135), limited to Part 43 Appendix A(c) items. Balloon items: small envelope fabric repairs per the manufacturer's instructions not requiring load-tape repair or replacement (c)(7); interchanging baskets and burners designated interchangeable in the type certificate data and designed for quick removal (c)(27); cleaning burner pilot and main nozzles (c)(25); refinishing basket decorative coatings and repairing basket interior furnishings (c)(9),(11). Each recorded per 43.9: description, date, signature, certificate number and kind of certificate. Fuel tanks are not on the list.","Correct authority and logging."],["S","I can do minor preventive maintenance listed in Part 43 if I log it — like small fabric patches.","Correct in principle."],["W","Anything as long as I'm the owner.","Only Appendix A preventive maintenance; other work needs a mechanic/repair station."],["W","Pilots can do preventive maintenance but don't need to log it.","43.9 requires the maintenance record entry."]]},{"id":"III-A-7","a":"III","t":"A","d":2,"ref":"14 CFR 61.133(b)(2)","q":"What limitation will be on your certificate, and how do you remove it?","ans":[["B","Testing in a balloon with an airborne heater, my certificate will be limited to balloons with an airborne heater (61.133(b)(2)(i)). To remove it, I obtain the required aeronautical experience in a gas balloon and receive a logbook endorsement from an authorized instructor attesting to that experience and my ability to satisfactorily operate a gas balloon (61.133(b)(2)(ii)).","Exact regulatory process."],["S","Hot air balloons only. I'd need training in a gas balloon and an instructor sign-off.","Correct; misses the 'aeronautical experience' framing."],["W","No limitation — a balloon class rating covers gas and hot air.","61.133(b)(2) imposes the limitation."],["W","I'd need another practical test in a gas balloon.","Removal is by experience plus endorsement, not a new practical test."]]},{"id":"III-B-1","a":"III","t":"B","d":1,"ref":"FAA-H-8083-28; AIM ch. 7","q":"Where do you get your weather, and what products do you use?","ans":[["B","Flight service (1800wxbrief), aviationweather.gov: METARs/TAFs, winds and temperatures aloft (FB), Graphical Forecasts for Aviation, G-AIRMETs (Sierra, Tango, Zulu), SIGMETs and convective SIGMETs, PIREPs, radar/satellite; plus surface analysis/prog charts. Locally: pibals and observation at the launch site. A standard briefing creates a record, and real-time weather is required in the final flight plan per the PTS.","Complete and correctly named products."],["S","Flight service, aviation weather website, METARs and TAFs, winds aloft — and I throw a pibal.","Core sources; missing advisories."],["W","Weather apps on my phone are sufficient; aviation products are for airplanes.","Consumer apps miss aviation hazards and advisories."],["W","Area forecasts (FA) for all of my enroute planning.","The textual FA for the CONUS was replaced by the GFA."]]},{"id":"III-B-2","a":"III","t":"B","d":2,"ref":"FAA-H-8083-28 — Winds and Temperatures Aloft (FB)","q":"How do you read and use the winds aloft forecast for a balloon flight?","ans":[["B","FB gives direction (true, the direction FROM which the wind blows), speed in knots, and temperature for levels in feet MSL. No winds are forecast for levels within 1,500 ft of station elevation, and no temperatures for the 3,000-ft level or any level within 2,500 ft of the station. My ground track is roughly the reciprocal of the wind direction at my altitude. I interpolate between levels and verify with pibals or observed drift.","Correct decoding and application."],["S","It tells me which way the wind is coming from and how fast at each altitude; I'll travel the opposite direction.","Correct core; misses MSL and the 1,500-ft rule."],["W","The direction is where the wind is blowing to, so that's my track.","FB direction is the FROM direction."],["W","The altitudes are AGL.","FB levels are MSL."]]},{"id":"III-B-3","a":"III","t":"B","d":2,"c":1,"ref":"FAA-H-8083-28; BFH; AIM 7-1","q":"There's a thunderstorm 25 miles away. Any problem with launching?","ans":[["B","Yes. Thunderstorm outflow/gust fronts can extend tens of miles from the cell with sudden wind shifts and strong gusts well before the storm arrives; balloons can't outrun or out-steer them. Combined with lightning, hail, and downdrafts, I would not launch with convection in the area or forecast during the flight window, and I'd land early if it develops.","Correct hazard recognition and go/no-go."],["S","Storms can push gusty winds far out ahead of them, so I'd hold off.","Correct decision; less detail."],["W","25 miles is far enough; the 20-mile rule is for airplanes.","Gust fronts can reach well beyond that and balloons are uniquely vulnerable."],["W","Launch quickly and land before it arrives.","Unpredictable outflow makes this a classic accident setup."]]},{"id":"III-B-4","a":"III","t":"B","d":3,"c":1,"s":1,"ref":"PTS III.B.6; ADM (FAA-H-8083-2)","q":"Scenario: six paying passengers, launch 0645. Surface winds forecast 4 kt rising to 12 kt by 0900, G-AIRMET Tango for the afternoon. The company owner says, 'We need this flight.' Talk me through your decision.","fu":"What specifically would make you cancel?","ans":[["B","I'd assess with PAVE/IMSAFE: winds rising toward or beyond my and the manufacturer's limits during the landing window are the controlling risk. I could shorten the flight to land before winds build — only if suitable landing sites are available on the short trajectory and my fuel/landing plan works with a firm 'land by' time. If the trend or pibals show an early increase, or no good landing options exist, I cancel. The PIC decision is mine (91.3); the owner's push is an External pressure (the E in PAVE) — and simply deferring to it would be resignation. I'd tell the owner and passengers before launch, not in the air.","Correlative ADM using real factors and PIC authority."],["S","I'd fly a short flight and land early — if the winds look worse than forecast, I'd cancel.","Reasonable plan but doesn't address landing-site availability or pressure management."],["W","We'll launch and see; I can always land if it picks up.","Landing in rising winds is the hazard — this defers the decision to the worst point."],["W","The owner makes the business call; my job is to fly it.","91.3 makes the PIC the final authority."]]},{"id":"III-C-1","a":"III","t":"C","d":2,"ref":"PTS III.C; BFH","q":"Present your planned flight of maximum duration for today. How did you build it?","ans":[["B","Real-time winds aloft and pibals to build a flight profile and plotted track by altitude; current sectional and local road/street maps; airspace, towers/obstructions, terrain and power lines identified; suitable landing areas along the track and a planned final landing area; fuel duration and reserves for the load and temperature; frequencies (CTAF/approach if radio equipped); NOTAMs/TFRs and Chart Supplement info.","Matches the PTS elements."],["S","I looked at winds at a few altitudes, drew the likely tracks on the chart and a road map, and picked landing fields and checked for towers and airspace.","Good practical answer; strict DPE wants fuel and NOTAMs too."],["W","Balloons can't plan routes, so I just launch and follow the chase crew's directions.","The PTS requires a constructed flight profile and course."],["W","I only need a sectional; road maps aren't relevant.","The PTS lists current local road/street maps."]]},{"id":"III-D-1","a":"III","t":"D","d":2,"ref":"Balloon Flight Manual load chart; PTS III.D","q":"How do you determine how many passengers you can carry this morning?","ans":[["B","Use the flight manual load chart: enter with ambient temperature and altitude (launch and highest planned), at the manual's specified maximum envelope temperature, to get maximum gross weight. Subtract empty weight (envelope, basket, burners, tanks), fuel, pilot, and equipment → available payload. Stay within the certificated maximum gross weight even if the chart allows more, and leave margin for heating up the day.","Correct method with margin."],["S","Look at the load chart for today's temperature and elevation, subtract the balloon, fuel, and me, and whatever's left is passengers.","Correct process; less nuance."],["W","The basket capacity sticker tells me — six seats, six passengers.","Basket capacity isn't performance; temperature/altitude may limit the load."],["W","As long as it lifts off on the field, I'm within limits.","Lifting off at the surface doesn't confirm margins at max envelope temperature or higher altitudes."]]},{"id":"III-D-2","a":"III","t":"D","d":2,"c":1,"ref":"Balloon Flight Manual — limitations; BFH","q":"Explain never-exceed and maximum continuous envelope temperatures, and how you'd know you exceeded them.","ans":[["B","Maximum continuous temperature is the highest envelope temperature for sustained operation — the BFH cites 250°F as the maximum continuous operating temperature for most balloons (many European manuals list a single 120°C maximum). A never-exceed temperature, where published, is an absolute limit above that. The flight manual governs. I monitor the envelope temperature gauge; a fusible temperature flag near the crown indicates an overtemperature. Exceedance requires inspection per the manual before further flight — overtemp weakens fabric and shortens envelope life.","Accurate concept; specific numbers deferred to the flight manual."],["S","There's a hard maximum and a lower number you can run at continuously. The gauge and the temp flag tell me, and I'd get it inspected if exceeded.","Correct essentials."],["W","Envelope temperature only matters on hot days.","Overtemp can occur any day with heavy loads, rapid ascents, or thermals."],["W","If the temp flag drops, it's just an indicator — I can keep flying normally.","An overtemperature indication requires inspection per the manual before further flight."]]},{"id":"III-D-3","a":"III","t":"D","d":2,"ref":"14 CFR 91.151; Balloon Flight Manual; BFH","q":"What VFR fuel reserve does the regulation require for your balloon?","fu":"Read me the first words of 91.151 — what aircraft does it cover?","ans":[["B","None — 91.151 applies to airplanes and rotorcraft only. Balloon reserves come from the flight manual, AC/BFH guidance, operator SOPs, and my personal minimums. I plan the landing with ample fuel to make multiple approaches or an abort (a common practice is to land with at least one full tank or a defined minimum percentage), and set the minimum fuel at which I commit to landing.","Correct regulatory answer plus sound practice."],["S","I don't think there's a regulation for balloons, but I always plan a good reserve — like landing with a tank left.","Correct reasoning, less confident."],["W","30 minutes day, same as airplanes.","91.151 doesn't apply to balloons."],["W","45 minutes, because it's a commercial flight.","No such balloon rule."]]},{"id":"III-D-4","a":"III","t":"D","d":3,"c":1,"ref":"PTS III.D.3, VIII.D; BFH","q":"You're descending at 800 fpm. How much altitude do you need to stop the descent, and why?","ans":[["B","It depends on load, envelope temperature, ambient conditions, and burner output — the flight manual gives maximum descent rates. The key fact is burner lag: the balloon typically responds 6–15 seconds after the burn (BFH), and a fast descent adds momentum and possible envelope distortion. At 800 fpm I'm covering about 13 ft/second — roughly 200 ft before a burn even takes effect — so I begin burning hundreds of feet above the level where I need to stop; never wait until the ground is close.","Correct reasoning about lag and rate."],["S","A lot — several hundred feet — because the burner takes time to work.","Correct concept, no supporting analysis."],["W","A long burn will stop it almost immediately.","Ignores burner lag and momentum."],["W","Vent harder to stabilize, then burn.","Venting increases descent."]]},{"id":"III-E-1","a":"III","t":"E","d":2,"ref":"BFH ch. 3; Balloon Flight Manual","q":"Walk me through your fuel and burner system.","ans":[["B","Propane cylinders with liquid withdrawal valve (to the main burner), vapor withdrawal (often to the pilot light), fixed liquid-level/bleed gauge, fuel quantity gauge, pressure relief valve; hoses to the burner; main blast valve feeding liquid through the coil (vaporized by heat) to the jets; a second (whisper/cow) valve that burns liquid without the coil for a quieter, less efficient flame; pilot light with its own valve and igniter; pressure gauge. Dual burners give redundancy.","Accurate system description."],["S","Tanks feed liquid propane up hoses to the burner; a valve opens the main flame, the pilot light lights it, and there's a quieter liquid valve. Gauges show fuel and pressure.","Good layperson accuracy."],["W","The burner runs on propane vapor drawn from the top of the tank.","Main burners use liquid withdrawal; vapor feeds only some pilot lights."],["W","The whisper burner is more efficient so it's used for big climbs.","It's quieter but less efficient."]]},{"id":"III-E-2","a":"III","t":"E","d":2,"ref":"14 CFR 31.85; Balloon Flight Manual","q":"What instruments are required, and what does each tell you?","ans":[["B","Part 31 basic equipment: an altimeter and a rate-of-climb (vertical speed/variometer) indicator; for hot air balloons, a fuel quantity gauge and an envelope temperature indicator — plus anything the type certificate/flight manual requires. Altimeter: altitude (and margins from airspace); VSI/variometer: trend — the earliest sign of ascent/descent given burner lag; envelope temp: margin to limits; fuel gauge: endurance. Note 91.205 equipment lists apply to powered aircraft, not balloons.","Correct basis and use."],["S","Altimeter, VSI, envelope temperature, and fuel gauges.","Correct list, no regulation or use."],["W","91.205 day VFR equipment like an airspeed indicator and compass.","91.205 is for powered aircraft; balloons have no airspeed indication requirement."],["W","Only a fuel gauge is required; everything else is optional.","Part 31 also requires altimeter, rate-of-climb and envelope temperature indicators."]]},{"id":"III-E-3","a":"III","t":"E","d":2,"c":1,"ref":"BFH; Balloon Flight Manual","q":"Explain your venting/deflation system and its failure modes.","ans":[["B","My envelope uses a parachute top (or equivalent per manual): a fabric panel held in place by internal pressure and centralizing lines, opened with the red vent line to release hot air for descent and fully for deflation; it reseals when released. Some systems add a separate rapid-deflation line or rotation vents. Failure modes: tangled or snagged lines, vent not reseating (continuous heat loss/descent), line out of reach, Velcro tabs not released; preflight checks line routing and resealing; never wrap the line around a hand.","Correct mechanism and failure modes."],["S","Pull the red line, top opens, hot air escapes; let go and it closes. It can stick open or the line can tangle.","Correct in plain words."],["W","The vent must be held closed by the pilot for the entire flight.","Internal pressure seats the parachute."],["W","Venting is how you climb in a hurry.","Venting releases heat — it causes descent."]]},{"id":"IV-A-1","a":"IV","t":"A","d":2,"ref":"PTS IV; AIH; BFH","q":"Teach me the approach to landing as you would to a student. Start with your objective.","fu":"What are the common errors, and how do you recognize, analyze, and correct them?","ans":[["B","Objective: the learner will select a landing site and fly a stable approach to touchdown within the selected area, or abort safely. Elements: site selection from altitude using winds/surface clues, passenger briefing and positions, fuel checks/checklist, descent profile and rates, burner timing given lag, abort decision point. Common errors: late site selection, overventing then overburning (yo-yo), not accounting for surface wind change, late abort decision, forgetting the briefing. Recognition → analysis → correction for each. Completion standards and instructional aids (diagram/whiteboard).","Covers all PTS IV objective elements."],["S","I'd explain how to pick a field, the briefing, how to come down steadily and burn early, and when to abort; I'd mention common mistakes like overventing.","Most content; lacks objective/completion standards structure."],["W","I'd just demonstrate it in the air — balloons are learned by feel.","PTS requires a structured lesson plan with objective and common errors."],["W","Objective: land on the spot. Common error: landing too slowly.","Thin; misidentifies a common error."]]},{"id":"IV-A-2","a":"IV","t":"A","d":3,"ref":"PTS IV; VIII.E","q":"Teach contour flying. What are the two most common errors and their fixes?","ans":[["B","Objective: maintain safe clearance over terrain and obstacles using smooth burner/vent use while dividing attention. Common errors: overburning (ballooning up, losing the contour, overtemping) and overventing (excess sink, forcing a large catch-up burn) — both from reacting late to burner lag. Fix: anticipate with small, early burns, read the variometer trend, fly with a clearance buffer, and look ahead for rising terrain, wires, and livestock. Also consider gusts, shear, thermals, orographic effects.","Correct, with PTS VIII.E elements."],["S","Overburning and overventing — fix by anticipating and making smaller corrections earlier.","Correct core errors and fix."],["W","Fly as low as possible to stay out of wind shear.","Contour flying requires appropriate clearance consistent with safety, not maximum lowness."],["W","The most common error is not using the vent enough.","Overventing is the classic error."]]},{"id":"IV-A-3","a":"IV","t":"A","d":2,"ref":"AIH; PTS IV.5","q":"Your student keeps overventing on approach. Walk me through recognition, analysis, and correction.","ans":[["B","Recognition: VSI shows a rapidly increasing descent and envelope deformation; student then needs long burns. Analysis: why — anxiety about overshooting the field, misjudging lag, or unclear sight picture. Correction: demonstrate a smaller, earlier vent pull, set a target rate, use 'vent, wait, assess,' coach verbally then fade cues, practice at altitude before low approaches.","Structured and specific."],["S","I'd point it out, figure out why they're doing it, and have them practice smaller pulls at altitude.","Right structure informally."],["W","Take the controls every time it happens so the student sees the right way.","Constant takeover removes learning; correction must include student practice."],["W","Tell them to never use the vent on approach.","Vent use is a normal approach tool."]]},{"id":"V-A-1","a":"V","t":"A","d":2,"ref":"PTS V.A; AC 91-71; BFH","q":"How do you choose a launch site?","ans":[["B","Timing for stable air (early morning or late afternoon). Site: adequate size and surface, accessible for vehicles, landowner permission, obstacles (especially downwind and power lines), surface wind and winds aloft giving a trajectory with suitable landing areas, airspace and sensitive areas downwind. Then a competent go/no-go considering all factors.","PTS elements covered."],["S","Big enough open field with permission, no wires downwind, winds taking me somewhere I can land.","Practical core; misses timing and airspace."],["W","Any field the crew can get into — obstacles only matter on landing.","Launch over obstacles is a major hazard; downwind obstacles matter."],["W","Launch at midday when visibility is best.","Midday thermals make that a poor choice."]]},{"id":"V-B-1","a":"V","t":"B","d":2,"ref":"PTS V.B; BFH","q":"Brief me as if I'm your ground crew.","ans":[["B","Designate a crew chief and assign duties: tie-off/quick release, fan, mouth holders, crown line, chase. Brief layout, inflation, crown-line technique (gloves, walk in, never wrap around hand or body, let go if lifted), launch, in-flight comms, landing, recovery and emergencies (fire, launch abort). Establish hand signals and radios. Describe expected direction and time aloft. Confirm equipment aboard. I supervise everything.","Matches all PTS elements."],["S","Assign who does what, explain the crown line safety rule, set radio/hand signals, tell them where we're heading.","Correct core."],["W","Crown line handler wraps the line around their wrist so they don't lose it.","Never wrap — handlers have been lifted and injured."],["W","Crew briefings are optional for experienced crews.","PTS requires a briefing covering all phases."]]},{"id":"V-C-1","a":"V","t":"C","d":2,"c":1,"ref":"PTS V.C; Balloon Flight Manual","q":"Layout and assembly: how do you position the balloon and check the fuel system?","ans":[["B","With the basket upright: fuel-system leak check (sound, smell, frost, leak-detection solution) and a burner test pointed away from people and fabric; shut off and bleed. Then lay the basket on its side with the burner toward the mouth, spread the envelope downwind clear of obstacles, attach cables/carabiners per the flight manual, and complete the checklist.","Covers PTS V.C."],["S","Check the fuel and burner first, then lay the basket down and spread out the envelope.","Correct core."],["W","Lay the envelope upwind so the wind helps fill it.","Envelope goes downwind of the basket."],["W","Test the burner by firing it into the envelope mouth.","Test away from fabric and people."]]},{"id":"V-D-1","a":"V","t":"D","d":2,"c":1,"ref":"PTS V.D; Balloon Flight Manual","q":"Talk me through your preflight inspection and what defects you're looking for.","ans":[["B","Envelope: fabric holes/heat damage, load tapes, crown ring, temperature flag present, vent/parachute lines routed and attached, Velcro tabs. Suspension: cables (fraying, kinks), carabiners (locked, correct, no cracks), handling lines. Basket: wicker/rawhide/floor, uprights, padding. Burner/fuel: frame, coils, valves, pilot lights, hoses (cracks, abrasion), fittings/O-rings, tank straps and gauges. Instruments working. Verify airworthy and complete checklist.","Comprehensive with reasons."],["S","Fabric, cables, carabiners, basket, burners, hoses, tanks, gauges — looking for damage, leaks, and wear.","Good list without depth."],["W","The annual inspection covers the envelope, so I only check the burner daily.","14 CFR 91.7(b): the PIC determines the aircraft is in condition for safe flight — every flight, per the manual's preflight."],["W","Small fraying in a suspension cable is acceptable if it's under 10 percent.","Use manufacturer limits; frayed cables are typically unairworthy."]]},{"id":"V-E-1","a":"V","t":"E","d":2,"c":1,"ref":"PTS V.E; BFH","q":"Describe a normal inflation and the main hazards.","ans":[["B","Tie-off/quick release secured per the manufacturer's approved method with little or no slack; fan positioned for cold inflation with crew at the mouth and crown line; cold inflate. Hot inflation with short burns aimed into the center of the envelope, away from fabric and crew; bring to vertical; secure vent/deflation lines; pilot in basket, checklist. Hazards: burning fabric or crew, fan blade injuries, crown line handler lifted, gusts rolling or dragging the balloon.","Correct sequence and hazards."],["S","Tie off, fan cold air in, then short burns to stand it up while the crew holds the mouth and crown.","Correct core."],["W","Long continuous burns to stand it up faster in wind.","Risks scorching the throat and fabric."],["W","Tie-off is unnecessary if the crew holds the basket.","BFH: secure the quick release/safety restraint with little or no slack, using the manufacturer's approved tie-off method — improper tie-off has destroyed baskets and burner supports."]]},{"id":"V-F-1","a":"V","t":"F","d":1,"c":1,"ref":"PTS V.F; VII.C.4; BFH","q":"Give me your passenger briefing.","ans":[["B","Boarding one at a time when told. In flight: don't touch burner, valves, lines, or tanks; stay inside; secure loose items. Landing: stand where I show you (often the rear of the basket), feet and knees together, knees slightly bent, facing the direction of travel (or as briefed in a compartmented basket), holding tightly to the handles/sides; expect bumps or tipping; do NOT leave the basket until I say so (weight leaving ca
