n relaunch the balloon).","Covers PTS basket-management and landing briefing."],["S","Don't touch anything, stay in the basket, and for landing hold the handles, knees bent, face forward, and don't get out until I say.","Correct essentials."],["W","Hands off the burner, and for landing lock your knees straight and brace hard.","BFH: feet and knees together, knees slightly bent — locked knees transmit the impact and cause injury."],["W","After touchdown, passengers should hop out quickly to help stop the balloon.","Unloading weight can cause the balloon to relaunch."]]},{"id":"V-G-1","a":"V","t":"G","d":2,"ref":"PTS V.G","q":"What happens in your pre-launch check?","ans":[["B","Review wind, temps, and obstructions; final instrument check; vent/deflation lines positioned and secure; coordinate with crew (signals, emergencies, quick release); complete checklist; bring the balloon to equilibrium (weigh-off: heat until the basket is light with crew hands off); divide attention in and around the basket; check traffic before lift-off.","PTS V.G elements."],["S","Final look at the wind and obstacles, gauges good, lines secure, crew ready, get light, check for traffic, go.","Correct core."],["W","Instrument and wind check — equilibrium only matters in gas balloons, not hot air.","PTS V.G.7 requires bringing the balloon to equilibrium before launch."],["W","No traffic check — balloons have right-of-way.","Right-of-way doesn't replace see and avoid."]]},{"id":"VI-A-1","a":"VI","t":"A","d":2,"c":1,"ref":"AIM 4-4-1, 4-4-10; Pilot/Controller Glossary 'Unable'; 14 CFR 91.123","q":"Tower clears you to 'remain west of the field' but the wind is carrying you east. What do you say?","ans":[["B","'Unable.' I can't comply with a clearance I can't fly — balloons can't steer. AIM 4-4-1 expects me to inform ATC and get an amended clearance: advise position, altitude, and drift ('Balloon N1234, unable, drifting east at 6 knots, landing within two miles') and request alternatives. 91.123 prohibits deviating without an amended clearance except in an emergency.","Correct phraseology and regulatory basis."],["S","I'd tell them I can't do that because I'm a balloon and give my position and what I'm going to do.","Correct actions without phraseology/reg."],["W","Acknowledge with 'Wilco' and try to climb to find a westerly wind.","Accepting a clearance you may not meet is a violation risk."],["W","Turn off the radio; balloons don't need clearance.","Clearances must be complied with or declined."]]},{"id":"VI-A-2","a":"VI","t":"A","d":2,"ref":"AIM 4-1, 4-2; Chart Supplement","q":"How do you select frequencies and communicate near a non-towered and a towered airport?","ans":[["B","Get frequencies from the sectional and Chart Supplement: CTAF at non-towered fields (self-announce position, altitude, direction of drift, intentions), tower/approach where applicable. Standard phraseology: who you're calling, who you are, where, request. Read back clearances and instructions; comply or say 'unable.' For Class D, two-way communication must be established before entry.","Covers PTS VI elements."],["S","CTAF at uncontrolled fields to announce myself, tower or approach at towered ones — standard call sign format, and read back instructions.","Correct core."],["W","Use the ground crew radio frequency to talk to towers.","Must use ATC/CTAF frequencies."],["W","At non-towered fields no radio call is appropriate for a balloon.","Self-announcing on CTAF is recommended for all."]]},{"id":"VII-A-1","a":"VII","t":"A","d":2,"c":1,"ref":"PTS VII.A; BFH","q":"Talk me through a normal launch in 6 knots of wind.","ans":[["B","Direct crew clear except the quick release; establish equilibrium then add heat for positive buoyancy beyond any false lift from the wind over the envelope; check traffic and obstacles downwind; release; control the lift-off and initial climb rate, expecting the false lift to vanish as the balloon accelerates to wind speed — keep burning to maintain the climb until clear of obstacles.","Correct technique."],["S","Get light, add extra heat because of the wind, release, and keep burning so I don't sink when I start moving with the wind.","Correct in plain terms."],["W","Release as soon as the basket feels light — the wind lift will carry you up.","That relies on false lift."],["W","Vent slightly after release to keep the climb slow.","Venting right after launch risks sinking into obstacles."]]},{"id":"VII-B-1","a":"VII","t":"B","d":2,"c":1,"ref":"PTS VII.B; BFH","q":"There's a tree line 300 feet downwind of your launch site, 50 feet tall, with 8 knots of wind. How do you launch?","ans":[["B","Determine obstacle height and distance. BFH guideline: a minimum of 100 ft of clearance for each knot of wind — 800 ft at 8 kt — so 300 ft is well short and relocating is strongly favored. The math: 8 kt ≈ 810 ft/min, so 300 ft takes about 22 seconds; clearing 50 ft needs at least ~135 fpm with zero margin. If launching at all, preheat well above equilibrium (true buoyancy, not false lift) and burn decisively; if clearance isn't assured, relocate or don't launch.","Correct analysis using height, distance, and wind (PTS VII.B)."],["S","Get very hot before launch so I climb steeply right away, and keep burning until I'm well above the trees.","Correct technique without the math."],["W","Launch light and let the wind push me up over them.","False lift will vanish; a light balloon may hit the trees."],["W","Launch, then vent if I'm going too fast toward the trees.","Venting reduces climb — the opposite of what's needed."]]},{"id":"VII-C-1","a":"VII","t":"C","d":2,"ref":"PTS VII.C; AC 91-71","q":"How do you approach a landing field?","ans":[["B","Pick the site considering wind (surface may differ from altitude — watch smoke, flags, water, trees), size, surface, obstructions (especially wires on the approach), and access/permission; stow loose articles, brief occupants and position them; check fuel quantity and selection, complete the checklist; establish the approach profile and descent rate; have an abort decision point and execute it early because of burner lag.","PTS elements covered."],["S","Find a good field, watch the low-level wind, brief everyone, check fuel, come down at a steady rate, and burn out early if it's not working.","Correct practical answer."],["W","Descend fast and level off at the last second for a crisp touchdown.","Late level-off with burner lag is dangerous."],["W","Abort decisions should be made at about 10 feet when you can see it best.","Too late given burner lag."]]},{"id":"VII-D-1","a":"VII","t":"D","d":2,"ref":"PTS VII.D; BFH","q":"When would you use a steep approach and how do you fly it?","ans":[["B","When the landing field is small or bordered by obstacles on the approach side (or surface winds are light and you need to drop into a field just past trees). Select the site relative to wind speed/direction, brief occupants and secure equipment, stay higher until past the obstacle, then establish a steeper controlled descent with vent and burner, arresting the descent early enough given lag; control ground travel; be ready to abort.","PTS VII.D elements."],["S","Small fields behind obstacles — stay high, then come down steeper, but stop the descent in time.","Correct core."],["W","A steep approach is just a dive at maximum descent rate.","Rates must stay within limits and controlled."],["W","Steep approaches are only used in high wind.","High-wind landings are a separate task."]]},{"id":"VII-E-1","a":"VII","t":"E","d":1,"c":1,"ref":"PTS VII.E; BFH","q":"You've touched down in calm winds with four passengers. What happens now?","ans":[["B","Prepare vent/deflation per manual before touchdown; on touchdown, use burner and vent to stabilize. Before anyone gets out, stabilize: either keep the balloon weighted/heavy (crew holding/weight-on) or deflate. Passengers exit only when I say, one at a time with crew replacing weight, because each person leaving makes the balloon lighter and it can relaunch with remaining occupants.","Safety-critical weight-off concept."],["S","Get it stable, then let people out one at a time with crew holding on so it doesn't take off.","Correct concept."],["W","Everyone out at once so the crew can quickly start pack-up.","Can launch the balloon with the pilot."],["W","Rip it out at touchdown and have everyone step out right away while it deflates.","Occupants exit only after the balloon is stabilized and the pilot says so (PTS VII.E.5)."]]},{"id":"VII-F-1","a":"VII","t":"F","d":2,"c":1,"ref":"PTS VII.F; BFH; Balloon Flight Manual","q":"Winds have picked up to 15 knots. Describe your high-wind landing.","ans":[["B","When committed: re-brief (passengers stand at the front of the basket, gloves/helmets if available, hold on, stay in until stopped), secure equipment. Choose a large field with long, obstacle-free run-out and no wires; approach to the near end at the lowest safe altitude. Turn off fuel valves, drain lines, and extinguish pilot lights per the manual (some dual-burner pilots keep one burner live to climb out of a bad approach). Open the deflation vent at the appropriate time to control ground travel.","PTS VII.F elements."],["S","Big field with lots of room, brief the passengers well, pilot lights off, rip it out on touchdown and hold on.","Correct essentials."],["W","Land slowly with partial heat to soften the touchdown, then deflate after the basket stops.","Waiting until the basket stops prolongs dragging; open the deflation vent at the appropriate time to control ground travel."],["W","Leave pilot lights on so you can relaunch if needed.","Shutting down per the manual reduces fire risk in a tip-over; the BFH notes some dual-burner pilots keep one burner to climb out of a bad approach — not to relaunch after deflating."]]},{"id":"VIII-A-1","a":"VIII","t":"A","d":1,"ref":"PTS VIII.A–C","q":"I'm going to ask you to climb at 300 fpm and level at 1,500 feet. What are the PTS tolerances and how do you fly it?","ans":[["B","Ascend at the specified rate ±50 fpm and level at the specified altitude ±50 feet. Transition from level with anticipatory burns, monitor the variometer, reduce burns before the target altitude to account for lag, and stabilize with smaller burns.","Correct tolerances (PTS VIII.A) and technique."],["S","Within about 50 feet and 50 fpm — I'd ease off the burns before reaching altitude.","Correct numbers, less detail."],["W","±100 feet like an airplane checkride.","The balloon PTS standard is ±50 feet."],["W","Burn until reaching 1,500 then stop.","Lag will overshoot the altitude."]]},{"id":"VIII-B-1","a":"VIII","t":"B","d":1,"ref":"PTS VIII.B","q":"How do you recognize vertical movement and maintain level flight?","ans":[["B","Variometer trend first, then altimeter; outside cues (ground features changing size, horizon, trees/smoke) and the feel of the envelope/air. Maintain equilibrium with smooth, regular small burns timed to the trend. Hold assigned altitude ±50 ft.","Correct."],["S","Watch the vario and outside references, small regular burns to stay level.","Correct essentials."],["W","Only the altimeter; outside references are unreliable.","The variometer and outside references give earlier cues."],["W","Burn whenever the altimeter shows a 100-ft loss.","Too late and outside tolerance."]]},{"id":"VIII-C-1","a":"VIII","t":"C","d":2,"ref":"PTS VIII.C; BFH","q":"How do you set up a controlled 200 fpm descent?","ans":[["B","Cooling descent: reduce or stop burns and let the envelope cool; or use short vent pulls for a quicker start. Monitor the variometer, and add small burns to stabilize the rate within ±50 fpm. Begin leveling well above the target altitude due to lag, and level within ±50 ft.","Correct technique and tolerance."],["S","Stop burning and maybe a small vent, then burn a bit to hold the rate and level off early.","Correct."],["W","Hold the vent open until reaching 200 fpm, then close it.","Overvent leads to excess momentum."],["W","Descend at whatever rate develops; PTS doesn't specify.","PTS requires a specified rate ±50 fpm."]]},{"id":"VIII-D-1","a":"VIII","t":"D","d":2,"c":1,"ref":"PTS VIII.D","q":"When would you need a rapid ascent or descent, and what are the hazards?","ans":[["B","Situations: obstacle avoidance (wires, terrain), escaping a hazard, airspace/landing needs. Hazards: exceeding manufacturer limits (max rates, envelope temperature), envelope distortion (on fast descents the top can collapse/push in; high rates create airflow over fabric), large time/altitude needed to recover from a rapid descent, and overtemp during max burns — monitor temperature continuously.","PTS VIII.D elements."],["S","To clear obstacles or get out of trouble — but you can overheat the envelope or distort it, and it takes a lot of altitude to stop.","Correct core."],["W","Rapid descents are safe as long as you stop above 100 feet.","Distortion and lag can make 100 ft insufficient."],["W","Envelope temperature doesn't change on rapid ascents.","Heavy burning drives envelope temperature up."]]},{"id":"VIII-E-1","a":"VIII","t":"E","d":2,"ref":"PTS VIII.E","q":"What considerations go into contour flying?","ans":[["B","Maintain the desired clearance consistent with safety over terrain and obstacles; consider gusts, wind shear, thermals, and orographic effects; avoid overburning and overventing; divide attention between control, ground track, and visual scanning (wires!); respect 91.119 minimum altitudes and landowner/livestock sensitivities.","Covers PTS VIII.E plus regulatory context."],["S","Stay at a safe height above the ground, watch for wires and wind changes, small corrections.","Correct essentials."],["W","Contour flying is exempt from minimum safe altitudes.","91.119 applies except when necessary for takeoff or landing."],["W","Look primarily inside the basket at instruments.","Outside scanning is primary at low altitude."]]},{"id":"VIII-G-1","a":"VIII","t":"G","d":2,"c":1,"ref":"PTS VIII.G; FAA-P-8740-34 Powerlines and Thunderstorms; FAA-H-8083-11B Balloon Flying Handbook ch. 7–8","q":"Power lines: how do you spot them, avoid them, and what if contact is imminent?","ans":[["B","Look for poles, towers, cleared rights-of-way, lines along roads/railways, insulators and transformers — the wires themselves are nearly invisible. Avoid early: climb with plenty of margin given burner lag, or land well short (even in a less desirable field). If contact is unavoidable: shut off fuel at the tanks and burner, drain lines and extinguish pilot lights; a contact high on the envelope (above the equator) is far less hazardous than one at or below it, where the basket is dragged into the wires and flying wires can arc — ripping out short is often better than a late burn. After contact, stay in the basket unless fire forces exit, never touch basket and ground at the same time, keep crew away, and wait for the utility to de-energize.","Comprehensive and safety-focused (special emphasis area)."],["S","Look for poles, climb early, and if I'm going to hit, shut off the fuel and pilot lights and keep everyone in the basket until the power company says it's safe.","Correct core procedure."],["W","Descend fast to go under the lines.","Late descent beneath wires is a classic fatal error."],["W","Grab the wire to push the basket away.","Electrocution hazard."],["W","Jump out once the basket touches the wires.","Leaving while the basket is energized and touching the ground — or jumping from height — risks electrocution or injury; stay in unless fire forces exit."]]},{"id":"VIII-H-1","a":"VIII","t":"H","d":2,"ref":"PTS VIII.H; Balloon Flight Manual","q":"A county fair wants tethered rides. What do you need to consider?","ans":[["B","Follow the flight manual: tether lines per manufacturer — the BFH describes three-line and six-line methods (six-line preferable in windier conditions) — planned so any one line can fail; an area at least two, preferably three, times a normal launch area; manual wind limits; false lift and gusts; thorough crew briefing; crowd control; crew never leaves the ground. Paid tethered rides are still compensation-or-hire operations (second-class medical, 91.409(b) inspection).","PTS VIII.H elements plus commercial context."],["S","Proper tether lines per the manual, a big enough area, wind limits, and crowd control.","Correct core."],["W","One tether line is enough because the balloon rises vertically.","Manual-specified multi-point tethering is standard."],["W","Tethered rides aren't flights, so commercial rules don't apply.","A manned tethered balloon is still an aircraft operation."]]},{"id":"VIII-I-1","a":"VIII","t":"I","d":2,"c":1,"ref":"PTS VIII.I; BFH","q":"It's 15°F. What changes about your fuel system and operation?","ans":[["B","Propane vapor pressure drops sharply in the cold, so burner output falls. Tanks can be pressurized with nitrogen per the manufacturer's procedure (liquid withdrawal only; don't use vapor withdrawal from a nitrogen-pressurized tank). Equipment: gloves, spare igniters, warm clothing, keep tanks warm only by approved methods. O-rings stiffen and leaks increase; vapor can pool in low areas/snow; increased fire risk — leak check thoroughly.","Covers PTS VIII.I."],["S","Pressure drops so the burner is weak; we add nitrogen; watch for leaks and dress warm.","Correct core."],["W","Heat the tanks with an open flame or torch before flight.","Fire/explosion hazard; warm tanks only by manual-approved methods (nitrogen, heat tapes or heated covers — never near open flame)."],["W","Cold air gives more lift, so fuel pressure doesn't matter.","Lower burner output can limit control even with better ambient lift."]]},{"id":"VIII-J-1","a":"VIII","t":"J","d":2,"ref":"PTS VIII.J","q":"You've been invited to fly in the mountains. What preparation and hazards matter?","ans":[["B","Preparation: survival gear and supplies for the terrain/climate, communications, crew able to reach remote areas. Few accessible landing areas — plan them. Recognize lee-side downdrafts and turbulence (lenticular and rotor clouds), valley/slope (anabatic/katabatic) winds, wind shear, rapid weather change. Higher density altitude reduces performance and increases fuel burn.","PTS VIII.J elements."],["S","Bring survival gear, plan landing spots because there aren't many, and watch for downdrafts on the lee side and fast weather changes.","Correct essentials."],["W","Mountains provide reliable ridge lift that makes balloon flight easier.","Lee-side downdrafts and turbulence are hazards."],["W","No extra preparation needed if winds aloft are light.","Local mountain winds and terrain still demand preparation."]]},{"id":"IX-A-1","a":"IX","t":"A","d":2,"ref":"PTS IX; BFH","q":"How do you 'steer' and navigate a balloon?","ans":[["B","By changing altitude to find winds of different direction/speed (identified via forecast, pibals, other balloons, smoke, flags, ground track). Navigate by relating surface features to chart symbols, confirm with GPS, continuously verify position, note airspace and altitude restrictions, manage fuel, and compare actual vs. planned track.","Covers PTS IX."],["S","Change altitude to catch different winds; use the map and GPS to know where I am.","Correct core."],["W","Use the turning vents to steer toward the destination.","Rotation vents rotate the balloon; they don't create directional thrust."],["W","Balloons can't navigate at all, so position awareness is the chase crew's job.","PTS requires the pilot to verify position at all times."]]},{"id":"IX-A-2","a":"IX","t":"A","d":2,"ref":"PTS IX.6–7","q":"How do you determine how long to stay up, and what do you do when the flight doesn't follow the plan?","ans":[["B","Duration depends on suitable landing areas ahead, fuel consumption vs. reserve, winds and atmospheric changes (e.g., thermals/wind increases later in the morning), and obstacles/airspace downwind. Track actual vs. planned and adjust: land early if landing options are running out, the wind is building, or fuel reaches my commit point.","PTS IX.6–7."],["S","Based on fuel, landing spots, and the weather getting worse — and I adjust or land early if things change.","Correct core."],["W","Fly until fuel reaches the reserve, then look for a landing site.","Landing options may not exist at that point."],["W","Duration is set by the passenger ticket — 60 minutes.","Safety factors govern."]]},{"id":"X-A-1","a":"X","t":"A","d":2,"c":1,"ref":"PTS X.A.1; Balloon Flight Manual","q":"Your pilot light goes out at 800 feet.","ans":[["B","Relight with the piezo igniter; if that fails, use the other burner's pilot (dual burner) or a manual striker; as a backup, crack the blast/liquid valve and light with a striker per the manual. Maintain altitude control throughout — don't let a descent build while troubleshooting. Determine the cause (fuel, wind, blockage) and land at the first suitable site if reliability is in doubt.","Correct priorities and procedure."],["S","Relight it with the igniter or striker, use the other burner, and land soon.","Correct essentials."],["W","Open the blast valve wide to relight from the coil heat.","A burner may occasionally relight off a hot coil right after a burn, but discharging unlit liquid propane is a fire hazard — relight the pilot."],["W","Ignore it — the main burner works without a pilot light.","The main burner needs the pilot to ignite."]]},{"id":"X-A-2","a":"X","t":"A","d":2,"c":1,"ref":"PTS X.A.2; Balloon Flight Manual","q":"Your blast valve sticks open during a climb.","ans":[["B","Shut off fuel at the tank valve (or the hose shutoff/master per the system) supplying that burner to stop the flame; monitor envelope temperature; use the second burner/whisper valve for control; you can use the tank valve itself as a crude on/off control to land if needed. If stuck closed, use the other burner or whisper valve. Land as soon as practical; brief passengers.","Correct per typical flight manual procedures."],["S","Turn off the tank feeding it, use the other burner, and get down.","Correct core."],["W","Vent continuously to counteract the climb.","Overheat and fuel waste continue; stop the fuel."],["W","Pull the burner hose off.","Releases liquid propane — fire hazard."]]},{"id":"X-A-3","a":"X","t":"A","d":2,"c":1,"ref":"PTS X.A.4; BFH","q":"You smell propane and see frost forming on a hose fitting in flight. Then flames appear at the fitting.","ans":[["B","Close the tank valve feeding that line immediately — shutting the valve usually puts the fire out. A small flame at a fitting can be snuffed with a gloved hand; the extinguisher is the backup (basket extinguishers are often small). Switch to another tank/burner if safe, keep passengers clear, land as soon as practical, and report — in-flight fire is an NTSB immediate-notification item (49 CFR 830.5).","Correct priorities."],["S","Shut that tank off, extinguish, land ASAP.","Correct essentials."],["W","Douse it with water from the passengers' bottles.","Not effective on a propane fire; shutoff first."],["W","Keep burning to land faster, then deal with the leak.","Feeding the leak worsens the fire."]]},{"id":"X-A-4","a":"X","t":"A","d":2,"ref":"PTS X.A.3","q":"How do you prevent fuel exhaustion and what happens if it occurs?","ans":[["B","Prevention: plan fuel with reserves, monitor gauges and burn rate, set a commit-to-land fuel, switch tanks properly, land early. If it occurs: the balloon cools and descends; select a landing area immediately, brief passengers, use residual heat wisely, prepare for a hard landing.","Correct."],["S","Watch the gauges and land with fuel left; if I run out, find a field and brief everyone for a hard landing.","Correct essentials."],["W","Fuel gauges read accurately all the way to empty so you can fly to the last drop.","Float gauges are mechanical and sometimes inaccurate; most don't read 0–100% (many only register from about a third down) — know your gauge and manual."],["W","If you run out, venting slows the descent.","Venting increases descent."]]},{"id":"X-B-1","a":"X","t":"B","d":1,"ref":"PTS X.B","q":"What emergency and survival equipment do you carry and why?","ans":[["B","Fire extinguisher, first aid kit, leather gloves, spare igniter/striker, drop line, handheld radio, a phone for use after landing, a knife, and climate/terrain-appropriate gear (water, warm clothing, sun protection; flotation if over water). Know location, purpose, and how to use each.","PTS X.B elements."],["S","Fire extinguisher, first aid, gloves, striker, radio and phone.","Core items."],["W","A parachute for each passenger.","Not standard for balloons."],["W","Equipment only matters for long flights.","Emergencies can happen any flight."]]},{"id":"X-C-1","a":"X","t":"C","d":2,"ref":"PTS X.C; BFH","q":"When would you land in water, and how?","ans":[["B","Only as an emergency. Consider wind and current (to drift toward shore), brief passengers (flotation, stay together), secure equipment, and treat fuel/pilot lights per the manual. After contact: hold onto the basket — it floats — but get clear if it inverts (tank placement); stay with it unless near the bank and strong swimmers. A deflated envelope is heavier than water and sinks — avoid entanglement in lines.","Covers PTS X.C."],["S","Only if there's no other choice — brief everyone, think about wind and current, and get people out carefully.","Correct core."],["W","Touch the water deliberately to slow the balloon (splash-and-go) for fun.","Hazardous and not an emergency landing technique."],["W","Water landings are softer, so prefer them to rough fields.","Drowning and entanglement hazards make it a last resort."]]},{"id":"X-D-1","a":"X","t":"D","d":2,"c":1,"ref":"PTS X.D; BFH","q":"What causes thermals, how do you recognize them, and what do you do?","ans":[["B","Uneven surface heating, typically mid-morning to late afternoon; signs include dust devils, cumulus, soaring birds and gusty surface winds. In a thermal the envelope cools faster than normal: keep flying the balloon, keep the envelope at or above equilibrium temperature, and don't vent to descend — altitude is your friend; thermals are short-lived and often expel the balloon higher, where it can be controlled and landed. Best defense: plan flights outside thermal hours.","PTS X.D elements."],["S","Sun heating the ground; dust devils and cumulus; a rough ride — so avoid midday flying.","Correct core."],["W","Thermals help balloons climb, so use them for altitude gains.","Thermals are hazardous to balloons."],["W","Thermals are only a mountain flying phenomenon.","They occur over flat terrain too."]]},{"id":"XI-A-1","a":"XI","t":"A","d":1,"ref":"PTS XI.A; BFH","q":"You've landed in a farmer's field. Walk me through the recovery.","ans":[["B","Coordinate with the landowner (permission, route in, gates), supervise crew and control vehicles/spectators, minimize property damage (stay on edges, don't drive on crops, leave gates as found), complete the checklist. Landowner relations are critical to the sport and to future access.","PTS XI.A elements."],["S","Find the landowner, have the crew drive in carefully, and leave things as we found them.","Correct essentials."],["W","Drive straight to the balloon regardless of crops — it's an emergency recovery.","Minimizing property damage is a PTS element."],["W","Landowner contact is the chase crew's job, not the pilot's.","The pilot remains responsible for coordinating recovery."]]},{"id":"XI-B-1","a":"XI","t":"B","d":2,"ref":"PTS XI.B","q":"Describe deflation and pack-up.","ans":[["B","Secure the fuel system (pilot lights off, tank valves closed, lines bled). Deflate considering wind and obstacles — the envelope lays downwind, crew on the crown line. Disassemble, pack and store the envelope, basket, and fuel system; perform a postflight inspection noting damage; complete the checklist.","PTS XI.B elements."],["S","Fuel off, open the top and lay it down with the crew, pack it up, look it over.","Correct core."],["W","Deflate into the wind so the envelope folds back over the basket.","Envelope deflates downwind."],["W","Leave pilot lights on during pack-up for easy reignition.","Fuel must be secured."]]},{"id":"XI-C-1","a":"XI","t":"C","d":2,"c":1,"ref":"PTS XI.C; BFH","q":"Tell me about propane's physical properties and why they matter.","ans":[["B","Stored as a liquid under pressure; boils at about −44°F; vapor is roughly 1.5 times heavier than air, so it pools in low areas; liquid expands about 270 times into vapor; flammable in roughly 2–10% concentration in air; odorized (mercaptan). Contact with liquid causes cold burns. Vapor pressure depends on temperature (drops in the cold).","PTS XI.C.1 and safety links."],["S","It's a liquid under pressure that turns to vapor, the vapor is heavier than air and can sit in low spots, it's very cold and flammable.","Correct essentials."],["W","Propane vapor is lighter than air and disperses upward.","It's heavier than air."],["W","Propane stays a liquid at room temperature in open air.","It boils at about −44°F."]]},{"id":"XI-C-2","a":"XI","t":"C","d":2,"c":1,"ref":"PTS XI.C.2–6; BFH","q":"Walk me through safely refueling your cylinders.","ans":[["B","Fill outdoors in a well-ventilated area away from ignition sources (no smoking, engines off, phones/pilot lights out), grounded/bonded as required; wear gloves and eye protection; inspect cylinders, valves, O-rings, and certification; fill to the maximum (typically 80%) using the fixed liquid level/bleed gauge to leave vapor space for expansion; avoid moisture contamination (it can freeze in valves and regulators); leak check after filling. Explosion and burn hazards drive each step.","PTS XI.C elements."],["S","Outside with no flames around, gloves on, fill to about 80% using the bleed valve, check for leaks.","Correct core."],["W","Fill to 100% to maximize flight time.","Leaves no expansion space — overpressure/relief venting hazard."],["W","Moisture in tanks is harmless because propane absorbs it.","Moisture can freeze in valves/regulators."]]},{"id":"SC-1","a":"VII","t":"C","d":3,"c":1,"s":1,"ref":"PTS VII.C, VIII.G; ADM","q":"Scenario: You're on approach to a field at 150 ft AGL. Surface winds are stronger than at altitude and you're drifting toward the field's downwind edge, which has a power line. Fuel is at 25%. Talk me through it.","ans":[["B","Decide now, not later: with burner lag and a wire on the downwind edge, either commit to a steeper descent that guarantees touchdown well short of the line (only if there's ample room) or abort immediately with an early, strong burn to clear the wire with large margin. With 25% fuel, a go-around is still feasible but I'd set a commit point for the next field and brief passengers again. Prioritize wire avoidance over landing in the planned field.","Correlates landing, wire avoidance, fuel, and ADM."],["S","Abort early and climb well above the wires, then find another field before fuel gets low.","Safe decision; less analysis."],["W","Vent hard and try to slide in under the line.","Highly dangerous; wire strikes kill balloonists."],["W","Continue the approach and decide at 20 feet.","Lag makes a late abort ineffective."]]},{"id":"SC-2","a":"I","t":"F","d":3,"s":1,"ref":"14 CFR 91.17, 61.87; AIH; IMSAFE","q":"Scenario: Your student arrives for a solo flight with bloodshot eyes and says they were at a wedding until 2 a.m. It's 6 a.m. What do you do?","ans":[["B","Don't release them for solo. 8 hours from last drink may not have elapsed, and fatigue/impairment is evident regardless (91.17, IMSAFE). As the instructor I'm responsible for supervising and authorizing solo; I would cancel, explain why constructively, and use it as an ADM teaching point without shaming.","Correct regulatory and instructional response."],["S","Cancel the solo and talk to them about fitness to fly.","Correct, less detail."],["W","Fly dual instead and let them manipulate the controls.","Still an impaired pilot handling controls; not appropriate."],["W","It's their certificate — they decide.","Instructor authorizes solo flights and must act."]]},{"id":"SC-3","a":"X","t":"A","d":3,"c":1,"s":1,"ref":"PTS X.A; IX; ADM","q":"Scenario: On a ride flight, one burner starts sputtering and the pressure gauge is low on the active tank. It's 34°F. What's happening and what's your plan?","ans":[["B","Likely low tank pressure (cold weather, possibly not nitrogen-pressurized, or a near-empty tank) or contamination/ice. Switch to a different tank, use the second burner, monitor envelope temperature and descent trend, and plan to land at the next suitable field rather than troubleshoot at length. Brief passengers. Post-flight, investigate pressurization and moisture.","Correlates cold-weather fuel, system malfunction, and decision-making."],["S","Probably low pressure from cold — switch tanks and land soon.","Correct essentials."],["W","Keep burning on that tank until the pressure comes back up.","Pressure won't recover in the cold; controllability suffers."],["W","Bleed the tank to raise the pressure.","Bleeding reduces pressure/contents."]]},{"id":"SC-4","a":"III","t":"A","d":3,"s":1,"ref":"14 CFR 61.3, 61.23(a)(2)(iii), 91.409(a),(b)","q":"Scenario: A friend offers you $200 to take her family up in your balloon. Your medical expired last month and the last annual was 14 months ago. Can you go?","ans":[["B","No. Taking compensation makes it a commercial operation: I'd need a valid second-class medical, and the balloon needs a current annual (12 calendar months) and, because persons are carried for hire, a 100-hour/annual within the last 100 hours. Even without compensation, the expired annual makes the balloon unairworthy for any flight. Fix the inspection first; without a medical I could only fly privately (no compensation) once airworthy.","Correlates medical, airworthiness, and privileges."],["S","No — I need a current medical for paid rides and the balloon needs its annual.","Correct conclusion."],["W","Yes if I don't take the money, since private flights don't need anything.","The expired annual still grounds the balloon."],["W","Yes, since balloon pilots don't need medicals and annuals have a grace period.","Both claims are wrong."]]},{"id":"I-A-6","a":"I","t":"A","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 3 — Domains of learning","q":"What are the domains of learning, and which one matters most when teaching a hot inflation?","ans":[["B","Cognitive (knowledge), affective (attitudes, beliefs, values), and psychomotor (physical skills). Hot inflation is primarily psychomotor, but the affective domain — a safety attitude toward crew and fabric — and the cognitive domain (why short, centered burns) are both in play.","AIH's three domains, correctly applied."],["S","Knowledge, attitude, and hands-on skill — for inflation it's mostly the hands-on part.","Correct domains in plain language without the terms."],["W","Rote, understanding, application, correlation — inflation lives at the application level.","Those are levels of learning, not domains."],["W","Visual, auditory, and kinesthetic domains — inflation is kinesthetic, so just let them feel it.","Learning-styles labels aren't the AIH domains of learning."]]},{"id":"I-A-7","a":"I","t":"A","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 3 — Learning plateaus","q":"Your student's landings were improving, then stalled for three flights. What's going on and what do you do?","ans":[["B","A learning plateau — a normal, temporary leveling-off in skill progress. Tell the student it's normal, vary the practice or switch to related tasks, keep motivation up, and avoid over-drilling the same thing. Rule out other causes (fatigue, stress, unclear standard).","Correct identification and response."],["S","They've hit a wall that happens to everyone — I'd mix up the lessons so they don't get frustrated.","Right idea without the term."],["W","It means they've reached their natural ceiling for balloon skill, so I'd slow the syllabus way down.","Plateaus are temporary, not a fixed ability ceiling."],["W","Lack of effort — I'd schedule extra landings back-to-back until they break through it.","Over-drilling often prolongs a plateau."]]},{"id":"I-C-2","a":"I","t":"C","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 5 — Preparation and presentation","q":"You have a ground lesson tonight on propane safety. How do you prepare and what presentation method fits?","ans":[["B","Preparation: review the objective, the learner's background, references, a lesson plan, and aids (a cylinder, valves, photos). Presentation: lecture with guided discussion fits knowledge content; then have the learner apply it (walk-through of a real cylinder), followed by review and evaluation.","Matches the teaching process with an appropriate method."],["S","I'd read up, plan what to cover, bring an actual cylinder, talk through it, then quiz them.","All four steps informally."],["W","No prep needed for a ground lesson — I know propane well enough to just talk through it.","Preparation is the first step of the teaching process."],["W","Demonstration-performance is the only valid method for safety topics, so we'd go fill tanks.","Knowledge content suits lecture/discussion; the method should match the material."]]},{"id":"I-D-3","a":"I","t":"D","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 5 — Guided discussion","q":"In a guided discussion, what kinds of questions do you use to start and steer it?","ans":[["B","AIH 9B: a lead-off question opens an area for discussion; follow-up questions get learners to explain more thoroughly or bring the discussion back on track. Use open-ended 'how,' 'why,' and 'what if' questions rather than yes/no or short-fact questions; a learner's question can be turned back to them or to the group. (Legacy 9A terms: overhead, rhetorical, direct, reverse, relay.)","Matches AIH 9B guided discussion."],["S","Questions to the whole group, to one person, and bouncing a question back to the student or the group.","Describes question direction (group, individual, turned back) — the legacy 9A types — without lead-off/follow-up."],["W","Mostly yes-or-no questions, so the discussion stays focused and moves along quickly.","Guided discussion relies on open-ended questions."],["W","Trick and puzzle questions — they keep the group alert and show who really knows it.","AIH lists those as question types to avoid."]]},{"id":"I-E-4","a":"I","t":"E","d":2,"ref":"FAA-H-8083-9B (AIH) ch. 6 — Responses to learner questions (p. 6-12)","q":"Your student asks something about the regulations that you honestly don't know. What do you do?","ans":[["B","Admit you don't know, commit to finding the answer, look it up with the learner when practical (modeling research skills with the CFR/AIM/handbook), and follow up. Never bluff — a wrong answer erodes credibility and can teach an error.","AIH guidance."],["S","Tell them I'm not sure and that I'll get back to them with the right answer next time.","Correct core; misses looking it up together."],["W","Give my best guess confidently, so the student keeps trust in me as the instructor.","Bluffing damages credibility and teaches errors."],["W","Tell them it won't be on the checkride, so it isn't worth spending lesson time on.","Dismissive and may be wrong; responding to questions is an instructor duty."]]},{"id":"I-E-5","a":"I","t":"E","d":2,"ref":"PTS — Unsatisfactory Performance, Letter of Discontinuance; 14 CFR 61.43(c),(e),(f)","q":"If you fail a Task today, what happens — and what's a letter of discontinuance?","ans":[["B","Failing any Task fails that Area and the practical test; I'd receive an 8060-5 Notice of Disapproval listing the failed Area(s)/Task(s) and Areas not tested, and I can choose to continue for credit. Under 61.43, credit for Areas passed is kept if I retest within 60 days. A letter of discontinuance is issued when the test stops for reasons other than performance — weather, equipment, illness — and lists the Areas completed.","Accurate under the PTS and 61.43."],["S","I'd get a pink slip for the failed part and could redo just that part later if it's soon enough.","Correct gist; missing the specifics."],["W","A failed Task can be retaught and retried on the spot; the DPE then grades the second attempt.","Instruction/practice isn't permitted during the test."],["W","A letter of discontinuance means the test was failed but the DPE chose a gentler form.","Discontinuance is for non-performance reasons only."]]},{"id":"I-F-6","a":"I","t":"F","d":2,"c":1,"ref":"PTS — Positive Exchange of Flight Controls; FAA-H-8083-9B (AIH) ch. 9","q":"How do you and a student transfer control of the balloon?","ans":[["B","Brief it before flight and use the three-step positive exchange: 'You have the flight controls.' — 'I have the flight controls.' — 'You have the flight controls.' Confirm visually. There's never doubt who is flying; in a balloon that includes who is operating the burner and the vent line.","PTS-recommended procedure."],["S","We say out loud who has it and confirm it, so there's never confusion over who's on the burner.","Right idea, missing the three-step format."],["W","I just take the blast valve when I need to — in a balloon it's obvious who's flying.","Ambiguity about control is a known accident cause."],["W","A tap on the shoulder means I've taken over; talking in the basket distracts the student.","PTS calls for verbal three-step exchange."]]},{"id":"I-F-7","a":"I","t":"F","d":3,"s":1,"ref":"FAA-H-8083-9B (AIH) ch. 8; 14 CFR 61.39","q":"A ride company owner wants you to sign off his new pilot for the commercial checkride by Friday. You don't think the pilot is ready. What do you do?","ans":[["B","Decline. My endorsement certifies the applicant is prepared (61.39); signing off someone I don't believe is ready is unethical and unsafe and undermines my credibility. Explain the specific deficiencies, offer a training plan, and set an honest timeline. Commercial pressure doesn't change the standard.","Ethical and regulatory answer."],["S","I wouldn't sign it yet — I'd tell the owner what still needs work and how long it'll take.","Correct decision, missing the 61.39 basis."],["W","Sign it — the DPE is the real gate, so if he isn't ready the checkride will catch it.","Shifts responsibility; the endorsement is a certification."],["W","Sign it with a written note in the logbook listing the weak areas for the examiner to probe.","A conditional endorsement still certifies readiness you don't believe in."]]},{"id":"I-G-3","a":"I","t":"G","d":3,"ref":"FAA-H-8083-9B (AIH) ch. 6 (p. 6-6), ch. 9 (p. 9-6) — Learner-centered grading","q":"How would you grade your student with learner-centered grading?","ans":[["B","Maneuver/procedure grades: Describe, Explain, Practice, Perform (and Not Observed). Single-pilot resource management grades: Explain, Practice, Manage-Decide. The learner self-assesses first, then the instructor and learner compare. It fits scenario-based training and builds judgment.","AIH learner-centered grading scales."],["S","The student rates themselves first on how well they can explain and do it, then we compare notes.","Captures the self-assessment idea without the scale."],["W","Letter grades A through F for each maneuver, recorded so the DPE can see the trend.","Not the AIH learner-centered method."],["W","Satisfactory or unsatisfactory only — anything finer just confuses the student.","Learner-centered grading uses graduated levels."]]},{"id":"II-A-6","a":"II","t":"A","d":2,"ref":"PHAK ch. 17 — Dehydration and heatstroke","q":"It's a 92°F August evening flight with a full basket. What aeromedical issues are you watching for?","ans":[["B","Dehydration and heatstroke for pilot, crew, and passengers — burners add radiant heat in the basket. Symptoms: headache, fatigue, dizziness, cramps, impaired judgment. Carry water, hydrate before flight, brief passengers, and watch older passengers. Hot days also mean higher envelope temperatures and lower performance margins.","Correct identification and mitigation."],["S","People overheating — I'd make sure everyone drinks water and watch for anyone feeling sick.","Correct practice without the conditions named."],["W","Hypothermia from evening cooling at altitude, so passengers should bring a heavy jacket.","Wrong hazard for a 92°F evening."],["W","None for the passengers — heat only affects the envelope's performance, not people aboard.","Ignores real physiological risks."]]},{"id":"II-A-7","a":"II","t":"A","d":2,"ref":"PHAK ch. 17 — Carbon monoxide; hypemic hypoxia","q":"During a long tethered session in calm air, your crew chief complains of a headache and drowsiness near the basket. Concern?","ans":[["B","Possible carbon monoxide exposure — burner combustion products can accumulate around a stationary balloon in calm air. CO causes hypemic hypoxia: headache, drowsiness, dizziness, nausea. Move people to fresh air, reduce burner time, ventilate, and seek medical care if symptoms persist.","Correct recognition and response."],["S","Could be fumes from the burner building up in still air — get them away from the basket.","Correct action; doesn't name CO or the hypoxia type."],["W","Probably hyperventilation from the tether excitement — have them breathe into a paper bag.","Misdiagnosis that delays fresh air."],["W","Propane vapor is a stimulant, so drowsiness rules out the burner — it's just a long day.","Factually wrong and ignores a CO hazard."]]},{"id":"II-B-3","a":"II","t":"B","d":2,"ref":"AIM 8-1-6; PHAK ch. 17; AC 90-48E","q":"How does a pilot's physical or mental condition affect vision and scanning?","ans":[["B","Fatigue, hypoxia, alcohol, medications, stress, and dehydration all degrade visual acuity, scanning discipline, and peripheral detection. Empty-field myopia sets in when there's nothing to focus on. Low-sun glare at sunrise/sunset launches compounds it. Use a disciplined sector scan and stay fit to fly.","PTS II.B.1 elements."],["S","When you're tired or not feeling well you don't see as well, so you have to scan on purpose.","Correct core without specifics."],["W","Vision is fixed by your medical exam — condition doesn't matter if you passed the eye test.","Condition affects performance regardless of medical results."],["W","Mental condition affects decisions, not eyesight, so scanning technique stays the same.","Stress and fatigue degrade visual search."]]},{"id":"II-C-4","a":"II","t":"C","d":3,"ref":"BFH; FAA-H-8083-28 — Temperature inversions","q":"You climb out of the morning surface inversion and the balloon suddenly slows its climb. Why?","ans":[["B","Lift depends on the temperature difference between envelope air and ambient air. Climbing into the warmer inversion layer reduces that difference, so lift drops and the climb slows or stops — the balloon may seem to hit a ceiling. Descending back into the colder surface air increases lift. Anticipate with more heat when climbing into the inversion.","Correct physics and anticipation."],["S","It's warmer up there, so the balloon has less lift and needs more heat to keep climbing.","Correct reasoning in plain language."],["W","The air pressure drops in the inversion, which compresses the envelope and spills hot air.","Not the mechanism."],["W","Inversions push air downward, like a lid, which physically holds the balloon down.","Inversions are temperature structure, not a downward air current."]]},{"id":"II-D-3","a":"II","t":"D","d":2,"c":1,"ref":"14 CFR 91.119","q":"What minimum safe altitudes apply to you over a town and over open farmland?","ans":[["B","91.119 applies except when necessary for takeoff or landing: always an altitude allowing an emergency landing without undue hazard; over congested areas, 1,000 ft above the highest obstacle within 2,000 ft horizontally; over other than congested areas, 500 ft above the surface (except over open water or sparsely populated areas, where no closer than 500 ft to any person, vessel, vehicle, or structure).","Correct 91.119 values with the exception."],["S","1,000 feet over towns and 500 feet over the country, unless I'm taking off or landing.","Correct numbers; misses the 2,000-ft radius."],["W","Balloons are exempt from 91.119 because they're slow and can't steer around populated areas.","No balloon exemption exists."],["W","500 feet everywhere, since balloons don't have engines that could fail over the town.","Congested areas require 1,000 feet."]]},{"id":"II-D-4","a":"II","t":"D","d":2,"ref":"14 CFR 91.107(a)(3); 91.103; 91.3","q":"Do your passengers need seat belts, and what does 91.103 require of you before every flight?","ans":[["B","No — 91.107(a)(3) excepts free balloons that incorporate a basket or gondola from the seat/safety belt requirement. 91.103 requires the PIC to become familiar with all available information concerning every flight, including reliable performance information (elevation, gross weight, wind, temperature); for a flight not in the vicinity of an airport — which describes most balloon flights — that includes weather reports and forecasts, fuel requirements, and alternatives if the flight can't be completed as planned. 91.3 makes the PIC the final authority.","Correct exceptions and requirements."],["S","Balloons don't have seat belts, and I have to know the weather, fuel, and backup plans first.","Right in practice; no regulatory basis."],["W","Yes — every occupant needs an approved restraint, which is why baskets have handles.","Handles aren't seat belts, and balloons are excepted."],["W","No belts, and 91.103 only requires a weather briefing for flights away from the airport.","91.103 requires all available information on every flight, and weather, fuel and alternatives for flights away from an airport."]]},{"id":"II-E-4","a":"II","t":"E","d":2,"ref":"Sectional chart legend; AIM 3-2; 14 CFR 91.130/91.129","q":"On the sectional near your launch field there's a magenta vignette and a dashed blue circle. What do they tell you?","ans":[["B","A magenta vignette (shaded band) marks Class E airspace beginning at 700 ft AGL; outside it, Class E typically begins at 1,200 AGL. A dashed blue line is a Class D surface area — two-way radio communication with the tower is required before entry, and the ceiling is shown in brackets (in hundreds of feet MSL).","Correct chart interpretation."],["S","The faded magenta means controlled airspace starts lower, and the blue dashes are a tower's airspace.","Correct gist without altitudes."],["W","Magenta vignette is Class C; the dashed blue circle is Class E to the surface, no call required.","Misreads both symbols."],["W","Magenta vignette marks a TFR; dashed blue marks a restricted area to avoid entirely.","TFRs aren't charted that way; blue dashes are Class D."]]},{"id":"II-F-3","a":"II","t":"F","d":2,"ref":"14 CFR 61.35; 61.123(c); AC 61-65","q":"Your student wants to take the commercial balloon knowledge test. What do you need to give them?","ans":[["B","An endorsement from an authorized instructor certifying they completed the required ground training or a home-study course and are prepared for the knowledge test (61.35, 61.123(c)), along with proper identification. After the test, the AKTR's missed knowledge areas are reviewed before the practical test, with an endorsement.","Matches 61.35/61.123(c)."],["S","A logbook sign-off saying they're ready for the written, and then we review what they miss.","Correct gist."],["W","No endorsement — the knowledge test is open to anyone who shows a pilot certificate.","Commercial knowledge test requires an instructor endorsement or alternative."],["W","An endorsement on the back of their private certificate, valid for 60 days.","Endorsements go in the logbook/records, not on the certificate."]]},{"id":"III-A-8","a":"III","t":"A","d":1,"ref":"14 CFR 61.57(a); 61.56(d)","q":"What recent experience do you need to carry passengers, and does today's checkride count for anything?","ans":[["B","61.57(a): three takeoffs and three landings within the preceding 90 days as sole manipulator of the controls in an aircraft of the same category and class (lighter-than-air balloon). Passing a practical test for a certificate or rating satisfies the flight review requirement (61.56(d)) for another 24 calendar months.","Correct 61.57 and 61.56(d)."],["S","Three takeoffs and landings in the last 90 days, and I think a checkride resets the flight review.","Correct but uncertain."],["W","Three launches and landings in 90 days, but only if each flight lasts at least 30 minutes.","No duration requirement exists."],["W","Nothing extra — passenger currency applies to airplanes, not balloons.","61.57 applies to all category/class combinations."]]},{"id":"III-A-9","a":"III","t":"A","d":3,"ref":"14 CFR Part 91; 61.133; 119.1(e)(5), (e)(2); 91.147","q":"Under what rules does your ride business operate? Do you need an air carrier certificate or a 91.147 letter of authorization?","ans":[["B","Hot air balloon sightseeing flights are excepted from Part 119 (119.1(e)(5)), so they're conducted under Part 91 operating rules with the pilot exercising commercial privileges (61.133) — a second-class medical and the 100-hour inspection apply. No air carrier certificate is required. The 91.147 Letter of Authorization covers nonstop commercial air tours in airplanes, powered-lift, or rotorcraft (119.1(e)(2)), not balloons.","Correct framework."],["S","It's Part 91 with a commercial pilot — I'm pretty sure balloon rides don't need a 135 certificate.","Right answer, missing the 91.147 piece."],["W","Part 135, since it's passengers for hire — the company needs an air carrier certificate.","Balloon rides aren't conducted under Part 135."],["W","Part 91 plus a 91.147 letter of authorization, required for any air tour that carries paying passengers.","91.147 covers nonstop tours in airplanes, powered-lift and rotorcraft; 119.1(e)(5) excludes balloon sightseeing from Part 119."]]},{"id":"III-A-10","a":"III","t":"A","d":2,"ref":"14 CFR 39; 91.403; AC 39-7D","q":"What's the difference between an airworthiness directive and a manufacturer's service bulletin for your balloon?","ans":[["B","ADs are regulatory (14 CFR 39): compliance is mandatory, and the owner/operator is responsible (91.403); compliance is recorded in the maintenance records. Service bulletins are manufacturer recommendations — not mandatory for Part 91 operators unless incorporated by an AD or required by the flight manual/limitations — though following them is good practice.","Correct distinction."],["S","ADs are the FAA telling you to fix it; bulletins are the maker's suggestions you should still follow.","Correct gist."],["W","Both are mandatory for commercial operations, since ride flights carry passengers for hire.","SBs aren't automatically mandatory for Part 91 operations."],["W","Service bulletins are mandatory; ADs are recommendations unless the inspector flags them.","Reversed."]]},{"id":"III-B-5","a":"III","t":"B","d":2,"c":1,"ref":"FAA-H-8083-28 — METAR; BFH","q":"The 0600 METAR shows 27008G18KT. Talk me through what that means for a ride flight.","ans":[["B","Wind from 270° true at 8 knots, gusting 18 — a 10-knot gust spread. Gusts make inflation, launch, and landing hazardous and signal mechanical turbulence/mixing; winds may increase as the morning heats. Compare to my personal minimums, the operator's limits, and the manufacturer's guidance — most ride pilots would cancel.","Correct decode and risk judgment."],["S","Wind from the west around 8 knots with gusts to 18 — that's pretty sporty for passengers.","Correct decode, softer decision."],["W","270 degrees at 8 knots with a gust limit of 18 knots forecast for the afternoon only.","Misreads the METAR as a forecast."],["W","Wind toward 270 degrees at 8 knots, gusts 18 — fine, since the steady wind is under 10 knots.","Direction is FROM, and gusts can't be ignored."]]},{"id":"III-B-6","a":"III","t":"B","d":1,"ref":"BFH; FAA-H-8083-28","q":"Why do balloons fly around sunrise and sunset, and what's a pibal?","ans":[["B","Shortly after sunrise and in the couple of hours before sunset, surface winds are usually lightest and the air most stable, with minimal thermal activity. A pibal (pilot balloon) is a small helium balloon released at the launch site; watching its direction and speed as it rises shows the actual wind profile at various altitudes.","Correct."],["S","The air is calmer early and late, and the little helium balloon shows which way the wind goes up high.","Correct gist."],["W","Cooler air gives more lift; a pibal is a weighted streamer that measures the surface gust spread.","Pibals measure winds aloft, and the main reason is stability."],["W","FAA rules limit balloons to twilight hours; a pibal is a pressure barometer used for altimeter setting.","No such rule, and wrong definition."]]},{"id":"III-C-2","a":"III","t":"C","d":2,"ref":"PTS III.C; BFH","q":"Planning a flight from the county fairgrounds: what will you identify along the possible trajectories?","ans":[["B","Airspace (e.g., Class C/D boundaries, TFRs), obstructions and power lines (towers on the sectional, transmission corridors on maps), terrain and water, populated/congested areas (91.119), sensitive areas (livestock, wildlife refuges), and suitable landing areas with road access — for each wind direction at the altitudes I might fly.","PTS elements covered."],["S","Any airspace, tall towers, power lines, and where I could land with the chase crew getting in.","Correct essentials."],["W","Only the landing site at the end, since the track will change once airborne anyway.","PTS requires identifying airspace, obstructions, and landing areas along the route."],["W","Airspace and the final landing field — power lines aren't charted, so they can't be planned.","Major lines and towers are visible on charts and maps."]]},{"id":"III-C-3","a":"III","t":"C","d":3,"ref":"PTS III.C.3; BFH (pibals)","q":"Your pibal shows: surface calm, 1,000 ft AGL 090° at 6, 2,000 ft AGL 180° at 10. Your target landing area is due north of launch. How do you plan?","ans":[["B","Winds FROM 090 carry me west; FROM 180 carry me north. So: launch and climb to about 2,000 ft for the northbound leg, use lower layers to adjust east-west position, then descend through the layers to approach — allowing for the westward drift through 1,000 ft. Verify layers with a pibal before launch.","Correct reciprocal reasoning."],["S","Go up high to ride the south wind north, and account for drifting west on the way up and down.","Correct reasoning informally."],["W","Stay at 1,000 feet — wind from 090 will carry me north toward the target area.","090 wind carries the balloon west."],["W","Climb to 2,000 feet to ride the 180 wind south toward the target area.","A wind FROM 180 carries the balloon north, not south."]]},{"id":"III-D-5","a":"III","t":"D","d":2,"ref":"PTS III.D.2; Balloon Flight Manual","q":"You have 45 gallons usable, you plan on 15 gallons per hour, and you want to land with 15 gallons. How long can you fly?","ans":[["B","Usable fuel minus reserve: 45 − 15 = 30 gallons. At 15 gal/hr that's 2.0 hours planned flight time. Actual burn varies with load, ambient temperature, and maneuvering — monitor the burn rate in flight and adjust the commit-to-land point.","Correct math with the caveat."],["S","About two hours, since I keep a tank's worth back and burn roughly fifteen an hour.","Correct number with loose reasoning."],["W","Three hours — 45 gallons at 15 per hour, with the reserve counted as part of the flight time.","Ignores the planned reserve."],["W","One hour — burn rate doubles on landing approaches, so plan on 30 gallons per hour throughout.","Arbitrary assumption contradicting the stated planning rate."]]},{"id":"III-D-6","a":"III","t":"D","d":2,"ref":"BFH; Balloon Flight Manual","q":"You add one more passenger. What happens to envelope temperature, fuel burn, and margins?","ans":[["B","More weight requires more lift — a higher envelope temperature for equilibrium — which increases fuel burn, reduces the margin to maximum continuous and never-exceed temperatures, slows climb response, and reduces margins for obstacle clearance and landing aborts. Recheck the load chart.","Correct cause and effect."],["S","It's heavier, so I'll burn more and run hotter, and the balloon won't climb as quickly.","Correct effects without the limits check."],["W","Nothing significant — balloons have so much lift that one passenger is within the margin of error.","Every pound changes required temperature."],["W","Fuel burn goes up but envelope temperature stays the same; the burner just cycles more often.","Burner cycling raises the average envelope temperature."]]},{"id":"III-E-4","a":"III","t":"E","d":2,"ref":"BFH; Balloon Flight Manual","q":"What does your fuel pressure gauge tell you, and what would a low reading mean?","ans":[["B","Tank/line pressure feeding the burner, which depends mostly on propane temperature (vapor pressure) and any nitrogen pressurization. Low pressure means weaker burner output and slower response: cold fuel, an unpressurized tank in cold weather, a nearly empty nitrogen-pressurized tank, a partially closed valve, or a restriction. Switch tanks and plan accordingly.","Correct interpretation."],["S","How much push the fuel has — if it's low, the burner won't put out as much heat, so I'd switch.","Correct gist."],["W","Fuel quantity remaining — pressure drops in step with the fuel level in the tank.","It's a pressure gauge, not a quantity gauge; propane pressure tracks temperature (nitrogen-boosted tanks drop near empty)."],["W","Envelope pressure — a low reading means the parachute vent is leaking and needs reseating.","Confuses the fuel gauge with the envelope."]]},{"id":"IV-A-4","a":"IV","t":"A","d":2,"ref":"PTS IV; VII.F","q":"Teach me the high-wind landing. What are the common errors?","ans":[["B","Objective: land safely in high wind within a suitable area, with occupants briefed and the envelope deflated promptly. Common errors: choosing a field without enough run-out, incomplete passenger briefing, late fuel/pilot shutdown, late deflation (dragging), approaching too fast or too high, and letting occupants exit before the basket stops.","Covers PTS elements and common errors."],["S","Picking a field that's too small and not briefing well — and waiting too long to open the top.","Partial list."],["W","The most common error is deflating too early; keep the envelope up until the basket stops.","Late deflation causes dragging."],["W","Shutting off fuel early is the error — keep both burners live through the drag to stay warm.","BFH: when committed, fuel off, lines drained, pilot lights out (one burner may be kept to climb out of a bad approach, not through the drag)."]]},{"id":"IV-A-5","a":"IV","t":"A","d":2,"ref":"PTS IV; VII.B","q":"Teach the launch over an obstacle. What instructional aids would you use?","ans":[["B","Objective, elements (height, distance, wind, false lift, preheat, decisive burn), common errors (launching too light, relying on false lift, hesitating), and completion standards. Aids: a whiteboard sketch of the climb gradient vs. obstacle, a simple time-distance calculation, and video of a launch for debrief.","Covers lesson elements and aids."],["S","I'd draw the trees and the climb path on a whiteboard and go over why false lift fools you.","Good aid, partial coverage."],["W","No aids — this maneuver can only be taught by demonstration in strong wind.","PTS expects aids where appropriate; it can be taught on the ground."],["W","A wind sock only, since the lesson is about reading surface wind direction.","Misses height, distance, false lift, and climb rate."]]},{"id":"V-A-2","a":"V","t":"A","d":2,"ref":"PTS V.A; BFH","q":"You arrive at a familiar launch field and the farmer has turned cattle into it. What now?","ans":[["B","Don't launch there. Livestock can panic, injure themselves, or damage fences; the landowner relationship and permission are critical. Choose an alternate launch site with permission, considering the same size, surface, obstacles, and downwind landing options.","Correct judgment."],["S","I'd go somewhere else, since cows and a burner don't mix and I don't want to upset the farmer.","Correct in plain terms."],["W","Launch quickly with minimal burns — cattle get used to balloons after the first burn or two.","Livestock stress and injury risk."],["W","Have the crew herd the cattle to one corner of the field, then launch from the far end.","Disregards the owner's use of the property."]]},{"id":"V-B-2","a":"V","t":"B","d":2,"c":1,"ref":"PTS V.B; BFH","q":"Your crown line handler is a first-time volunteer. What exactly do you tell them?","ans":[["B","Wear gloves; take position downwind at the end of the crown line; during cold inflation hold tension to keep the envelope steady; as it rises, walk toward the basket, controlling but never stopping it; never wrap the line around a hand, wrist, or body; if you start to be lifted, let go immediately; stay clear of the burner.","Complete safety briefing."],["S","Hold the rope steady and walk it toward the basket as it goes up — and don't wrap it on your hand.","Correct core, missing let-go rule and gloves."],["W","Hold it as tightly as you can and don't let go until the balloon is fully upright, no matter what.","Handlers have been lifted and injured."],["W","Tie the line to your belt so your hands are free to help the mouth crew if needed.","Never attach the line to a person."]]},{"id":"V-C-2","a":"V","t":"C","d":2,"c":1,"ref":"PTS V.C; Balloon Flight Manual","q":"How do you verify the envelope-to-basket attachment during assembly?","ans":[["B","Follow the manual: correct number and routing of cables, each attached to the correct load frame point with the specified carabiner/fastener, gates closed and locked, no twisted or crossed cables, burner frame secured, and a second-person check or checklist before inflation. Verify again in the pre-launch check.","Matches PTS V.C.4–5."],["S","Make sure every cable is clipped to the right spot and every carabiner is closed before inflating.","Correct core."],["W","Leave the screw gates slightly open so you can disconnect fast in an emergency.","Gates must be closed/locked as the manual specifies."],["W","The crew chief handles attachments; the pilot only checks the burner and the fuel system.","PTS holds the pilot responsible for assembly."]]},{"id":"V-D-2","a":"V","t":"D","d":2,"c":1,"ref":"PTS V.D; Balloon Flight Manual/ICA; 14 CFR 43.3(g), 43 App. A(c), 43.9","q":"During preflight you find a 2-inch hole in the envelope near the crown. Can you fly?","ans":[["B","Not until it's evaluated against the manufacturer's damage limits in the flight manual/ICA. Location matters: damage near the crown, at load tapes, or in high-stress panels is more critical than near the mouth. If outside limits or within a no-damage zone, it must be repaired by an authorized person (or as preventive maintenance only if allowed) before flight.","Correct process."],["S","Probably not — damage near the top is the worst place, so I'd check the manual or get it fixed.","Correct direction, less precise."],["W","Yes — two inches is small and the parachute top covers that area during flight anyway.","Ignores damage limits and location."],["W","Yes, if I tape it with fabric repair tape, since that counts as preventive maintenance.","Small fabric repairs can be preventive maintenance (Part 43 App. A(c)) — but only per the manufacturer's instructions and damage limits, not in load-tape areas, and recorded per 43.9."]]},{"id":"V-E-2","a":"V","t":"E","d":2,"c":1,"ref":"PTS V.E; BFH","q":"Halfway through cold inflation a gust rolls the envelope. What do you do?","ans":[["B","Stop the inflation — no hot burns into a distorted or rolling envelope. Have crew control the mouth and crown line, let the gust pass, reassess wind and conditions (gusts may mean it's a no-go), and reposition if needed. Only resume when the envelope is stable and conditions are acceptable.","Correct priorities."],["S","Hold off burning until the envelope settles down and make sure the wind isn't too strong to continue.","Correct essentials."],["W","Burn quickly to get it upright before the next gust — a standing balloon resists wind better.","Burning into a rolling envelope risks fabric burns and injury."],["W","Have the crown line handler pull hard against the gust to keep the envelope from rolling.","Can injure the handler and doesn't stabilize the envelope."]]},{"id":"V-F-2","a":"V","t":"F","d":2,"c":1,"ref":"PTS V.F; 14 CFR 91.3","q":"In flight, a passenger climbs onto the basket edge for a better photo. What do you do?","ans":[["B","Immediately direct them back down — passengers must stay inside the basket. As PIC (91.3) I'm responsible for safety; an occupant on the rim risks falling and shifts weight. Re-brief everyone, and if they won't comply, land at the first suitable site.","Correct and firm."],["S","Tell them to get down right away and remind everyone to stay inside the basket.","Correct action."],["W","Let it go if we're above 500 feet, since there's nothing to hit if they fall — just hold on tight.","Fall hazard regardless of altitude."],["W","Allow it if they hold a suspension cable, since the cables are rated for far more than one person.","Cable strength isn't the issue; fall and control are."]]},{"id":"V-G-2","a":"V","t":"G","d":1,"ref":"PTS V.G.7; BFH","q":"What is equilibrium, and how do you know you've reached it before launch?","ans":[["B","Equilibrium is when lift equals weight — the balloon neither rises nor sinks. Before launch, heat until the basket becomes light: with crew hands off (or the tie-off just slack) it stays in place; a little more heat gives positive lift for launch.","Correct definition and check."],["S","When the basket starts to feel light and just floats there — then I add a bit more heat to go.","Correct practical description."],["W","When the envelope temperature gauge reads the number printed in the manual for launch.","Equilibrium depends on load and conditions, not one fixed number."],["W","When the tie-off line is tight, showing the balloon is pulling upward with positive lift.","A taut tie-off means positive lift, not equilibrium."]]},{"id":"VI-A-3","a":"VI","t":"A","d":2,"ref":"AIM 3-2-5; 14 CFR 91.129(c)","q":"Your track will clip a Class D surface area. Give me your call to the tower.","ans":[["B","Before entry: 'Anytown Tower, Balloon N1234X, four miles west at two thousand, drifting east at eight knots, request transit through your Class D, will remain above one thousand five hundred.' Establish two-way communication (the tower responding with my call sign) before entering, and say 'unable' to any instruction I can't fly.","Correct format and communication rule."],["S","Tower, balloon tail number, where I am and how high, that I'm drifting in — can I come through?","Correct elements informally."],["W","Enter first and call once inside — towers expect balloons and can't stop them anyway.","Two-way comms required before entering Class D."],["W","Call ground control, since balloons are slow-moving and handled like surface traffic.","Airborne traffic talks to tower."]]},{"id":"VI-A-4","a":"VI","t":"A","d":2,"ref":"BFH; 47 CFR 22.925","q":"You lose radio contact with your chase crew mid-flight. What's your plan?","ans":[["B","Try the backup radio or a relay through another balloon. Fly a predictable track, choose a landing site near roads where the crew can find me, and land within the briefed window; call the crew by phone after landing (47 CFR 22.925 prohibits cell use while airborne). The crew follows the pre-briefed lost-contact plan (last known track, landing time).","Correct, pre-briefed approach."],["S","Try my backup radio, and if that fails, land somewhere easy to find near a road.","Correct gist."],["W","Keep flying until contact is restored so the crew can find me before I commit to a field.","Extends the flight unnecessarily; fuel and options shrink."],["W","Switch to the tower frequency and ask ATC to relay to my chase crew by phone.","ATC isn't a relay for ground crews."]]},{"id":"VII-A-2","a":"VII","t":"A","d":2,"c":1,"ref":"PTS VII.A; BFH","q":"You release the quick release and the balloon lifts a few feet, then settles back down. What happened and what now?","ans":[["B","Not enough true buoyancy — likely false lift or insufficient heat. Don't keep bouncing toward obstacles: either add heat decisively for a positive climb if the downwind path is clear, or have the crew hold the basket and reset. Recheck the load and conditions.","Correct diagnosis and options."],["S","It wasn't hot enough — I'd burn more before trying again, with the crew holding on.","Correct action."],["W","Normal — a bounce helps the envelope shape up; let it hop along until it climbs out.","Hopping toward obstacles is hazardous."],["W","Vent to settle it firmly, then re-release with the same heat once the wind calms.","Same heat repeats the failure."]]},{"id":"VII-C-2","a":"VII","t":"C","d":2,"ref":"PTS VII.C.2; BFH","q":"From 800 feet, how do you figure out the surface wind at your chosen field?","ans":[["B","Watch smoke, flags, dust, tree movement, ripples on water, and crop movement; observe other balloons' tracks; drop to a lower altitude to see how the track changes; and ask the crew for observations. Surface wind often differs in speed and direction from the wind at altitude.","Correct cues."],["S","Look for flags or smoke near the field, and maybe ask the crew what the wind is doing there.","Correct core."],["W","Use the winds aloft forecast for the surface level — it's accurate enough near the ground.","Surface winds aren't forecast that way and vary locally."],["W","Assume it matches my current drift at 800 feet, since winds near the ground follow the upper flow.","Surface winds commonly differ."]]},{"id":"VII-C-3","a":"VII","t":"C","d":3,"c":1,"s":1,"ref":"PTS VII.C.7; BFH","q":"On final, 200 feet up, you realize the field you picked has a hidden ditch and fence near the touchdown point. Decide.","ans":[["B","Abort now — burn early and decisively given lag, climb to a safe altitude with margin over obstacles, then select another field. Re-brief passengers and check fuel. A late decision near the ground leaves no room for the burner to take effect.","Correct timing and action."],["S","Go around — burn and climb back up, then find a better spot further on.","Correct decision, less detail."],["W","Continue and touch down short of the ditch — once committed below 200 feet, never abort.","No such rule; late abort window is what matters."],["W","Vent harder to land before the ditch, then use the drop line to hold the basket in place.","Rushed descent into a hazard."]]},{"id":"VII-D-2","a":"VII","t":"D","d":2,"ref":"PTS VII.D; BFH","q":"What makes a steep approach riskier than a shallow one, and how do you manage it?","ans":[["B","Higher descent rate near the ground means less time to arrest the descent given burner lag, possible envelope distortion, and a harder touchdown. Manage it with a planned arrest point well above the ground, smaller vent inputs, early burns, and a firm abort decision.","Correct risk and management."],["S","You're coming down faster, so you've got to start burning sooner to stop in time.","Correct core."],["W","It's riskier only in high wind; in calm air a steep approach is actually the safest option.","Arresting the descent is the key risk in any wind."],["W","Steep approaches are safer because less time near obstacles means less risk overall.","Ignores arrest-rate risk."]]},{"id":"VII-E-2","a":"VII","t":"E","d":2,"ref":"BFH ch. 8 (crew tasks); good practice","q":"When do you use a drop line, and how do you brief the crew on it?","ans":[["B","In light winds, a drop line lets the crew guide the basket to a precise spot or around obstacles. Brief: grab the line only when told, use gloves, never wrap it around hands or body, don't tie it to a vehicle or object, keep it clear of obstacles and the burner, and let go if lifted.","Correct use and safety brief."],["S","For calm landings so the crew can walk me in — I'd tell them to wear gloves and not wrap it.","Correct core."],["W","In high winds so the crew can stop the basket from dragging after touchdown.","Crew can't hold a balloon in high wind; injury risk."],["W","Tie it to the chase vehicle so the balloon can be towed to the trailer after landing.","Never tie off to a vehicle in flight."]]},{"id":"VII-F-2","a":"VII","t":"F","d":2,"c":1,"ref":"PTS VII.F.8; BFH","q":"Why do you extinguish pilot lights and shut off fuel before a high-wind touchdown?","ans":[["B","A high-wind landing may tip the basket over and drag it, putting the burner close to the ground, fabric, and occupants. An open flame and pressurized fuel lines in a tipping basket create a fire and burn hazard. Shut off fuel and extinguish pilot lights per the flight manual so nothing can ignite as the basket drags.","Correct reason."],["S","So if the basket tips over, there's no flame or fuel feeding a fire near the passengers.","Correct gist."],["W","To save fuel for the recovery and keep the tanks from venting on the ride home.","Not the reason."],["W","The FAA requires it on every landing, regardless of wind, for noise abatement near farms.","Not a noise rule; it's per the manual for safety."]]},{"id":"VII-B-2","a":"VII","t":"B","d":3,"c":1,"s":1,"ref":"PTS VII.B; ADM","q":"Your only launch option has power lines 400 feet downwind and wind at 8 knots. The passengers are excited. Go or no-go?","ans":[["B","BFH guideline is 100 ft of clearance per knot — 800 ft at 8 kt — and only 400 ft is available. 400 ft at 8 kt (~810 ft/min) is about 30 seconds. Unless clearance is assured with a large margin and no false-lift dependence, it's a no-go or a relocation. Passenger enthusiasm is an external pressure, not a factor.","Correct analysis and ADM."],["S","Only if I'm sure I can climb way over the lines in time — otherwise we find a different field.","Correct decision rule."],["W","Go — balloons climb faster than they drift, so 400 feet is plenty at any normal load.","Unfounded assumption."],["W","Go, but launch light and let the wind lift us over the wires by the time we reach them.","Relies on false lift."]]},{"id":"VIII-A-2","a":"VIII","t":"A","d":2,"ref":"PTS VIII.A; Balloon Flight Manual","q":"Why does your manual limit the maximum rate of climb?","ans":[["B","High climb rates create airflow over the crown that can distort the envelope and force the parachute vent, increase envelope temperatures from heavy burning, reduce time to detect traffic above (blind spot), and risk overshooting altitude or airspace. Stay within the manual's limits.","Correct reasons."],["S","Going up too fast can deform the top and overheat the envelope — plus you can't see above.","Correct gist."],["W","To conserve fuel — the climb limit exists only to keep burn rates economical.","Not the safety rationale."],["W","Fast climbs reduce air density inside the envelope, causing a sudden loss of all lift.","Physically incorrect."]]},{"id":"VIII-B-2","a":"VIII","t":"B","d":2,"ref":"PTS VIII.B; BFH","q":"You're holding level at 1,500 feet when the vario shows a 100 fpm descent starting. What's your response?","ans":[["B","Respond to the trend immediately with a moderate burn, anticipating lag — then reduce once the vario shows the descent arresting, so I don't overshoot into a climb. Small, timely corrections keep altitude within ±50 ft.","Correct anticipation."],["S","Give it a burn right away and watch the vario so I don't end up climbing too much.","Correct gist."],["W","Wait until the altimeter confirms a 50-foot loss before burning, to avoid chasing the needle.","Too late given lag."],["W","Make a long burn until the vario shows a strong climb, then vent back to level.","Yo-yo flying; overburn then overvent."]]},{"id":"VIII-C-2","a":"VIII","t":"C","d":2,"ref"
